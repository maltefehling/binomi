<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flächenbild erstellen</title>
<!-- Hilfe zu den Übungsaufgaben (Skript S. 3–4): Summanden aus Zahl und Variable einstellen,
     dann schrittweise aufdecken: Malaufgaben → Produkte → Summe. Seit 30.9.2026 eigene Seite (nicht mehr aus _vorlage.html). -->
<style>
  :root{
    --blue:#bcd3f2; --green:#c6e8c0; --orange:#fbd9a8;
    --blue-d:#2e5d9f; --green-d:#3f8f3a; --orange-d:#c0700f;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .prompt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:18px;line-height:1.45;margin-bottom:12px}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .panel{flex:1 1 300px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  svg{flex:1 1 480px;max-width:600px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .sm{margin-bottom:16px}
  .sm h2{font-size:17px;margin:0 0 8px;color:var(--acc)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .num{display:flex;align-items:center;gap:6px}
  .num button{width:44px;height:44px;border-radius:10px;border:1px solid var(--acc);background:#fff;color:var(--acc);font-size:22px;font-weight:700}
  .num input{width:70px;height:44px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:10px}
  .chips{display:flex;gap:6px}
  .chip{min-width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
  .term{font-size:26px;font-weight:700;color:var(--acc);margin:6px 0 14px}
  .steps{display:flex;flex-direction:column;gap:8px}
  .btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font-size:17px;font-weight:600;min-height:46px;text-align:left}
  .btn[disabled]{opacity:.35}
  .btn.ghost{background:#fff;color:var(--acc)}
  .sum{font-size:22px;line-height:1.6;margin-top:14px;min-height:36px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Flächenbild erstellen</h1></header>
<main>
  <div class="prompt">Stelle den <b>1. Summanden</b> und den <b>2. Summanden</b> aus deiner Aufgabe ein. Dann deckst du Schritt für Schritt auf: erst die Malaufgaben, dann die Produkte, zum Schluss die Summe.</div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 600 600" aria-label="Flächenbild"></svg>
    <div class="panel">
      <div class="sm" id="sm1"><h2>1. Summand</h2></div>
      <div class="sm" id="sm2"><h2>2. Summand</h2></div>
      <div class="term" id="term"></div>
      <div class="steps">
        <button class="btn" id="b1">① Malaufgaben zeigen</button>
        <button class="btn" id="b2" disabled>② Produkte zeigen</button>
        <button class="btn" id="b3" disabled>③ Summe zeigen</button>
        <button class="btn ghost" id="b0">Von vorn</button>
      </div>
      <div class="sum" id="sum"></div>
    </div>
  </div>
</main>
<footer>Fehling · Erste binomische Formel</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const VARS=["","x","a","b"];
const st={s1:{c:1,v:"x"},s2:{c:4,v:""},step:0};

// ---------- kleine Algebra: Monome als {c, vars:{x:2,…}} ----------
const mono=s=>({c:s.c,vars:s.v?{[s.v]:1}:{}});
const mul=(p,q)=>{const v={...p.vars};for(const k in q.vars)v[k]=(v[k]||0)+q.vars[k];return {c:p.c*q.c,vars:v};};
const key=m=>Object.keys(m.vars).sort().map(k=>k+m.vars[k]).join("");
const SUP={2:"²",3:"³"};
function fmt(m){
  const vs=Object.keys(m.vars).sort().map(k=>k+(m.vars[k]>1?SUP[m.vars[k]]:"")).join("");
  if(!vs)return String(m.c);
  return (m.c===1?"":String(m.c))+vs;
}
const fmtSummand=s=>s.v?(s.c===1?s.v:s.c+s.v):String(s.c);

// ---------- Eingabe: Zahl + Variable je Summand ----------
function buildInput(id,s){
  const box=document.getElementById(id);
  const row=document.createElement("div");row.className="row";
  const num=document.createElement("div");num.className="num";
  const minus=document.createElement("button");minus.textContent="−";minus.setAttribute("aria-label","kleiner");
  const inp=document.createElement("input");inp.type="number";inp.inputMode="numeric";inp.min=1;inp.max=99;inp.value=s.c;inp.setAttribute("aria-label","Zahl");
  const plus=document.createElement("button");plus.textContent="+";plus.setAttribute("aria-label","größer");
  const set=c=>{s.c=Math.max(1,Math.min(99,c||1));inp.value=s.c;reset();};
  minus.onclick=()=>set(s.c-1);plus.onclick=()=>set(s.c+1);inp.onchange=()=>set(parseInt(inp.value,10));
  num.append(minus,inp,plus);
  const chips=document.createElement("div");chips.className="chips";
  VARS.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v||"ohne";b.setAttribute("aria-pressed",s.v===v);
    b.onclick=()=>{s.v=v;chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));reset();};chips.appendChild(b);});
  row.append(num,chips);box.appendChild(row);
}

// ---------- Flächenbild ----------
const X=110,Y=90,S=440,A=S*0.6,B=S-A;
const COL={a2:"var(--blue)",ab:"var(--green)",b2:"var(--orange)"};
function draw(){
  svg.innerHTML="";
  const s1=st.s1,s2=st.s2,t1=fmtSummand(s1),t2=fmtSummand(s2);
  const lab=(x,y,t,size=28)=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":size,"font-weight":700,fill:"var(--ink)"});e.textContent=t;};
  lab(X+A/2,Y-40,t1);lab(X+A,Y-40,"+",24);lab(X+A+B/2,Y-40,t2);
  lab(X-50,Y+A/2,t1);lab(X-50,Y+A,"+",24);lab(X-50,Y+A+B/2,t2);
  const m1=mono(s1),m2=mono(s2);
  const parts=[
    [X,Y,A,A,"a2",t1,t1,mul(m1,m1)],
    [X+A,Y,B,A,"ab",t1,t2,mul(m1,m2)],
    [X,Y+A,A,B,"ab",t1,t2,mul(m1,m2)],
    [X+A,Y+A,B,B,"b2",t2,t2,mul(m2,m2)]];
  parts.forEach(([x,y,w,h,k,f1,f2,p])=>{
    el("rect",{x,y,width:w,height:h,fill:COL[k],stroke:"var(--ink)","stroke-width":3});
    if(st.step>=1){const t=el("text",{x:x+w/2,y:y+h/2-(st.step>=2?20:0),"text-anchor":"middle","dominant-baseline":"central","font-size":24,fill:"var(--ink)"});t.textContent=f1+" · "+f2;}
    if(st.step>=2){const t=el("text",{x:x+w/2,y:y+h/2+22,"text-anchor":"middle","dominant-baseline":"central","font-size":26,"font-weight":700,fill:"var(--ink)"});t.textContent="= "+fmt(p);}
  });
  document.getElementById("term").textContent="("+t1+" + "+t2+")²";
  const sum=document.getElementById("sum");sum.innerHTML="";
  if(st.step>=3){
    const ps=parts.map(p=>p[7]);
    const c=(txt,col)=>`<b style="color:var(--${col}-d)">${txt}</b>`;
    // gleichartige Glieder zusammenfassen (die zwei grünen Rechtecke sind gleich)
    const map=new Map();ps.forEach(p=>{const k=key(p);map.set(k,map.has(k)?{...p,c:map.get(k).c+p.c}:p);});
    const zus=[...map.values()];
    let line1=`(${t1} + ${t2})² = ${c(fmt(ps[0]),"blue")} + ${c(fmt(ps[1]),"green")} + ${c(fmt(ps[2]),"green")} + ${c(fmt(ps[3]),"orange")}`;
    let line2;
    if(zus.length===1&&key(zus[0])==="") line2=`= <b>${zus[0].c}</b>`;
    else line2="= <b>"+zus.map(fmt).join(" + ")+"</b>";
    sum.innerHTML=line1+"<br>"+line2;
  }
  document.getElementById("b1").disabled=st.step>=1;
  document.getElementById("b2").disabled=st.step!==1;
  document.getElementById("b3").disabled=st.step!==2;
}
function reset(){st.step=0;draw();}
document.getElementById("b1").onclick=()=>{st.step=1;draw();};
document.getElementById("b2").onclick=()=>{st.step=2;draw();};
document.getElementById("b3").onclick=()=>{st.step=3;draw();};
document.getElementById("b0").onclick=reset;
buildInput("sm1",st.s1);buildInput("sm2",st.s2);draw();
</script>
</body>
</html>
