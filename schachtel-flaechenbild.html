<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aus der Schachtel wird ein Flächenbild</title>
<!-- I.3b Zweite binomische Formel (12.10.2026): Überleitung vom Einstieg zum Flächenbild. Toms Schachtel (rechte Spalte + untere Reihe gegessen)
     verwandelt sich in die Rechentabelle mit den Seiten 10 und −1: 100 − 10 − 10 + 1 = 81. Lenas Schachtel (10 und −2) rechnen die SuS danach im Skript. -->
<style>
  :root{
    --f1:#bcd3f2; --f2:#c6e8c0; --f3:#fbd9a8; --c2:#3f8f3a; --c3:#c0700f; --eat:#d64545;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;min-height:46px}
  .btn[aria-pressed="true"]{background:var(--acc);color:#fff}
  .btn[disabled]{opacity:.35}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 520px;max-width:640px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 280px}
  .cap{min-height:100px;font-size:21px;font-weight:600;color:var(--acc);line-height:1.4;margin:4px 0 12px}
  .calc{font-size:25px;line-height:1.7;min-height:80px}
  .calc .e{color:var(--eat);font-weight:700}.calc .g{color:var(--c2);font-weight:700}.calc .o{color:var(--c3);font-weight:700}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
  .blink{animation:bl .5s ease-in-out 6 alternate}
  @keyframes bl{from{opacity:1}to{opacity:.15}}
</style>
</head>
<body>
<header><h1>Aus der Schachtel wird ein Flächenbild</h1></header>
<main>
  <div class="bar"><button class="btn" id="go">▶ Abspielen</button></div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 560 520" aria-label="Toms Pralinenschachtel verwandelt sich in ein Flächenbild"></svg>
    <div class="side">
      <div class="cap" id="cap">Das ist Toms Schachtel vom Anfang. Tippe auf „Abspielen“.</div>
      <div class="calc" id="calc"></div>
    </div>
  </div>
</main>
<footer>Fehling · Zweite binomische Formel</footer>

const wait=ms=>new Promise(r=>setTimeout(r,ms*SLOW));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const N=10,C=36,X0=100,Y0=80,S=N*C,GAP=14,T=44;   // T = Dicke der Streifen in der Rechentabelle
let run=0;
const txt=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":o.size||22,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:o.op??1});
  if(o.rot)e.setAttribute("transform",`rotate(${o.rot} ${x} ${y})`);e.textContent=t;return e;};
// Malaufgabe im Streifen einblenden, kurz stehen lassen, dann wird daraus das Ergebnis
async function rechnung(x,y,auf,erg,o,alive){
  const a=txt(x,y,auf,{...o,op:0});await tween(700,k=>a.setAttribute("opacity",k));await wait(2200);if(!alive())return;
  const b=txt(x,y,erg,{...o,op:0});await tween(900,k=>{a.setAttribute("opacity",1-k);b.setAttribute("opacity",k);});}
let pral,colR,rowR,badge;
// Ausgangsbild: Toms Schachtel wie am Ende des Einstiegs (Spalte und Reihe gegessen, Ecke doppelt)
function start(){
  svg.innerHTML="";
  el("rect",{x:X0-6,y:Y0-6,width:S+12,height:S+12,rx:8,fill:"#f6efe6",stroke:"#8a6a4a","stroke-width":3,id:"rahmen"});
  pral=el("g",{});
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    el("rect",{x:X0+c*C,y:Y0+r*C,width:C,height:C,fill:"#fff",stroke:"#e2d6c8","stroke-width":1},pral);
    el("image",{href:IMG.truffel,x:X0+c*C+4,y:Y0+r*C+4,width:C-8,height:C-8},pral);}
  colR=el("rect",{x:X0+(N-1)*C+2,y:Y0+2,width:C-4,height:S-4,rx:5,fill:"var(--eat)",opacity:.4});
  rowR=el("rect",{x:X0+2,y:Y0+(N-1)*C+2,width:S-4,height:C-4,rx:5,fill:"var(--eat)",opacity:.4});
  badge=txt(X0+(N-.5)*C,Y0+(N-.5)*C,"2×",{size:14,w:800,fill:"#fff"});
  txt(X0+S/2,Y0-30,"10");txt(X0-30,Y0+S/2,"10");
  calc.innerHTML="Toms Rechnung: 100 − 10 − 10 = 80<br>Gezählt: 9 · 9 = <b>81</b>";
}
async function play(){
  const my=++run,alive=()=>my===run,say=t=>{if(alive())cap.textContent=t;};
  document.getElementById("go").textContent="↻ Nochmal";start();
  say("Das ist Toms Schachtel vom Anfang: Die rechte Spalte und die untere Reihe sind gegessen.");
  await wait(2600);if(!alive())return;
  say("Wir machen daraus ein Flächenbild. Zuerst die ganze Schachtel: 10 · 10 = 100.");
  const blau=el("rect",{x:X0,y:Y0,width:S,height:S,fill:"var(--f1)",stroke:"var(--ink)","stroke-width":3,opacity:0});
  svg.insertBefore(blau,colR);
  await tween(1200,k=>{pral.setAttribute("opacity",1-k);blau.setAttribute("opacity",k);document.getElementById("rahmen").setAttribute("opacity",1-k);});
  const t100=txt(X0+S/2,Y0+S/2,"10 · 10 = 100",{size:26,op:0});await tween(500,k=>t100.setAttribute("opacity",k));
  calc.innerHTML="<b>100</b>";
  await wait(2000);if(!alive())return;

  say("Tom isst die rechte Spalte. Sie kommt als Streifen an den Rand – sie wird abgezogen.");
  badge.setAttribute("opacity",0);
  const cx0=X0+(N-1)*C+2,cx1=X0+S+GAP;
  await tween(1400,k=>{k=ease(k);colR.setAttribute("x",cx0+(cx1-cx0)*k);colR.setAttribute("width",C-4+(T-C+4)*k);colR.setAttribute("height",S-4+(4)*k);colR.setAttribute("y",Y0+2-2*k);
    colR.setAttribute("opacity",.4+.6*k);colR.setAttribute("fill",k>.5?"var(--f2)":"var(--eat)");});
  colR.setAttribute("stroke","var(--c2)");colR.setAttribute("stroke-width",3);colR.setAttribute("rx",0);
  txt(cx1+T/2,Y0-30,"−1",{fill:"var(--c2)"});
  await wait(800);if(!alive())return;
  say("Der Streifen ist 10 hoch und −1 breit: 10 · (−1) = −10.");
  await rechnung(cx1+T/2,Y0+S/2,"10 · (−1)","−10",{fill:"var(--c2)",size:22,rot:-90},alive);if(!alive())return;
  calc.innerHTML="<b>100</b> <span class='g'>− 10</span>";
  await wait(2200);if(!alive())return;

  say("Dann die untere Reihe. Auch sie kommt als Streifen an den Rand.");
  const ry0=Y0+(N-1)*C+2,ry1=Y0+S+GAP;
  await tween(1400,k=>{k=ease(k);rowR.setAttribute("y",ry0+(ry1-ry0)*k);rowR.setAttribute("height",C-4+(T-C+4)*k);rowR.setAttribute("width",S-4+4*k);rowR.setAttribute("x",X0+2-2*k);
    rowR.setAttribute("opacity",.4+.6*k);rowR.setAttribute("fill",k>.5?"var(--f2)":"var(--eat)");});
  rowR.setAttribute("stroke","var(--c2)");rowR.setAttribute("stroke-width",3);rowR.setAttribute("rx",0);
  txt(X0-30,ry1+T/2,"−1",{fill:"var(--c2)"});
  await wait(800);if(!alive())return;
  say("Dieser Streifen ist −1 hoch und 10 breit: (−1) · 10 = −10.");
  await rechnung(X0+S/2,ry1+T/2,"(−1) · 10","−10",{fill:"var(--c2)",size:22},alive);if(!alive())return;
  calc.innerHTML="<b>100</b> <span class='g'>− 10 − 10</span>";
  await wait(2200);if(!alive())return;

  say("Die Praline in der Ecke steckt in beiden Streifen – sie wurde zweimal abgezogen. Also kommt sie einmal wieder dazu: (−1) · (−1) = +1.");
  const ec=el("rect",{x:cx1,y:ry1,width:T,height:T,fill:"var(--f3)",stroke:"var(--c3)","stroke-width":4,opacity:0});
  const te=txt(cx1+T/2,ry1+T/2,"+1",{fill:"var(--c3)",size:20,op:0});
  await tween(600,k=>{ec.setAttribute("opacity",k);te.setAttribute("opacity",k);});ec.classList.add("blink");
  calc.innerHTML="(10 − 1)²<br>= <b>100</b> <span class='g'>− 10 − 10</span> <span class='o'>+ 1</span><br>= <b>81</b> &nbsp;✓ wie gezählt";
  await wait(3600);if(!alive())return;
  say("Mach es jetzt im Skript mit Lenas Schachtel: Seiten 10 und −2.");
}
document.getElementById("go").onclick=play;
start();
</script>
</body>
</html>
