<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wie werde ich die Brüche los?</title>
<!-- I.6 Bruchgleichungen, Einstieg (2.11.2026, Wunsch Malte): Warum nimmt man die Gleichung mal 6?
     Die Nenner 2 und 3 werden aus der Gleichung herausgezogen und bilden die Seiten einer Pralinenschachtel 2 · 3 = 6.
     Die 6 lässt sich gerecht in 2 Teile (je 3) und in 3 Teile (je 2) teilen – beide Nenner stecken in ihr.
     Darum: alles mal 6, die Brüche verschwinden. Nur teilerfremde Nenner; der kleinste Hauptnenner folgt in hauptnenner.html. -->
<style>
  :root{--n1:#2e5d9f;--n1bg:#dbe7f7;--n2:#3f8f3a;--n2bg:#dcefd9;--hl:#c0700f;--hlbg:#fde7c8;
    --schachtel:#fdf6ea;--schachtelL:#c9a27a;--praline:#6b3f22;
    --ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;min-height:46px}
  .btn[aria-pressed="true"]{background:var(--acc);color:#fff}
  .btn .fr{font-size:.9em}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 520px;max-width:640px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 300px}
  .cap{min-height:96px;font-size:21px;font-weight:600;color:var(--acc);line-height:1.4;margin:4px 0 12px}
  .calc{font-size:24px;line-height:2.1;min-height:60px}
  .calc .h{color:var(--hl);font-weight:800}
  .calc .b1{color:var(--n1);font-weight:800}
  .calc .b2{color:var(--n2);font-weight:800}
  .calc small{font-size:17px;color:var(--muted)}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .1em;font-size:.95em}
  .fr span:last-child{border-top:2px solid currentColor;padding:0 .15em}
  .merke{display:none;background:#e3eef9;border:1px solid #b9d0ea;border-radius:12px;padding:10px 14px;font-size:19px;line-height:1.45;margin-top:12px}
  .merke.an{display:block}
  .check{display:none;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:1068px}
  .check.an{display:block}
  .check h2{margin:.2rem 0 .4rem;font-size:21px;color:var(--acc)}
  .check .cq{font-size:21px;line-height:1.5;margin-bottom:8px}
  .check .crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:24px;font-weight:700}
  .check input{width:4.2em;height:48px;font-size:24px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:10px}
  .check input:focus{outline:none;border-color:var(--acc)}
  .check .fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:18px;line-height:1.45}
  .fb.ok{background:#e4f4e2;color:#24622a}.fb.tipp{background:#fff4e0;color:#7a4a08}.fb.bad{background:#fde8e6;color:#9b2c1f}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Wie werde ich die Brüche los?</h1></header>
<main>
  <div class="bar" id="bar"></div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 600 420" aria-label="Die Nenner werden aus der Gleichung gezogen und bilden zusammen eine Pralinenschachtel"></svg>
    <div class="side"><div class="cap" id="cap"></div><div class="calc" id="calc"></div>
      <div class="merke" id="merke"><b>Merke:</b> Nimm die <b>ganze</b> Gleichung mal eine Zahl, in der <b>alle Nenner stecken</b>. Dann verschwinden die Brüche.</div></div>
  </div>
  <section class="check" id="check"></section>
</main>
<footer>Fehling · Bruchgleichungen</footer>
<script>
"use strict";
// Lesetempo wie in den anderen Animationen: jeder Erklärsatz bleibt so lange stehen, wie man zum Lesen braucht; Pause-Knopf.
let LESE_BIS=0,PAUSE=false;
const lesezeit=t=>1500+t.length*80;
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s"),cap=document.getElementById("cap"),calc=document.getElementById("calc"),merke=document.getElementById("merke");
new MutationObserver(()=>{LESE_BIS=performance.now()+lesezeit(cap.textContent||"");}).observe(cap,{childList:true,characterData:true,subtree:true});
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const SLOW=1.3;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const tween=(ms,f)=>new Promise(r=>{ms*=SLOW;let t0=null,pz=0,pStart=null;const s=t=>{if(t0===null)t0=t;
  if(PAUSE){if(pStart===null)pStart=t;requestAnimationFrame(s);return;}if(pStart!==null){pz+=t-pStart;pStart=null;}
  const k=Math.min(1,(t-t0-pz)/ms);f(ease(k));k<1?requestAnimationFrame(s):r();};requestAnimationFrame(s);});
const wait=ms=>new Promise(r=>{const ende=performance.now()+ms*SLOW;const t=()=>{if(!PAUSE&&performance.now()>=Math.max(ende,LESE_BIS))r();else setTimeout(t,100);};t();});
const txt=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":o.size||30,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:o.op??1},o.p);e.textContent=t;return e;};
const fade=(els,to,ms=400)=>{const f=els.map(e=>+(e.getAttribute("opacity")??1));return tween(ms,k=>els.forEach((e,i)=>e.setAttribute("opacity",f[i]+(to-f[i])*k)));};
const move=(e,x1,y1,ms=900)=>{const x0=+e.getAttribute("x"),y0=+e.getAttribute("y");return tween(ms,k=>{e.setAttribute("x",x0+(x1-x0)*k);e.setAttribute("y",y0+(y1-y0)*k);});};
const fr=(z,n,cls="")=>`<span class="fr ${cls}"><span>${z}</span><span>${n}</span></span>`;
let run=0;

// Ein Bruch in der Gleichung: Zähler x, Bruchstrich, Nenner farbig
function bruch(cx,nenner,farbe){
  const z=txt(cx,40,"x",{size:30});
  const l=el("line",{x1:cx-20,y1:62,x2:cx+20,y2:62,stroke:"var(--ink)","stroke-width":3});
  const n=txt(cx,86,String(nenner),{size:30,fill:farbe});n.z=z;n.l=l;n.cx=cx;return n;
}
/* Wie in der Erinnerung „Zahl in den Zähler“: die Zahl erscheint vor dem Bruch und wandert hoch in den Zähler */
const breite=e=>e.getBBox().width;
async function inZaehler(B,zahl){
  const e=txt(0,62,String(zahl),{size:30,fill:"var(--hl)",op:0}),d=txt(0,62,"·",{size:30,op:0});
  const we=breite(e),wd=breite(d),wz=breite(B.z);
  e.setAttribute("x",B.cx-30-wd-6-we/2);d.setAttribute("x",B.cx-30-wd/2);
  await fade([e,d],1,600);await wait(1000);
  const ges=we+6+wd+6+wz,x0=B.cx-ges/2;
  const l1=+B.l.getAttribute("x1"),l2=+B.l.getAttribute("x2");
  await Promise.all([move(e,x0+we/2,40,1100),move(d,x0+we+6+wd/2,40,1100),move(B.z,x0+ges-wz/2,40,1100),
    tween(1100,k=>{B.l.setAttribute("x1",l1+(x0-6-l1)*k);B.l.setAttribute("x2",l2+(x0+ges+6-l2)*k);})]);
  return e;
}
const T_=(x,y,t,g)=>txt(x,y,t,{size:g,fill:"#b03a2e",op:0});
/* Kürzen deutlich (Malte 2.11.2026): beide Zahlen leuchten auf, werden durchgestrichen, gekürzte Zahl oben und unten dazuschreiben */
async function kuerze(oben,unten,restO,restU,gr=22){
  const hl=[oben,unten].map(e=>{const b=e.getBBox();const r=el("rect",{x:b.x-6,y:b.y-3,width:b.width+12,height:b.height+6,rx:8,fill:"#fde7c8",stroke:"#c0700f","stroke-width":2,opacity:0});e.parentNode.insertBefore(r,e);return r;});
  for(let i=0;i<2;i++){await fade(hl,1,450);await fade(hl,0.35,450);}
  await fade(hl,1,300);await wait(1500);
  const s=[oben,unten].map(e=>{const b=e.getBBox();return el("line",{x1:b.x-4,y1:b.y+b.height-5,x2:b.x+b.width+4,y2:b.y+5,stroke:"#b03a2e","stroke-width":3.5,opacity:0});});
  await fade(s,1,700);await wait(800);
  const bo=oben.getBBox(),bu=unten.getBBox();
  const r=[T_(bo.x+bo.width/2,bo.y-gr*0.55,String(restO),gr),T_(bu.x+bu.width/2,bu.y+bu.height+gr*0.55,String(restU),gr)];
  await fade(r,1,700);await fade(hl,0,500);
  return [...hl,...s,...r];
}

async function play([a,b,c]){
  const my=++run,alive=()=>my===run,say=t=>{if(alive())cap.textContent=t;};
  svg.innerHTML="";calc.innerHTML="";merke.classList.remove("an");
  const N=a*b,x=c*N/(a+b);
  // Gleichung oben
  const n1=bruch(160,a,"var(--n1)");txt(240,62,"+");const n2=bruch(325,b,"var(--n2)");txt(440,62,"= "+c);
  calc.innerHTML=`${fr("x",a,"b1")} + ${fr("x",b,"b2")} = ${c}`;
  say(`Die Brüche stören: Hier wird durch ${a} und durch ${b} geteilt.`);
  // Nenner pulsieren
  for(let i=0;i<2;i++){await tween(350,k=>[n1,n2].forEach(e=>e.setAttribute("font-size",30+8*Math.sin(Math.PI*k))));}
  await wait(1800);if(!alive())return;

  // Schachtel-Geometrie: a Reihen, b Spalten
  const s=Math.min(58,Math.floor(210/Math.max(a,b))),W=b*s,H=a*s,x0=300-W/2,y0=200+(170-H)/2;
  say(`Wir ziehen die beiden Nenner heraus: die ${a} und die ${b}.`);
  const k1=txt(160,86,String(a),{size:30,fill:"var(--n1)"}),k2=txt(325,86,String(b),{size:30,fill:"var(--n2)"});
  await Promise.all([move(k1,x0-28,y0+H/2),move(k2,300,y0-24)]);if(!alive())return;
  await wait(800);if(!alive())return;

  // Schachtel entsteht
  say(`Zusammen bilden sie eine Pralinenschachtel: ${a} Reihen mit je ${b} Pralinen.`);
  const box=el("rect",{x:x0,y:y0,width:W,height:H,rx:8,fill:"var(--schachtel)",stroke:"var(--schachtelL)","stroke-width":3,opacity:0});
  await fade([box],1,400);
  const tint=[...Array(a)].map((_,r)=>[...Array(b)].map((_,k)=>el("rect",{x:x0+k*s+2,y:y0+r*s+2,width:s-4,height:s-4,rx:6,fill:"transparent"})));
  const pr=[];
  for(let r=0;r<a;r++){for(let k=0;k<b;k++){pr.push(el("circle",{cx:x0+k*s+s/2,cy:y0+r*s+s/2,r:s*0.32,fill:"var(--praline)",opacity:0}));}
    await fade(pr.slice(-b),1,300);if(!alive())return;}
  const zahl=txt(x0+W+52,y0+H/2,String(N),{size:42,fill:"var(--hl)",op:0});
  await fade([zahl],1,400);
  calc.innerHTML+=`<br>${a} · ${b} = <span class="h">${N}</span> <small>Pralinen</small>`;
  await wait(2200);if(!alive())return;

  // in a Teile teilen (Reihen)
  say(`Steckt die ${a} in der ${N}? Ja: ${N} Pralinen kann man gerecht in ${a} Teile teilen – jeder Teil hat ${b}.`);
  const linien1=[...Array(a-1)].map((_,i)=>el("line",{x1:x0-6,y1:y0+(i+1)*s,x2:x0+W+6,y2:y0+(i+1)*s,stroke:"var(--n1)","stroke-width":4,opacity:0}));
  tint.forEach((row,r)=>row.forEach(t=>t.setAttribute("fill",r%2?"var(--n1bg)":"#eef3fb")));
  await fade(linien1,1,500);if(!alive())return;
  calc.innerHTML+=`<br><span class="h">${N}</span> : <span class="b1">${a}</span> = ${b}`;
  await wait(2400);if(!alive())return;
  await fade(linien1,0,300);tint.flat().forEach(t=>t.setAttribute("fill","transparent"));

  // in b Teile teilen (Spalten)
  say(`Und die ${b}? Auch sie steckt in der ${N}: ${b} Teile mit je ${a} Pralinen.`);
  const linien2=[...Array(b-1)].map((_,i)=>el("line",{x1:x0+(i+1)*s,y1:y0-6,x2:x0+(i+1)*s,y2:y0+H+6,stroke:"var(--n2)","stroke-width":4,opacity:0}));
  tint.forEach(row=>row.forEach((t,k)=>t.setAttribute("fill",k%2?"var(--n2bg)":"#eef7ec")));
  await fade(linien2,1,500);if(!alive())return;
  calc.innerHTML+=`&nbsp;&nbsp; <span class="h">${N}</span> : <span class="b2">${b}</span> = ${a}`;
  await wait(2400);if(!alive())return;
  await fade(linien2,0,300);tint.flat().forEach(t=>t.setAttribute("fill","transparent"));

  // alles mal N – N kommt in den Zähler, dann kürzen
  say(`In der ${N} stecken beide Nenner. Darum nehmen wir die ganze Gleichung mal ${N} – und wie in der Erinnerung kommt die ${N} in den Zähler.`);
  const rechts=txt(512,62,"· "+N,{size:24,fill:"var(--hl)",op:0});
  const [e1,e2]=await Promise.all([inZaehler(n1,N),inZaehler(n2,N)]);await fade([rechts],1,500);if(!alive())return;
  calc.innerHTML=`${fr('<span class="h">'+N+'</span> · x',a,"b1")} + ${fr('<span class="h">'+N+'</span> · x',b,"b2")} = <span class="h">${N}</span> · ${c}`;
  await wait(2600);if(!alive())return;

  // kürzen
  say(`Jetzt kürzen: ${N} oben und ${a} unten – ${N} : ${a} = ${b}, ${a} : ${a} = 1. Genauso ${N} und ${b}. Die Brüche verschwinden.`);
  await kuerze(e1,n1,N/a,1,20);await kuerze(e2,n2,N/b,1,20);if(!alive())return;
  const erg=[txt(160,150,b+"x",{size:28,fill:"var(--hl)",op:0}),txt(325,150,a+"x",{size:28,fill:"var(--hl)",op:0}),txt(440,150,"= "+N*c,{size:28,fill:"var(--hl)",op:0}),txt(240,150,"+",{size:28,op:0})];
  await fade(erg,1,600);
  calc.innerHTML+=`<br>${b} · x + ${a} · x = ${N*c}<br>${b}x + ${a}x = ${N*c}`;
  await wait(2800);if(!alive())return;

  say(`Jetzt ist es eine ganz normale Gleichung.`);
  calc.innerHTML+=`<br>${a+b}x = ${N*c} &nbsp;→&nbsp; <span class="h">x = ${x}</span>`;
  await wait(1800);if(!alive())return;
  say(`Probe: ${x} : ${a} = ${x/a} und ${x} : ${b} = ${x/b}, zusammen ${x/a+x/b} ✓`);
  await wait(1500);if(!alive())return;
  const g=ggT(a,b);
  if(g>1){   // Nenner mit gemeinsamem Baustein: Schachtel klappt, ist aber größer als nötig → Brücke zu „Geht es auch kleiner?“
    const k=N/g;
    say(`Es klappt! Aber: Geht es auch mit weniger Pralinen? Auch ${k} kann man gerecht in ${a} Teile und in ${b} Teile teilen.`);
    calc.innerHTML+=`<br><small>Auch ${k} klappt: ${k} : ${a} = ${k/a}, ${k} : ${b} = ${k/b} – und ${k} ist kleiner als ${N}!</small>`;
    await wait(3000);if(!alive())return;
    say(`Wie man die kleinste Zahl findet, zeigt die nächste Animation „Geht es auch kleiner?“.`);
  }
  merke.classList.add("an");
  baueCheck(checkGen);
}
const ggT=(a,b)=>b?ggT(b,a%b):a;
/* ---------- Kleiner Check am Ende (Malte 2.11.2026) ----------
   gen() liefert {frage, pruefe(eingabe) → {ok, fast, msg}, tipp, loesung, einheit}. 1. Fehler → Tipp, 2. Fehler → Lösung. */
function baueCheck(gen){
  const box=document.getElementById("check");box.classList.add("an");
  const t=gen();let versuch=0,fertig=false;
  box.innerHTML=`<h2>✎ Check: Jetzt du!</h2><div class="cq">${t.frage}</div>
    <div class="crow"><input id="cin" inputmode="${t.text?"text":"numeric"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort">${t.einheit||""}
    <button class="btn" id="cpr" type="button">Prüfen ✓</button><button class="btn" id="cneu" type="button">🔁 Neue Aufgabe</button></div><div id="cfb"></div>`;
  const inp=document.getElementById("cin"),fb=document.getElementById("cfb");
  const pr=()=>{if(fertig)return;const v=inp.value.trim();if(!v){fb.innerHTML='<div class="fb tipp">Bitte trage zuerst etwas ein.</div>';return;}
    const r=t.pruefe(v);
    if(r.ok){fertig=true;fb.innerHTML=`<div class="fb ok">✅ ${r.msg||"Richtig!"}</div>`;return;}
    if(r.fast){fb.innerHTML=`<div class="fb tipp">🤔 ${r.msg}</div>`;return;}
    versuch++;
    if(versuch===1)fb.innerHTML=`<div class="fb tipp">Noch nicht. 💡 ${t.tipp}</div>`;
    else{fertig=true;fb.innerHTML=`<div class="fb bad">Leider wieder falsch. So geht es: ${t.loesung}</div>`;}};
  document.getElementById("cpr").onclick=pr;inp.addEventListener("keydown",e=>{if(e.key==="Enter")pr();});
  document.getElementById("cneu").onclick=()=>baueCheck(gen);
}

// Check: zwei Nenner ohne gemeinsamen Baustein → Nenner mal Nenner (andere Paare als in den Beispielen)
function checkGen(){
  const [a,b]=[[3,5],[2,7],[4,5],[2,9],[5,6],[3,7],[4,7]][Math.floor(Math.random()*7)],N=a*b;
  return {frage:`${fr("x",a,"b1")} + ${fr("x",b,"b2")} = …<br>Mit welcher Zahl nimmst du die <b>ganze</b> Gleichung mal, damit <b>beide</b> Brüche verschwinden?`,
    einheit:"",
    pruefe:v=>{const n=+v.replace(",",".");if(!Number.isInteger(n)||n<=0)return{ok:false};
      if(n%a===0&&n%b===0)return n===N?{ok:true,msg:`Richtig! ${N} ist durch ${a} und durch ${b} teilbar: ${a} · ${b} = ${N}.`}:{ok:true,msg:`Klappt auch! Die kleinste Zahl wäre ${a} · ${b} = ${N}.`};
      return{ok:false};},
    tipp:`Die Zahl muss durch ${a} <b>und</b> durch ${b} teilbar sein. Denk an die Pralinenschachtel: ${a} Reihen mit je ${b} Pralinen.`,
    loesung:`${a} · ${b} = <b>${N}</b>. ${N} : ${a} = ${N/a} und ${N} : ${b} = ${N/b} – beide Nenner verschwinden.`};
}
// nur Nenner ohne gemeinsamen Baustein: dann ist Nenner · Nenner schon die kleinste Zahl (der Rest kommt in „Welche Zahl reicht?“)
const BSP=[[2,3,10],[2,5,7],[3,4,7],[4,6,5]];   // Beispiel 4: Nenner mit gemeinsamem Baustein → Brücke zu „Geht es auch kleiner?“
const bar=document.getElementById("bar");
BSP.forEach((b,i)=>{const x=document.createElement("button");x.className="btn";x.innerHTML=`Beispiel ${i+1}: &nbsp;${fr("x",b[0])} + ${fr("x",b[1])} = ${b[2]}`;
  x.onclick=()=>{PAUSE=false;document.getElementById("check").classList.remove("an");pz.textContent="⏸ Pause";bar.querySelectorAll(".btn.bsp").forEach(y=>y.setAttribute("aria-pressed",y===x));play(b);};x.classList.add("bsp");bar.appendChild(x);});
const pz=document.createElement("button");pz.className="btn";pz.type="button";pz.textContent="⏸ Pause";
pz.onclick=()=>{PAUSE=!PAUSE;pz.textContent=PAUSE?"▶ Weiter":"⏸ Pause";};bar.appendChild(pz);
const zc=document.createElement("button");zc.className="btn";zc.type="button";zc.textContent="✎ Zum Check";zc.onclick=()=>{baueCheck(checkGen);document.getElementById("check").scrollIntoView({behavior:"smooth"});};bar.appendChild(zc);
bar.firstChild.setAttribute("aria-pressed","true");play(BSP[0]);
</script>
</body>
</html>
