<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Station ② Fehlende Teile</title>
<!-- Station ②: nur noch Hilfe. Eine Animation füllt das Flächenbild für ein anderes Beispiel (23²) aus – wie im Skript. -->
<style>
  :root{
    --blue:#bcd3f2; --green:#c6e8c0; --orange:#fbd9a8;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5; --mark:#d64545;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .note{font-size:17px;color:var(--muted);margin:0 0 10px}
  .wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  svg{flex:1 1 520px;max-width:640px;width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 280px}
  .cap{min-height:96px;font-size:22px;font-weight:600;color:var(--acc);margin:4px 0 12px;line-height:1.4}
  .sum{font-size:22px;min-height:34px;margin:0 0 14px}
  .btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:10px 18px;font-size:17px;font-weight:600;min-height:44px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Station ② Fehlende Teile</h1></header>
<main>
  <p class="note">Beispiel mit einer <b>anderen Zahl: 23²</b>. Schau zu – danach machst du es im Skript genauso mit deiner Zahl.</p>
  <div class="wrap">
    <svg id="s" viewBox="0 0 640 600" aria-label="Animation: Flächenbild für 23 zum Quadrat ausfüllen"></svg>
    <div class="side">
      <div class="cap" id="cap"></div>
      <div class="sum" id="sum"></div>
      <button class="btn" id="again">Nochmal abspielen</button>
    </div>
  </div>
</main>
<footer>Fehling · Erste binomische Formel</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s"),cap=document.getElementById("cap"),sumEl=document.getElementById("sum");
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const tween=(ms,f)=>new Promise(r=>{const t0=performance.now();const s=t=>{const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;f(e);k<1?requestAnimationFrame(s):r();};requestAnimationFrame(s);});
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// Geometrie wie das Blanko-Flächenbild im Skript (Verhältnis 3 : 2, damit alle Kästchen Platz haben)
const X=130,Y=110,S=460,A=S*0.6,B=S-A;
const a=20,b=3;
const FW=62,FH=44,RW=112;            // Kästchen: Faktor / Produkt
let run=0;

function kasten(cx,cy,w){
  const g=el("g",{});
  el("rect",{x:cx-w/2,y:cy-FH/2,width:w,height:FH,rx:4,fill:"#fff",stroke:"#6b7785","stroke-width":2},g);
  const t=el("text",{x:cx,y:cy+1,"text-anchor":"middle","dominant-baseline":"central","font-size":26,"font-weight":600,fill:"var(--ink)",opacity:0},g);
  return {g,t};
}
const put=(k,txt)=>{k.t.textContent=txt;return tween(500,e=>k.t.setAttribute("opacity",e));};
const symb=(x,y,t,size=26)=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":size,fill:"var(--ink)"});e.textContent=t;return e;};

function teil(x,y,w,h,col){
  const r=el("rect",{x,y,width:w,height:h,fill:"#fff",stroke:"var(--ink)","stroke-width":3});
  const cx=x+w/2,cy=y+h/2;
  const f1=kasten(cx-44,cy-32,FW),dot=symb(cx,cy-32,"·",30),f2=kasten(cx+44,cy-32,FW);
  const eq=symb(cx-70,cy+30,"="),p=kasten(cx+16,cy+30,RW);
  return {r,col,f1,f2,p};
}
// Rahmen um eine Seitenzahl kurz hervorheben
async function blink(k,my){
  const r=k.g.querySelector("rect");
  for(let i=0;i<2&&my===run;i++){r.setAttribute("stroke","var(--mark)");r.setAttribute("stroke-width",4);await wait(380);r.setAttribute("stroke","#6b7785");r.setAttribute("stroke-width",2);await wait(220);}
}

async function play(){
  const my=++run; svg.innerHTML=""; sumEl.textContent="";
  const say=t=>{if(my===run)cap.textContent=t;};
  const alive=()=>my===run;

  const tA=kasten(X+A/2,Y-50,FW),tP=symb(X+A,Y-50,"+"),tB=kasten(X+A+B/2,Y-50,FW);
  const lA=kasten(X-60,Y+A/2,FW),lP=symb(X-60,Y+A,"+"),lB=kasten(X-60,Y+A+B/2,FW);
  const big =teil(X,  Y,  A,A,"var(--blue)");
  const re1 =teil(X+A,Y,  B,A,"var(--green)");
  const re2 =teil(X,  Y+A,A,B,"var(--green)");
  const sm  =teil(X+A,Y+A,B,B,"var(--orange)");

  say("So sieht das leere Flächenbild aus – wie in deinem Skript.");
  await wait(2200); if(!alive())return;

  say("Zuerst zerlegst du die Zahl: 23 = 20 + 3. Die Zahlen kommen an die Seiten.");
  await wait(1200); if(!alive())return;
  await put(tA,"20"); await put(tB,"3"); await wait(400); if(!alive())return;
  await put(lA,"20"); await put(lB,"3"); await wait(1800); if(!alive())return;

  const steps=[
    [big,tA,lA,"Das blaue Quadrat: oben 20, links 20. Also 20 · 20 = 400."],
    [re1,tB,lA,"Das grüne Rechteck rechts: oben 3, links 20. Also 20 · 3 = 60."],
    [re2,tA,lB,"Das grüne Rechteck unten: oben 20, links 3. Also 20 · 3 = 60."],
    [sm, tB,lB,"Das orange Quadrat: oben 3, links 3. Also 3 · 3 = 9."]];
  for(const [t,top,left,txt] of steps){
    say(txt);
    await Promise.all([blink(top,my),blink(left,my)]); if(!alive())return;
    await tween(600,e=>t.r.setAttribute("fill",e<.5?"#fff":t.col));
    const x=+top.t.textContent,y=+left.t.textContent,[f,g]=x>=y?[x,y]:[y,x];
    await put(t.f1,String(f)); await put(t.f2,String(g)); await wait(500); if(!alive())return;
    await put(t.p,String(f*g)); await wait(2300); if(!alive())return;
  }

  say("Zum Schluss addierst du alle Teilflächen.");
  sumEl.innerHTML="23² = <b style='color:#2e5d9f'>400</b> + <b style='color:#3f8f3a'>60</b> + <b style='color:#3f8f3a'>60</b> + <b style='color:#c0700f'>9</b>";
  await wait(2200); if(!alive())return;
  sumEl.innerHTML+=" = <b>529</b>";
  await wait(1500); if(!alive())return;
  say("Jetzt du: Mach es im Skript genauso mit deiner Zahl.");
}
document.getElementById("again").onclick=play;
play();
</script>
</body>
</html>
