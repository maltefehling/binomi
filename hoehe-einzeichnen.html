<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Höhe einzeichnen – Parallelogramm A oder B</title>
<!-- Kapitel II (Kl. 8), II.2b, 16.11.2026 (Malte): Wahl A oder B (die beiden Parallelogramme aus dem Skript), Geodreieck mit Skala,
     Mittellinie und Hilfslinien, schneller als vorher. Zeigt nur das Vorgehen, keine Länge (die misst der Schüler selbst).
     Rechte Winkel als Bogen mit Punkt. Lesezeit 900 ms + 45 ms je Zeichen, Pause/Weiter. -->
<style>
  :root{--acc:#1f4e79;--tipp:#6d4a9e;--ink:#1b2a3a;--bg:#f4f7fb;--a:#2e5d9f;--hl:#c0700f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff} header h1{font-size:21px;margin:0}
  main{padding:12px 16px 24px;max-width:900px;margin:0 auto}
  .wahl{display:flex;gap:10px;margin:4px 0 12px}
  .wahl button{flex:1;min-height:56px;border-radius:12px;font-size:20px;font-weight:800;border:2px solid var(--acc);background:#fff;color:var(--acc)}
  .wahl button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .knoepfe{display:flex;gap:10px;margin-bottom:10px}
  .knoepfe button{flex:1;min-height:50px;border-radius:12px;font-size:18px;font-weight:700;border:2px solid var(--acc);background:#fff;color:var(--acc)}
  .knoepfe button.haupt{background:var(--acc);color:#fff}
  .bild{background:#fff;border:1px solid #c9d6e5;border-radius:14px;padding:6px;margin-bottom:10px}
  svg{width:100%;height:auto;display:block}
  .cap{background:#fff;border:2px solid #a9c1e0;border-radius:12px;padding:10px 14px;font-size:21px;line-height:1.45;min-height:64px}
  .geo{transition:transform 1.1s ease, opacity .5s}
  .weich{transition:opacity .5s}
</style>
</head>
<body>
<header><h1>Höhe einzeichnen</h1></header>
<main>
  <div class="wahl-text" style="font-size:18px;font-weight:700;color:#1f4e79;margin:2px 0 6px">In welches Parallelogramm zeichnest du?</div><div class="wahl"><button id="wA" aria-pressed="false">A</button><button id="wB" aria-pressed="false">B</button></div>
  <div class="knoepfe"><button class="haupt" id="play">▶ Abspielen</button><button id="pause">⏸ Pause</button></div>
  <div class="bild"><svg id="svg" viewBox="0 0 660 520"></svg></div>
  <div class="cap" id="cap">Wähle oben das Parallelogramm, in das du die Höhe einzeichnen willst.</div>
</main>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("svg");
const K=52,X0=95,Y0=300;                       // 1 cm = 52 px; Grundseite auf y = 0
const P=(x,y)=>[X0+x*K,Y0-y*K];
const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const FIG={A:{pts:[[0,0],[6,0],[7,3],[1,3]],ecke:[1,3],verl:null},
           B:{pts:[[0,0],[3,0],[7,4],[4,4]],ecke:[4,4],verl:[3,4.5]}};
// Geodreieck: lange Kante senkrecht (x = 0), Mittellinie waagrecht nach rechts, Spitze bei (L, 0); Maße in cm
function geodreieck(){
  const L=4.2,g=mk("g",{class:"geo"});
  const Q=(x,y)=>[x*K,-y*K].join(",");
  mk("polygon",{points:[Q(0,-L),Q(0,L),Q(L,0)].join(" "),fill:"rgba(196,224,246,.55)",stroke:"#5b7fa6","stroke-width":2},g);
  const clip="M"+[Q(0,-L),Q(0,L),Q(L,0)].join(" L")+" Z";
  // Hilfslinien parallel zur langen Kante (alle 0,5 cm)
  for(let d=0.5;d<L;d+=0.5){const h=L-d;mk("line",{x1:d*K,y1:-h*K,x2:d*K,y2:h*K,stroke:"#7aa0c4","stroke-width":d%1===0?1.1:0.6,opacity:.8},g);}
  // Winkelskala (Halbkreis um den Nullpunkt)
  mk("path",{d:`M 0 ${-2.6*K} A ${2.6*K} ${2.6*K} 0 0 1 0 ${2.6*K}`,fill:"none",stroke:"#5b7fa6","stroke-width":1},g);
  for(let w=-90;w<=90;w+=10){const r=w*Math.PI/180,r1=2.6*K,r2=(w%30===0?2.35:2.48)*K;
    mk("line",{x1:Math.cos(r)*r1,y1:Math.sin(r)*r1,x2:Math.cos(r)*r2,y2:Math.sin(r)*r2,stroke:"#23405f","stroke-width":1},g);}
  // Millimeterskala an der langen Kante, 0 in der Mitte
  for(let mm=-40;mm<=40;mm++){const y=mm/10*K,lang=mm%10===0?14:(mm%5===0?10:6);
    mk("line",{x1:0,y1:y,x2:lang,y2:y,stroke:"#23405f","stroke-width":mm%10===0?1.4:0.8},g);
    if(mm%10===0&&mm!==0){const t=mk("text",{x:18,y:y+5,"font-size":13,fill:"#23405f"},g);t.textContent=Math.abs(mm/10);}}
  // Mittellinie (von der 0 zur Spitze), kräftig
  mk("line",{x1:0,y1:0,x2:L*K,y2:0,stroke:"#c0392b","stroke-width":2.4},g);
  const t0=mk("text",{x:6,y:-6,"font-size":13,"font-weight":700,fill:"#c0392b"},g);t0.textContent="0";
  return g;
}
let wahl=null,teile={},n=0,timer=null,steht=false;
function zeichne(f){
  svg.innerHTML="";
  for(let i=-2;i<=10;i++)mk("line",{x1:P(i,0)[0],y1:0,x2:P(i,0)[0],y2:520,stroke:"#e6ecf2"});
  for(let j=-4;j<=5;j++)mk("line",{x1:0,y1:P(0,j)[1],x2:660,y2:P(0,j)[1],stroke:"#e6ecf2"});
  const F=FIG[f];
  mk("polygon",{points:F.pts.map(p=>P(...p).join(",")).join(" "),fill:"#e3dccf",stroke:"#6b5a45","stroke-width":3});
  mk("line",{x1:P(...F.pts[0])[0],y1:Y0,x2:P(...F.pts[1])[0],y2:Y0,stroke:"#2e5d9f","stroke-width":6});
  const ta=mk("text",{x:(P(...F.pts[0])[0]+P(...F.pts[1])[0])/2,y:Y0+30,"font-size":22,"font-weight":800,fill:"#2e5d9f","text-anchor":"middle"});ta.textContent="a";
  const tn=mk("text",{x:20,y:40,"font-size":26,"font-weight":800,fill:"#1f4e79"});tn.textContent=f;
  const E=P(...F.ecke);mk("circle",{cx:E[0],cy:E[1],r:6,fill:"#1b2a3a"});
  const verl=F.verl?mk("line",{x1:P(F.verl[0],0)[0],y1:Y0,x2:P(F.verl[1],0)[0],y2:Y0,stroke:"#2e5d9f","stroke-width":3,"stroke-dasharray":"9 7",class:"weich",style:"opacity:0"}):null;
  const geo=geodreieck();geo.style.opacity=0;
  const hx=P(F.ecke[0],0)[0],hl=F.ecke[1]*K;
  const senk=mk("line",{x1:E[0],y1:E[1],x2:E[0],y2:Y0,stroke:"#c0700f","stroke-width":4,"stroke-dasharray":hl,"stroke-dashoffset":hl,style:"transition:stroke-dashoffset 1.1s"});
  const w=mk("g",{class:"weich",style:"opacity:0"});
  mk("path",{d:`M ${hx+18} ${Y0} A 18 18 0 0 0 ${hx} ${Y0-18}`,fill:"none",stroke:"#c0700f","stroke-width":2.5},w);
  mk("circle",{cx:hx+7.5,cy:Y0-7.5,r:2.8,fill:"#c0700f"},w);
  const th=mk("text",{x:hx+10,y:Y0-hl/2,"font-size":22,"font-weight":800,fill:"#c0700f"},w);th.innerHTML='h<tspan baseline-shift="sub" font-size="15">a</tspan>';
  teile={F,verl,geo,senk,w,hx,start:hx+1.3*K};
  geo.setAttribute("transform",`translate(${teile.start},${Y0})`);
}
const SCHRITTE={
 A:[["Die Ecke oben liegt über der Grundseite – du musst nichts verlängern.",t=>{}],
    ["Lege die rote Mittellinie des Geodreiecks genau auf die Grundseite a.",t=>{t.geo.style.opacity=1;}],
    ["Schiebe das Geodreieck auf der Grundseite, bis die lange Kante durch die Ecke geht.",t=>{t.geo.setAttribute("transform",`translate(${t.hx},${Y0})`);}],
    ["Zeichne an der langen Kante von der Ecke bis zur Grundseite.",t=>{t.senk.style.strokeDashoffset=0;}],
    ["Nimm das Geodreieck weg und markiere den rechten Winkel mit Bogen und Punkt. Das ist die Höhe hₐ.",t=>{t.geo.style.opacity=0;t.w.style.opacity=1;}],
    ["Jetzt du: Zeichne die Höhe in A genauso ein und miss sie mit dem Geodreieck.",t=>{}]],
 B:[["Die Ecke oben liegt NICHT über der Grundseite. Verlängere deshalb die Grundseite a gestrichelt.",t=>{t.verl.style.opacity=1;}],
    ["Lege die rote Mittellinie des Geodreiecks auf die verlängerte Grundseite.",t=>{t.geo.style.opacity=1;}],
    ["Schiebe das Geodreieck auf der Grundseite, bis die lange Kante durch die Ecke geht.",t=>{t.geo.setAttribute("transform",`translate(${t.hx},${Y0})`);}],
    ["Zeichne an der langen Kante von der Ecke bis zur verlängerten Grundseite.",t=>{t.senk.style.strokeDashoffset=0;}],
    ["Nimm das Geodreieck weg und markiere den rechten Winkel mit Bogen und Punkt. Die Höhe hₐ liegt hier außerhalb – das ist richtig so.",t=>{t.geo.style.opacity=0;t.w.style.opacity=1;}],
    ["Jetzt du: Zeichne die Höhe in B genauso ein und miss sie mit dem Geodreieck.",t=>{}]]};
const cap=document.getElementById("cap"),pb=document.getElementById("pause");
const lese=s=>900+45*s.length;
function waehle(f){wahl=f;document.getElementById("wA").setAttribute("aria-pressed",f==="A");document.getElementById("wB").setAttribute("aria-pressed",f==="B");
  clearTimeout(timer);n=0;zeichne(f);cap.textContent="Tippe auf ▶ Abspielen.";pb.disabled=true;}
function weiter(){if(steht||!wahl)return;const S=SCHRITTE[wahl];if(n<S.length){const [satz,f]=S[n];f(teile);cap.textContent=satz;n++;timer=setTimeout(weiter,lese(satz)+500);}else pb.disabled=true;}
document.getElementById("wA").onclick=()=>waehle("A");
document.getElementById("wB").onclick=()=>waehle("B");
document.getElementById("play").onclick=()=>{if(!wahl){cap.textContent="Wähle zuerst oben A oder B.";return;}waehle(wahl);steht=false;pb.disabled=false;pb.textContent="⏸ Pause";timer=setTimeout(weiter,300);};
pb.onclick=()=>{steht=!steht;pb.textContent=steht?"▶ Weiter":"⏸ Pause";clearTimeout(timer);if(!steht)weiter();};
pb.disabled=true;
</script>
</body>
</html>
