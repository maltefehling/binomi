<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Übung II.3c · Den richtigen Weg wählen</title>
<!-- Kapitel II Quadratische Gleichungen: Online-Übung nach dem Buchkapitel (QR-Code im Skript). Nur Aufgaben – gerechnet wird im Heft.
     Aufbau: Aufgabe 1 für alle, dann ★ / ★★ / ★★★. Tipp zu jeder Aufgabe, Lösungen je Stufe erst nach Rückfrage. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;
    --merk:#dde8f5;--merkL:#a9c1e0;--auf:#e8f4e6;--aufL:#c6e8c0;--hilf:#fdf6ea;--hilfL:#fbd9a8;--grau:#f2f2f2;--rot:#b03a2e;--gruen:#3f8f3a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{max-width:880px;margin:0 auto;padding:14px 16px 32px}
  .hinweis{background:#fff;border:1px solid #bfbfbf;border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.45;margin-bottom:12px}
  details.erin{background:var(--merk);border:1px solid var(--merkL);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:18px;line-height:1.5}
  details.erin summary{font-weight:700;color:var(--acc);cursor:pointer;min-height:30px}
  details.erin ul{margin:6px 0 0;padding-left:22px}
  h2{font-size:21px;color:var(--acc);margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--acc)}
  .aufg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .aufg .kopf{font-weight:700;color:var(--acc);font-size:18px;margin-bottom:4px}
  .aufg .txt{font-size:20px;line-height:1.45}
  /* Teilaufgaben als getrennte Kärtchen (15.10.2026, Malte): SuS hielten a), b), c) für eine zusammenhängende Aufgabe */
  .aufg ol{margin:10px 0 0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .aufg li{font-size:21px;line-height:1.5;white-space:nowrap;overflow-x:auto;border:2px solid #c9d6e5;border-radius:12px;background:#f7f9fc;padding:8px 12px}
  .aufg li.breit{grid-column:1/-1}
  .aufg li b.tb{display:inline-block;min-width:34px;text-align:center;background:#1f4e79;color:#fff;border-radius:8px;padding:0 8px;margin-right:10px;font-weight:700}
  .tag{display:inline-block;font-size:14px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .tag.v{background:#fff3c4;color:#7a5b00}.tag.w{background:#e2d6f0;color:#4f2f7a}
  details.idee{margin-top:8px;font-size:18px}
  details.idee summary{color:var(--acc);cursor:pointer;font-weight:600}
  details.idee div{background:var(--grau);border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.45}
  .wahl{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .wahl button{flex:1 1 200px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;padding:12px 14px;font-size:19px;font-weight:700;min-height:56px;text-align:left}
  .wahl button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wahl small{display:block;font-weight:500;font-size:15px;opacity:.85}
  .stufe[hidden]{display:none}
  .loesbtn{border:1px solid var(--hilfL);background:var(--hilf);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:18px;font-weight:700;min-height:48px;margin-top:4px}
  .loes{background:var(--hilf);border:1px solid var(--hilfL);border-radius:12px;padding:10px 14px;margin-top:8px}
  .loes p{margin:0 0 8px;font-size:16px;color:var(--rot);font-weight:700}
  .loes .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
  .loes .grid span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;font-size:19px}
  .loes[hidden]{display:none}
  details.tipp{margin-top:8px;font-size:18px}
  details.tipp summary{display:inline-block;cursor:pointer;font-weight:700;color:#6d4a9e;background:#f1eaf8;border:1px solid #b79bd6;border-radius:10px;padding:6px 12px;min-height:40px;list-style:none}
  details.tipp summary::-webkit-details-marker{display:none}
  details.tipp div{background:#f1eaf8;border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.45}
  .frag{background:#fff;border:2px solid var(--acc);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:19px}
  .frag[hidden]{display:none}
  .frag p{margin:0 0 10px;font-weight:700;color:var(--acc)}
  .frag button{border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;min-height:46px;margin:0 8px 6px 0;border:2px solid var(--acc)}
  .frag .ja{background:var(--acc);color:#fff}.frag .nein{background:#fff;color:var(--acc)}
  .loes .zeile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:19px;line-height:1.5}
  .loes .zeile b{color:var(--acc)}
  .loes .warum{display:block;font-size:16px;color:var(--muted);margin-top:2px}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
  .frage{font-size:18px;font-weight:700;color:var(--acc);margin:4px 0 2px}
  .teilkopf{font-size:22px;font-weight:800;color:var(--acc);margin:14px 0 8px}
  .teil[hidden]{display:none}
  .rot{color:#d0021b;font-weight:800}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.15;margin:0 2px}
  .fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
  .lwahl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px} .lwahl button{min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid #c9d6e5;background:#fff;font-size:17px;font-weight:700;color:inherit} .lwahl button[aria-pressed="true"]{border-color:#1b2a3a;background:#fff4dc}
</style>
</head>
<body>
<header><h1>Übung II.3c · Den richtigen Weg wählen</h1></header>
<main>
  <div class="hinweis">✎ <b>Rechne alle Aufgaben in deinem Heft.</b> Schreibe die Nummer der Aufgabe dazu. Wenn du nicht weiterkommst, hilft dir der Tipp. Die Lösungen findest du am Ende jeder Stufe.</div>
  <div id="teilwahl" hidden><div class="frage">Welche Stunde hattet ihr zuletzt?</div><div class="wahl" id="tw"></div></div>
  <div id="teile"></div>
  <footer>Fehling · II Quadratische Gleichungen</footer>
</main>
<script>
"use strict";
// Versionsprüfung (12.10.2026): Safari zeigt sonst bis zu 10 Minuten (oft länger) eine alte, gespeicherte Fassung.
// Beim Öffnen wird die Seite ohne Zwischenspeicher abgefragt; ist sie neuer, lädt sie sich einmal neu.
const STAND="20261016200156";
fetch(location.pathname+"?nocache="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{
  const m=t.match(/const STAND="(\d+)"/);
  if(m&&m[1]!==STAND&&!sessionStorage.getItem("neu"+m[1])){sessionStorage.setItem("neu"+m[1],"1");location.replace(location.pathname+"?v="+m[1]);}
}).catch(()=>{});
// D.teile: ein Teil pro Stunde eines aufgeteilten Buchkapitels (z. B. II.2a/b/c); Stundenauswahl nur bei aufgeteilten Kapiteln (D.mehrteilig).
const D={"untertitel": ["Mit Hilfe zum Einstieg", "Ohne Hilfe, auch mit Minus", "Mehrere Schritte, mehr Nachdenken"], "mehrteilig": false, "teile": [{"name": "", "stunde": "", "kurz": "", "erinnerung": ["Steht schon ( x + a )² = Zahl da? Dann sofort die Wurzel ziehen.", "Sonst zuerst ordnen: alles auf eine Seite, rechts steht 0.", "Grün fehlt (kein x allein): x² allein stellen, Wurzel ziehen.", "Blau fehlt (keine Zahl allein): x ausklammern, Satz vom Nullprodukt.", "Alle drei Steine: Ist es eine binomische Formel? Ja → faktorisieren, Wurzel. Nein → abc-Formel (oder Ecke ergänzen)."], "a1": {"t": "Erst entscheiden, dann rechnen: Welcher Weg ist am schnellsten? Löse dann.", "l": ["Wurzel:  L = { −5 ; 5 }", "Nullprodukt:  L = { −9 ; 0 }", "binomische Formel:  L = { 1 ; 9 }", "abc-Formel:  L = { −3 ; 2 }"], "tipp": "Welche Steine sind da? Bei c): Ist die linke Seite ( x − 5 )²?", "sub": ["4x² = 100", "x² + 9x = 0", "x² − 10x + 25 = 16", "x² + x − 6 = 0"]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Welche Steine sind da? Beispiel: 3x² = 27 → 3x² − 27 = 0 → rot und blau.", "l": ["rot, blau", "rot, grün", "rot, grün, blau", "Klammer im Quadrat: sofort Wurzel"], "tipp": "Bring zuerst alles auf eine Seite.", "sub": ["2x² = 50", "x² = 6x", "x² + 2x = 3", "( x + 1 )² = 49"]}, {"t": "Löse die Gleichungen aus der Aufgabe davor mit dem schnellsten Weg.", "l": ["L = { −5 ; 5 }", "L = { 0 ; 6 }", "L = { −3 ; 1 }", "L = { −8 ; 6 }"], "tipp": "Rot + blau → Wurzel. Rot + grün → Nullprodukt. Alle drei → abc-Formel.", "sub": ["2x² = 50", "x² = 6x", "x² + 2x = 3", "( x + 1 )² = 49"]}, {"t": "Tom löst  x² = 81  mit der abc-Formel.", "l": ["ja: 9 und −9", "Wurzel ziehen – der grüne Stein fehlt"], "tipp": "a = 1, b = 0, c = −81.", "sub": ["Kommt mit der abc-Formel das Richtige heraus?", "Welcher Weg ist schneller?"], "tag": "v"}, {"t": "Wiederholung Kapitel I: Klammere so viel wie möglich aus:  4x² − 12x", "l": ["4x · ( x − 3 )"], "tipp": "In beiden Teilen steckt 4x.", "tag": "w"}]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Entscheide und löse. Beispiel: x² − 4x = 0 → blau fehlt → x · ( x − 4 ) = 0 → L = { 0 ; 4 }.", "l": ["L = { −3 ; 3 }", "L = { −3 ; 0 }", "L = { −9 ; −5 }", "L = { −0,5 ; 2 }", "L = { 2 }"], "tipp": "Bei e): erst ordnen – ist es dann eine binomische Formel?", "sub": ["3x² − 27 = 0", "5x² + 15x = 0", "x² + 14x + 49 = 4", "2x² − 3x − 2 = 0", "x² + 4 = 4x"]}, {"t": "Lena: „Bei x² + 6x = 7 kann ich die Ecke ergänzen oder die abc-Formel nehmen.“", "l": ["( x + 3 )² = 16 → L = { −7 ; 1 }", "x² + 6x − 7 = 0 → D = 64 → L = { −7 ; 1 }"], "tipp": "Beide Wege müssen dasselbe ergeben.", "sub": ["Löse mit Ecke ergänzen.", "Löse mit der abc-Formel."], "tag": "v"}, {"t": "Wiederholung II.3b: Wie viele Lösungen hat  x² + 4x + 5 = 0?", "l": ["D = −4: keine Lösung"], "tipp": "D = 16 − 20.", "tag": "w"}]}, "3": {"name": "Knifflig", "aufg": [{"t": "Entscheide und löse. Manchmal musst du erst ausmultiplizieren.", "l": ["L = { −1 ; 2 }", "L = { 0 ; 7 }", "L = { −3 ; 3 }", "L = { −1 ; 9 }"], "tipp": "Bei b) und d): erst ausmultiplizieren und ordnen.", "sub": ["( 2x − 1 )² = 9", "x · ( x − 5 ) = 2x", "3x² + 2 = x² + 20", "( x + 3 ) · ( x − 3 ) = 8x"]}, {"t": "Erfinde zu jedem Weg (Wurzel, Nullprodukt, binomische Formel, abc-Formel) eine Gleichung mit der Lösung x = 4.", "l": ["z. B. x² = 16 · x² − 4x = 0 · ( x − 4 )² = 0 · x² − x − 12 = 0"], "tipp": "Starte rückwärts: Welche Klammer gehört zu x = 4?", "tag": "v"}, {"t": "Auf der Landkarte gibt es keinen Weg für „Rot fehlt“.", "l": ["nein – sie ist linear (kein x²)", "umformen: 3x = −6 → x = −2"], "tipp": "Ohne x² ist es keine quadratische Gleichung.", "sub": ["Ist 3x + 6 = 0 eine quadratische Gleichung?", "Wie löst man sie?"], "tag": "v"}]}}}]};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\{([^{}\/]+)\/([^{}]+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>').replace(/\[([+−])\]/g,'<span class="rot">$1</span>');
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const tagHtml=t=>t==="v"?'<span class="tag v">💡 Verständnis</span>':t==="w"?'<span class="tag w">↩ Wiederholung</span>':"";
function aufgabe(nr,a){
  let h=`<div class="kopf">Aufgabe ${nr}${tagHtml(a.tag)}</div><div class="txt">${esc(a.tag==="w"?a.t.replace(/^Wiederholung: /,""):a.t)}</div>`;
  if(a.sub)h+="<ol>"+a.sub.map((s,i)=>`<li><b class="tb">${"abcdefgh"[i]})</b>${esc(s)}</li>`).join("")+"</ol>";
  if(a.tipp)h+=`<details class="tipp"><summary>💡 Tipp</summary><div>${esc(a.tipp)}</div></details>`;
  return el("div","aufg",h);
}
// Lösungen (15.10.2026, Malte): nach „Lösungen anzeigen“ erst die Aufgabe wählen – nie alle Lösungen auf einmal. Nur richtige Lösungen.
function loesung(liste){
  const box=el("div");
  const b=el("button","loesbtn");b.textContent="Lösungen anzeigen";
  const f=el("div","frag",'<p>Hast du die Aufgabe wirklich im Heft gerechnet? Zu welcher Aufgabe möchtest du die Lösung sehen?</p>');f.hidden=true;
  const kn=el("div","lwahl"),w=el("div","loes");w.hidden=true;f.appendChild(kn);
  const zeile=([nr,a])=>{const l=a.sub?a.l.map((x,i)=>`${"abcdefgh"[i]}) ${esc(x)}`).join("&nbsp;&nbsp;&nbsp; "):a.l.map(esc).join("<br>");
    return `<div class="zeile"><b>Aufgabe ${nr}:</b> ${l}${a.idee?`<span class="warum">Warum: ${esc(a.idee)}</span>`:""}</div>`;};
  liste.forEach((e,i)=>{const k=el("button","",`Aufgabe ${esc(String(e[0]))}`);k.setAttribute("aria-pressed","false");
    k.onclick=()=>{kn.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed",j===i));w.innerHTML=zeile(e);w.hidden=false;};kn.appendChild(k);});
  b.onclick=()=>{const offen=!f.hidden;f.hidden=offen;w.hidden=true;kn.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.textContent=offen?"Lösungen anzeigen":"Lösungen ausblenden";};
  box.append(b,f,w);return box;
}
function teil(T){
  const root=el("section","teil");
  if(D.mehrteilig)root.appendChild(el("div","teilkopf",esc(T.name)));
  root.appendChild(el("details","erin",`<summary>Erinnerung: Das brauchst du</summary><ul>${T.erinnerung.map(e=>"<li>"+esc(e)+"</li>").join("")}</ul>`));
  root.appendChild(el("h2","","Aufgabe 1 · für alle"));
  root.append(aufgabe(1,T.a1),loesung([[1,T.a1]]));
  root.appendChild(el("h2","","Jetzt wählst du dein Niveau"));
  const wahl=el("div","wahl"),st=el("div");root.append(wahl,st);
  [["1","★"],["2","★★"],["3","★★★"]].forEach(([k,stern])=>{
    const s=T.stufen[k];
    const b=el("button","",`${stern}  ${esc(s.name)}<small>${D.untertitel[k-1]}</small>`);b.setAttribute("aria-pressed","false");
    const sec=el("section","stufe");sec.hidden=true;
    sec.appendChild(el("h2","",esc(stern+"  "+s.name)));
    s.aufg.forEach((a,i)=>sec.appendChild(aufgabe(stern+" "+(i+2),a)));
    sec.appendChild(loesung(s.aufg.map((a,i)=>[stern+" "+(i+2),a])));
    b.onclick=()=>{wahl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));st.querySelectorAll(".stufe").forEach(x=>x.hidden=x!==sec);};
    wahl.appendChild(b);st.appendChild(sec);
  });
  return root;
}
const box=document.getElementById("teile"),secs=D.teile.map(teil);
secs.forEach(s=>box.appendChild(s));
if(D.mehrteilig){
  document.getElementById("teilwahl").hidden=false;const tw=document.getElementById("tw");
  const zeig=i=>{secs.forEach((s,j)=>s.hidden=j!==i);tw.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));};
  D.teile.forEach((T,i)=>{const b=el("button","",esc(T.stunde)+`<small>${esc(T.kurz)}</small>`);b.onclick=()=>zeig(i);tw.appendChild(b);});
  zeig(D.teile.length-1);
}
</script>
</body>
</html>
