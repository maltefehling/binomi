<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Übung Kapitel II.4 · Bruchgleichungen</title>
<!-- Kapitel II Quadratische Gleichungen: Online-Übung nach dem Buchkapitel (QR-Code im Skript). Nur Aufgaben – gerechnet wird im Heft.
     Aufbau wie „I.3a Vermischte Übungen“: Aufgabe 1 für alle, dann ★ / ★★ / ★★★. Lösungen gemischt mit typischen Fehlern. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;
    --merk:#dde8f5;--merkL:#a9c1e0;--auf:#e8f4e6;--aufL:#c6e8c0;--hilf:#fdf6ea;--hilfL:#fbd9a8;--grau:#f2f2f2;--rot:#b03a2e;--gruen:#3f8f3a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{max-width:880px;margin:0 auto;padding:14px 16px 32px}
  .hinweis{background:var(--auf);border:1px solid var(--aufL);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.45;margin-bottom:12px}
  details.erin{background:var(--merk);border:1px solid var(--merkL);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:18px;line-height:1.5}
  details.erin summary{font-weight:700;color:var(--acc);cursor:pointer;min-height:30px}
  details.erin ul{margin:6px 0 0;padding-left:22px}
  h2{font-size:21px;color:var(--acc);margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--acc)}
  .aufg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .aufg .kopf{font-weight:700;color:var(--acc);font-size:18px;margin-bottom:4px}
  .aufg .txt{font-size:20px;line-height:1.45}
  .aufg ol{margin:6px 0 0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px 18px}
  .aufg li{font-size:21px;line-height:1.5;white-space:nowrap;overflow-x:auto}
  .aufg li b{color:var(--muted);font-weight:600;margin-right:6px}
  .tag{display:inline-block;font-size:14px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .tag.v{background:#fff3c4;color:#7a5b00}.tag.w{background:#e2d6f0;color:#4f2f7a}
  details.idee{margin-top:8px;font-size:18px}
  details.idee summary{color:var(--acc);cursor:pointer;font-weight:600}
  details.idee div{background:var(--grau);border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.45}
  .wahl{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .wahl button{flex:1 1 200px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;padding:12px 14px;font-size:19px;font-weight:700;min-height:56px;text-align:left}
  .wahl button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wahl small{display:block;font-weight:500;font-size:15px;opacity:.85}
  .stufe[hidden]{display:none}
  .loesbtn{border:1px solid var(--hilfL);background:var(--hilf);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:18px;font-weight:700;min-height:48px;margin-top:4px}
  .loes{background:var(--hilf);border:1px solid var(--hilfL);border-radius:12px;padding:10px 14px;margin-top:8px}
  .loes p{margin:0 0 8px;font-size:16px;color:var(--rot);font-weight:700}
  .loes .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
  .loes .grid span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;font-size:19px}
  .loes[hidden]{display:none}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
  .frage{font-size:18px;font-weight:700;color:var(--acc);margin:4px 0 2px}
  .teilkopf{font-size:22px;font-weight:800;color:var(--acc);margin:14px 0 8px}
  .teil[hidden]{display:none}
</style>
</head>
<body>
<header><h1>Übung Kapitel II.4 · Bruchgleichungen</h1></header>
<main>
  <div class="hinweis"><b>Rechne alle Aufgaben in deinem Heft.</b> Schreibe die Nummer der Aufgabe dazu. Kontrolliere erst am Ende mit den Lösungen.</div>
  <div id="teilwahl" hidden><div class="frage">Welche Stunde hattet ihr zuletzt?</div><div class="wahl" id="tw"></div></div>
  <div id="teile"></div>
  <footer>Fehling · II Quadratische Gleichungen</footer>
</main>
<script>
"use strict";
// D.teile: ein Teil pro Stunde eines aufgeteilten Buchkapitels (z. B. II.2a/b/c); Stundenauswahl nur bei aufgeteilten Kapiteln (D.mehrteilig).
const D={"untertitel": ["Mit Tipps in den Aufgaben", "Ohne Tipps", "Mehr Nachdenken"], "mehrteilig": true, "teile": [{"name": "Teil II.4a · Bruchgleichungen mit Summen", "stunde": "II.4a", "kurz": "Bruchgleichungen mit Summen", "erinnerung": ["Verbotene Zahl: Welche Zahl macht einen Nenner 0? Die darf x nicht sein.", "Hauptnenner finden und JEDEN Teil der Gleichung mal den Hauptnenner nehmen – auch die Zahl ohne Bruch.", "Summen und Differenzen zuerst in Klammern setzen:  x · ( x + 8 ) = x² + 8x,  nicht x · x + 8.", "Ausmultiplizieren, ordnen zu ax² + bx + c = 0, lösen.", "Verbotene Zahl streichen, Lösungsmenge angeben."], "a1": {"t": "Welche Zahl darf x nicht sein? Löse dann.", "sub": ["12/x = x + 1", "20/x = x − 1", "8/x + 1 = 5", "x + 6/x = 5"], "loes": ["x ≠ 0;  L = { −4 ; 3 }", "x ≠ 0;  L = { −4 ; 5 }", "x ≠ 0;  L = { 2 }", "x ≠ 0;  L = { 2 ; 3 }"], "falsch": ["x ≠ 0;  L = { −3,32 ; 3,32 }", "x ≠ 0;  L = { −4,58 ; 4,58 }", "x ≠ 0;  L = { 1,8 }", "x ≠ 0;  L = { −3 ; −2 }"], "mix": ["x ≠ 0;  L = { 2 }", "x ≠ 0;  L = { −4,58 ; 4,58 }", "x ≠ 0;  L = { 2 ; 3 }", "x ≠ 0;  L = { −4 ; 5 }", "x ≠ 0;  L = { −4 ; 3 }", "x ≠ 0;  L = { 1,8 }", "x ≠ 0;  L = { −3,32 ; 3,32 }", "x ≠ 0;  L = { −3 ; −2 }"]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Setze zuerst die Summe oder Differenz in Klammern, dann nimm mal x. Tipp: 21/x = x + 4  →  21 = x · ( x + 4 ).", "sub": ["21/x = x + 4", "24/x = x − 2", "10/x = x + 3"]}, {"t": "Wiederholung aus Klasse 8: Löse. Tipp: Auch die Zahl ohne Bruch wird mal den Hauptnenner genommen.", "sub": ["9/x + 2 = 5", "4/x + 1/2 = 3/2"], "tag": "w"}, {"t": "Stimmt das?   8/x = x − 2   | · x   →   8 = x · x − 2", "tag": "v", "idee": "Die Klammer fehlt: 8 = x · ( x − 2 ) = x² − 2x. Dann x² − 2x − 8 = 0, also L = { −2 ; 4 }."}, {"t": "Ein Rechteck hat 60 m², die Länge ist 4 m mehr als die Breite:  60/x = x + 4. Wie breit und wie lang ist es?"}, {"t": "Wiederholung II.3b: Wie viele Lösungen hat  x² − 2x + 5 = 0?", "tag": "w"}], "mix": ["L = { −4 ; 6 }", "zwei Lösungen", "L = { 2,2 }", "L = { −7 ; 3 }", "keine Lösung", "10 m breit, 14 m lang", "L = { −3,16 ; 3,16 }", "L = { −2,65 ; 2,65 }", "L = { −4,12 ; 4,12 }", "L = { 4 }", "L = { −5,10 ; 5,10 }", "6 m breit, 10 m lang", "L = { −5 ; 2 }", "L = { 3 }", "L = { −2 ; 4 }", "L = { 8 }"]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Löse.", "sub": ["x − 8/x = 2", "3/x = x − 2", "2x = 18/x"]}, {"t": "Lena: „Bei 2x = 18/x bekomme ich zwei Lösungen, bei 2/x = 18 nur eine.“ Warum ist das so?", "tag": "v", "idee": "2x = 18/x wird mal x zu 2x² = 18 – das ist quadratisch (x = 3 oder x = −3). 2/x = 18 wird zu 2 = 18x – das ist linear, also nur x = 1/9."}, {"t": "Ein rechteckiges Beet ist 3 m länger als breit und 40 m² groß:  40/x = x + 3. Wie breit und wie lang ist es?"}, {"t": "Wiederholung II.2c: Löse  x² + 10x = 24  mit quadratischer Ergänzung.", "tag": "w"}], "mix": ["L = { 3 }", "5 m × 8 m", "L = { −3 ; 3 }", "8 m × 11 m", "L = { −4 ; 2 }", "L = { −3 ; 1 }", "L = { −2 ; 12 }", "L = { −12 ; 2 }", "L = { −2 ; 4 }", "L = { −1 ; 3 }"]}, "3": {"name": "Knifflig", "aufg": [{"t": "Löse. Achtung: Hier steht auch im Zähler eine Summe.", "sub": ["( x + 4 )/x = x − 2", "12/x − 1 = x/2", "( 2x + 3 )/x = x"]}, {"t": "Tom:  ( x + 4 )/x = x − 2   | · x   →   x + 4 = x · x − 2. Wo steckt der Fehler?", "tag": "v", "idee": "Rechts fehlt die Klammer: x + 4 = x · ( x − 2 ) = x² − 2x. Dann x² − 3x − 4 = 0, also L = { −1 ; 4 }."}, {"t": "Erfinde eine Bruchgleichung der Form  a/x = x + b  mit den Lösungen 2 und −5.", "tag": "v", "idee": "Mal x: a = x² + bx, also x² + bx − a = 0. Mit den Lösungen 2 und −5 ist das ( x − 2 ) · ( x + 5 ) = x² + 3x − 10. Also b = 3, a = 10:  10/x = x + 3."}, {"t": "Wiederholung II.3b: Für welche Zahl c hat  x² − 6x + c = 0  genau eine Lösung?", "tag": "w"}], "mix": ["10/x = x − 3", "L = { −6 ; 4 }", "L = { −4 ; 1 }", "L = { −4 ; 6 }", "c = 3", "L = { −3 ; 1 }", "10/x = x + 3", "L = { −1 ; 3 }", "c = 9", "L = { −1 ; 4 }"]}}}, {"name": "Teil II.4b · Klammer im Nenner", "stunde": "II.4b", "kurz": "Klammer im Nenner", "erinnerung": ["Verbotene Zahlen: Setze JEDEN Nenner gleich 0. Bei ( x + 2 ) ist x = −2 verboten.", "Hauptnenner: Eine Klammer wie ( x + 2 ) ist ein Baustein – sie wird nicht zerlegt.", "Summen und Differenzen in Klammern setzen, dann jeden Teil mal den Hauptnenner nehmen und kürzen.", "Ausmultiplizieren, ordnen, lösen.", "Ist eine Lösung verboten, fällt sie weg."], "a1": {"t": "Welche Zahlen darf x nicht sein? Löse dann.", "sub": ["x²/( x + 4 ) = 16/( x + 4 )", "6/( x + 1 ) = x", "2/( x − 1 ) = x", "24/x − 24/( x + 2 ) = 1"], "loes": ["x ≠ −4;  L = { 4 }", "x ≠ −1;  L = { −3 ; 2 }", "x ≠ 1;  L = { −1 ; 2 }", "x ≠ 0, x ≠ −2;  L = { −8 ; 6 }"], "falsch": ["x ≠ −4;  L = { −4 ; 4 }", "x ≠ −1;  L = { −2,24 ; 2,24 }", "x ≠ 1;  L = { 2 }", "x ≠ 0, x ≠ −2;  L = { 6 }"], "mix": ["x ≠ 0, x ≠ −2;  L = { 6 }", "x ≠ 0, x ≠ −2;  L = { −8 ; 6 }", "x ≠ −1;  L = { −2,24 ; 2,24 }", "x ≠ −4;  L = { −4 ; 4 }", "x ≠ 1;  L = { 2 }", "x ≠ 1;  L = { −1 ; 2 }", "x ≠ −4;  L = { 4 }", "x ≠ −1;  L = { −3 ; 2 }"]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Welche Zahlen darf x nicht sein? Tipp: Setze jeden Nenner gleich 0.", "sub": ["5/( x − 4 ) = 2", "3/( x + 6 ) = 1/x", "7/( 2x ) = 1/( x − 5 )"]}, {"t": "Finde den Hauptnenner. Tipp: Eine Klammer ist ein Baustein.", "sub": ["x  und  ( x + 4 )", "3x  und  ( x − 2 )", "x  und  x · ( x − 1 )"]}, {"t": "Löse. Tipp: Nimm mal den Nenner und setze die rechte Seite in Klammern:  12 = ( x + 1 ) · x. Schau nach dem Kürzen, welche Steine da sind!", "sub": ["12/( x + 1 ) = x", "8/( x − 2 ) = x", "x²/( x + 1 ) = 4x/( x + 1 )"]}, {"t": "Stimmt das?   x²/( x − 2 ) = 4/( x − 2 )   →   x² = 4   →   L = { −2 ; 2 }", "tag": "v", "idee": "Nein. x = 2 ist verboten, denn dann wäre der Nenner 0. Richtig: L = { −2 }."}, {"t": "Wiederholung II.4a: Löse  15/x = x + 2.", "tag": "w"}], "mix": ["x ≠ −6 und x ≠ 0", "x ≠ 6", "L = { −2 }", "L = { −2 ; 4 }", "x ≠ −4", "x ≠ −5", "x ≠ 0 und x ≠ 5", "x · ( x + 4 )", "L = { −4 ; 3 }", "L = { −3 ; 5 }", "L = { −3,16 ; 3,16 }", "L = { 0 ; 4 }", "L = { −5 ; 3 }", "3x · ( x − 2 )", "L = { −2 ; 2 }", "x² · ( x − 1 )", "x · ( x − 1 )", "x + 4", "L = { 4 }", "x ≠ 4", "L = { −3,32 ; 3,32 }"]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Löse. Achte auf die verbotenen Zahlen.", "sub": ["30/x − 30/( x + 1 ) = 1", "12/x + 12/( x + 2 ) = 5", "x/( x − 1 ) = 2/x"]}, {"t": "Tom rechnet:  30/x − 30/( x + 1 ) = 1   | · x · ( x + 1 )   →   30x + 1 − 30x = x · ( x + 1 ). Stimmt das?", "tag": "v", "idee": "Nein, die Klammer fehlt: 30 · ( x + 1 ) − 30 · x = x · ( x + 1 ). Dann 30 = x² + x, also x² + x − 30 = 0 und L = { −6 ; 5 }."}, {"t": "Ein Ausflug kostet 120 € Busmiete. Kommen 4 Leute mehr mit, zahlt jeder 5 € weniger:  120/x − 120/( x + 4 ) = 5. Wie viele waren es zuerst?"}, {"t": "Wiederholung II.3a: Löse mit der abc-Formel  2x² + x − 6 = 0.", "tag": "w"}], "mix": ["L = { 4 }", "L = { −6 ; 5 }", "L = { −1,2 ; 4 }", "L = { −2 ; 1,5 }", "L = { −5 ; 6 }", "12 Personen", "8 Personen", "L = { }", "L = { −0,73 ; 2,73 }", "L = { −1,5 ; 2 }"]}, "3": {"name": "Knifflig", "aufg": [{"t": "Löse. Bestimme zuerst alle verbotenen Zahlen.", "sub": ["( x + 2 )/x = 3/( x − 2 )", "x/( x − 1 ) + 2/x = 3", "x²/( x + 2 ) = 4/( x + 2 )"]}, {"t": "Warum kann eine Bruchgleichung weniger Lösungen haben als die quadratische Gleichung, die beim Rechnen entsteht?", "tag": "v", "idee": "Beim Malnehmen verschwinden die Nenner. Eine Lösung der quadratischen Gleichung kann aber eine verbotene Zahl sein – sie macht einen Nenner 0 und fällt weg."}, {"t": "Erfinde eine Bruchgleichung mit ( x − 5 ) im Nenner, bei der eine Lösung wegfällt.", "tag": "v", "idee": "Zum Beispiel x²/( x − 5 ) = 25/( x − 5 ): x² = 25, also x = 5 oder x = −5. Die 5 ist verboten, also L = { −5 }."}, {"t": "Wiederholung II.2a: Löse  3x² = 12x.", "tag": "w"}], "mix": ["L = { 0 ; 4 }", "L = { 4 }", "L = { −4 ; 1 }", "L = { 0,5 ; 2 }", "L = { −2 ; −0,5 }", "L = { −1 ; 4 }", "L = { −2 ; 2 }", "L = { 2 }"]}}}]};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const tagHtml=t=>t==="v"?'<span class="tag v">💡 Verständnis</span>':t==="w"?'<span class="tag w">↩ Wiederholung</span>':"";
function aufgabe(nr,a){
  let h=`<div class="kopf">Aufgabe ${nr}${tagHtml(a.tag)}</div><div class="txt">${esc(a.tag==="w"?a.t.replace(/^Wiederholung: /,""):a.t)}</div>`;
  if(a.sub)h+="<ol>"+a.sub.map((s,i)=>`<li><b>${"abcdefgh"[i]})</b>${esc(s)}</li>`).join("")+"</ol>";
  if(a.idee)h+=`<details class="idee"><summary>Lösungsidee anzeigen</summary><div>${esc(a.idee)}</div></details>`;
  return el("div","aufg",h);
}
function loesung(l){
  const box=el("div");
  const b=el("button","loesbtn");b.textContent="Lösungen anzeigen";
  const w=el("div","loes",'<p>Achtung: Nicht alle Ergebnisse stimmen! Findest du dein Ergebnis nicht, suche den Fehler in deiner Rechnung.</p><div class="grid">'+l.map(x=>`<span>${esc(x)}</span>`).join("")+"</div>");w.hidden=true;
  b.onclick=()=>{w.hidden=!w.hidden;b.textContent=w.hidden?"Lösungen anzeigen":"Lösungen ausblenden";};
  box.append(b,w);return box;
}
function teil(T){
  const root=el("section","teil");
  if(D.mehrteilig)root.appendChild(el("div","teilkopf",esc(T.name)));
  root.appendChild(el("details","erin",`<summary>Erinnerung: Das brauchst du</summary><ul>${T.erinnerung.map(e=>"<li>"+esc(e)+"</li>").join("")}</ul>`));
  root.appendChild(el("h2","","Aufgabe 1 · für alle"));
  root.append(aufgabe(1,T.a1),loesung(T.a1.mix));
  root.appendChild(el("h2","","Jetzt wählst du dein Niveau"));
  const wahl=el("div","wahl"),st=el("div");root.append(wahl,st);
  [["1","★"],["2","★★"],["3","★★★"]].forEach(([k,stern])=>{
    const s=T.stufen[k];
    const b=el("button","",`${stern}  ${esc(s.name)}<small>${D.untertitel[k-1]}</small>`);b.setAttribute("aria-pressed","false");
    const sec=el("section","stufe");sec.hidden=true;
    sec.appendChild(el("h2","",esc(stern+"  "+s.name)));
    s.aufg.forEach((a,i)=>sec.appendChild(aufgabe(stern+" "+(i+2),a)));
    sec.appendChild(loesung(s.mix));
    b.onclick=()=>{wahl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));st.querySelectorAll(".stufe").forEach(x=>x.hidden=x!==sec);};
    wahl.appendChild(b);st.appendChild(sec);
  });
  return root;
}
const box=document.getElementById("teile"),secs=D.teile.map(teil);
secs.forEach(s=>box.appendChild(s));
if(D.mehrteilig){
  document.getElementById("teilwahl").hidden=false;const tw=document.getElementById("tw");
  const zeig=i=>{secs.forEach((s,j)=>s.hidden=j!==i);tw.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));};
  D.teile.forEach((T,i)=>{const b=el("button","",esc(T.stunde)+`<small>${esc(T.kurz)}</small>`);b.onclick=()=>zeig(i);tw.appendChild(b);});
  zeig(D.teile.length-1);
}
</script>
</body>
</html>
