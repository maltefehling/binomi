<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wo steckt die eine Praline?</title>
<!-- I.3b Zweite binomische Formel: Schachtel 10 · 10. Tom isst 1 Spalte + 1 Reihe, Lena 2 Spalten + 2 Reihen.
     Die Ecke steckt in Spalte UND Reihe: Sie wird doppelt abgezogen, aber nur einmal gegessen → + b².
     „Zum Flächenbild“ zeigt (10 − 2)² = 100 − 20 − 20 + 4. -->
<style>
  :root{
    --f1:#bcd3f2; --f2:#c6e8c0; --f3:#fbd9a8; --c2:#3f8f3a; --c3:#c0700f; --eat:#d64545;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;min-height:46px}
  .btn[aria-pressed="true"]{background:var(--acc);color:#fff}
  .btn[disabled]{opacity:.35}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 520px;max-width:640px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 280px}
  .cap{min-height:100px;font-size:21px;font-weight:600;color:var(--acc);line-height:1.4;margin:4px 0 12px}
  .calc{font-size:25px;line-height:1.7;min-height:80px}
  .calc .e{color:var(--eat);font-weight:700}.calc .g{color:var(--c2);font-weight:700}.calc .o{color:var(--c3);font-weight:700}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
  .blink{animation:bl .5s ease-in-out 6 alternate}
  @keyframes bl{from{opacity:1}to{opacity:.15}}
</style>
</head>
<body>
<header><h1>Wo steckt die eine Praline?</h1></header>
<main>
  <div class="bar">
    <button class="btn" id="bT" aria-pressed="false">Tom: 1 Spalte und 1 Reihe</button>
    <button class="btn" id="bL" aria-pressed="false">Lena: 2 Spalten und 2 Reihen</button>
    <button class="btn" id="bF" aria-pressed="false" disabled>Zum Flächenbild</button>
  </div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 560 520" aria-label="Quadratische Pralinenschachtel mit 10 mal 10 Pralinen"></svg>
    <div class="side">
      <div class="cap" id="cap">Wähle oben eine Schachtel.</div>
      <div class="calc" id="calc"></div>
    </div>
  </div>
</main>
<footer>Fehling · Zweite binomische Formel</footer>

function box(){
  svg.innerHTML="";cells=[];
  el("rect",{x:X0-6,y:Y0-6,width:N*C+12,height:N*C+12,rx:8,fill:"#f6efe6",stroke:"#8a6a4a","stroke-width":3});
  for(let r=0;r<N;r++){cells[r]=[];for(let c=0;c<N;c++){
    const g=el("g",{});
    el("rect",{x:X0+c*C,y:Y0+r*C,width:C,height:C,fill:"#fff",stroke:"#e2d6c8","stroke-width":1},g);
    el("image",{href:IMG.truffel,x:X0+c*C+4,y:Y0+r*C+4,width:C-8,height:C-8},g);
    cells[r][c]={g,marks:0};
  }}
  const t=el("text",{x:X0+N*C/2,y:Y0-34,"text-anchor":"middle","font-size":22,"font-weight":700,fill:"var(--ink)"});t.textContent="10";
  const l=el("text",{x:X0-34,y:Y0+N*C/2,"text-anchor":"middle","dominant-baseline":"central","font-size":22,"font-weight":700,fill:"var(--ink)"});l.textContent="10";
}
// eine Praline als gegessen markieren (rot). Zweite Markierung = doppelt abgezogen
function mark(r,c){
  const z=cells[r][c];z.marks++;
  el("rect",{x:X0+c*C+2,y:Y0+r*C+2,width:C-4,height:C-4,rx:5,fill:"var(--eat)",opacity:z.marks===1?.35:.6});
  if(z.marks===2){const t=el("text",{x:X0+c*C+C/2,y:Y0+r*C+C/2,"text-anchor":"middle","dominant-baseline":"central","font-size":15,"font-weight":800,fill:"#fff"});t.textContent="2×";z.badge=t;}
}
function setBtn(id){["bT","bL","bF"].forEach(b=>document.getElementById(b).setAttribute("aria-pressed",b===id));}

async function essen(k,name){
  const my=++run;const alive=()=>my===run;const say=t=>{if(alive())cap.textContent=t;};
  setBtn(k===1?"bT":"bL");box();
  const n=k*N, rest=N-k;
  calc.innerHTML="In der Schachtel: <b>100</b>";
  say(`Die Schachtel hat 10 · 10 = 100 Pralinen. ${name} isst ${k===1?"die rechte Spalte":"die zwei rechten Spalten"}.`);
  await wait(1800);if(!alive())return;
  for(let r=0;r<N;r++){for(let c=N-k;c<N;c++)mark(r,c);await wait(90);if(!alive())return;}
  calc.innerHTML+=`<br>100 <span class="e">− ${n}</span> = ${100-n}`;
  await wait(1400);if(!alive())return;
  say(`Dann isst ${k===1?"er die untere Reihe":"sie die zwei unteren Reihen"}.`);
  await wait(1200);if(!alive())return;
  for(let c=0;c<N;c++){for(let r=N-k;r<N;r++)mark(r,c);await wait(90);if(!alive())return;}
  calc.innerHTML+=`<br>${100-n} <span class="e">− ${n}</span> = ${100-2*n}`;
  await wait(1400);if(!alive())return;

  say(`Halt! ${k===1?"Die Praline in der Ecke steckt":"Die Pralinen in der Ecke stecken"} in den Spalten UND in den Reihen. Sie wurden zweimal abgezogen.`);
  const ecke=[];for(let r=N-k;r<N;r++)for(let c=N-k;c<N;c++)ecke.push(r,c);
  const hi=el("rect",{x:X0+(N-k)*C-3,y:Y0+(N-k)*C-3,width:k*C+6,height:k*C+6,rx:6,fill:"none",stroke:"var(--c3)","stroke-width":5});
  hi.classList.add("blink");
  await wait(3200);if(!alive())return;

  say("Jetzt verschwinden die gegessenen Pralinen. Wie viele bleiben wirklich?");
  const weg=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(cells[r][c].marks)weg.push(cells[r][c].g);
  await tween(900,e=>weg.forEach(g=>g.setAttribute("opacity",1-e)));if(!alive())return;
  el("rect",{x:X0,y:Y0,width:rest*C,height:rest*C,fill:"none",stroke:"var(--acc)","stroke-width":5});
  calc.innerHTML+=`<br>Gezählt: ${rest} · ${rest} = <b>${rest*rest}</b>`;
  await wait(1800);if(!alive())return;
  const ek=k*k;
  say(`Gegessen wurde die Ecke aber nur einmal. Also muss sie einmal wieder dazu: + ${ek}.`);
  calc.innerHTML=`(10 − ${k})² = 100 <span class="e">− ${n} − ${n}</span> <span class="o">+ ${ek}</span> = <b>${rest*rest}</b><br><span style="font-size:18px;color:var(--muted)">Ecke: ${k} · ${k} = ${ek}, zweimal abgezogen, einmal gegessen</span>`;
  if(k===2){seenL=true;document.getElementById("bF").disabled=false;}
}

// Flächenbild: großes Quadrat minus zwei Streifen plus Ecke
async function flaeche(){
  const my=++run;const alive=()=>my===run;const say=t=>{if(alive())cap.textContent=t;};
  setBtn("bF");svg.innerHTML="";calc.innerHTML="";
  const S=N*C,b=2*C;
  const lab=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":o.size||22,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:0});e.textContent=t;return e;};
  const show=(els,ms=500)=>tween(ms,k=>els.forEach(e=>e.setAttribute("opacity",k)));
  const sq=el("rect",{x:X0,y:Y0,width:S,height:S,fill:"var(--f1)",stroke:"var(--ink)","stroke-width":3,opacity:0});
  const t10=[lab(X0+S/2,Y0-34,"10"),lab(X0-34,Y0+S/2,"10")];
  say("Das ist Lenas Schachtel als Flächenbild: ein Quadrat mit der Seite 10.");
  const tq=lab(X0+(S-b)/2,Y0+(S-b)/2,"10 · 10 = 100",{size:24});
  await show([sq,...t10,tq]);await wait(2200);if(!alive())return;
  say("Lena isst einen Streifen rechts: 10 · 2 = 20 Pralinen. Er wird abgezogen.");
  const sr=el("rect",{x:X0+S-b,y:Y0,width:b,height:S,fill:"var(--f2)",stroke:"var(--c2)","stroke-width":3,opacity:0});
  const tr=lab(X0+S-b/2,Y0+(S-b)/2,"−20",{fill:"var(--c2)",size:24});const tb2=lab(X0+S-b/2,Y0-34,"−2",{fill:"var(--c2)"});
  await show([sr,tr,tb2]);await wait(2200);if(!alive())return;
  say("Und einen Streifen unten: noch einmal 10 · 2 = 20. Auch er wird abgezogen.");
  const su=el("rect",{x:X0,y:Y0+S-b,width:S,height:b,fill:"var(--f2)",stroke:"var(--c2)","stroke-width":3,opacity:0});
  const tu=lab(X0+(S-b)/2,Y0+S-b/2,"−20",{fill:"var(--c2)",size:24});const tl2=lab(X0-34,Y0+S-b/2,"−2",{fill:"var(--c2)"});
  await show([su,tu,tl2]);await wait(2200);if(!alive())return;
  say("Die Ecke liegt in beiden Streifen. Sie wurde zweimal abgezogen – also kommt sie einmal wieder dazu: (−2) · (−2) = +4.");
  const ec=el("rect",{x:X0+S-b,y:Y0+S-b,width:b,height:b,fill:"var(--f3)",stroke:"var(--c3)","stroke-width":4,opacity:0});
  const te=lab(X0+S-b/2,Y0+S-b/2,"+4",{fill:"var(--c3)",size:24});
  await show([ec,te]);ec.classList.add("blink");await wait(1800);if(!alive())return;
  calc.innerHTML=`(10 − 2)²<br>= <b>100</b> <span class="g">− 20 − 20</span> <span class="o">+ 4</span><br>= <b>64</b>`;
  say("Im Skript schreibst du das als Flächenbild mit den Seiten 10 und −2: Das orange Feld ist plus.");
}
document.getElementById("bT").onclick=()=>essen(1,"Tom");
document.getElementById("bL").onclick=()=>essen(2,"Lena");
document.getElementById("bF").onclick=flaeche;
box();
</script>
</body>
</html>
