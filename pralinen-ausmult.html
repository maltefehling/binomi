<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zwei Wege – ein Ergebnis</title>
<!-- I.1 Ausmultiplizieren: Toms Weg (Länge · Breite) und Lenas Weg (Sorte für Sorte) an der Schachtel 3 · (4 + 5).
     „Beide Wege vergleichen“ verwandelt die Schachtel ins Flächenbild. Aufbau wie pralinen.html (I.2). -->
<style>
  :root{
    --c1:#2e5d9f; --c2:#3f8f3a; --f1:#bcd3f2; --f2:#c6e8c0;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:10px 18px;font-size:17px;font-weight:700;min-height:46px}
  .btn[aria-pressed="true"]{background:var(--acc);color:#fff}
  .btn[disabled]{opacity:.35}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 560px;max-width:700px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 280px}
  .cap{min-height:90px;font-size:21px;font-weight:600;color:var(--acc);line-height:1.4;margin:4px 0 12px}
  .calc{font-size:23px;line-height:1.7;min-height:80px}
  .calc .s1{color:var(--c1);font-weight:700}.calc .s2{color:var(--c2);font-weight:700}
  .calc small{font-size:17px;color:var(--muted)}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Zwei Wege – ein Ergebnis</h1></header>
<main>
  <div class="bar">
    <button class="btn" id="bT" aria-pressed="false">Weg von Tom</button>
    <button class="btn" id="bL" aria-pressed="false">Weg von Lena</button>
    <button class="btn" id="bV" aria-pressed="false" disabled>Beide Wege vergleichen</button>
  </div>
  <div class="wrap">
    <svg id="s" viewBox="0 30 640 290" aria-label="Pralinenschachtel mit zwei Sorten"></svg>
    <div class="side">
      <div class="cap" id="cap">Wähle oben einen Weg.</div>
      <div class="calc" id="calc"></div>
    </div>
  </div>
</main>
<footer>Fehling · Ausmultiplizieren</footer>

const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s"),cap=document.getElementById("cap"),calc=document.getElementById("calc");
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const SLOW=1.4;
const tween=(ms,f)=>new Promise(r=>{ms*=SLOW;const t0=performance.now();const s=t=>{const k=Math.min(1,(t-t0)/ms);f(k);k<1?requestAnimationFrame(s):r();};requestAnimationFrame(s);});
const wait=ms=>new Promise(r=>setTimeout(r,ms*SLOW));
let run=0,seen={T:false,L:false};

// Schachtel: 9 Pralinen lang (4 Nougat + 5 Herzen), 3 Reihen – wie im Skript
const C=56,X0=100,Y0=120,A=4,B=5,COLS=A+B,ROWS=3;
let pics=[];
function box(){
  svg.innerHTML="";pics=[];
  pics.push(el("rect",{x:X0-6,y:Y0-6,width:COLS*C+12,height:ROWS*C+12,rx:8,fill:"#f6efe6",stroke:"#8a6a4a","stroke-width":3}));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    pics.push(el("rect",{x:X0+c*C,y:Y0+r*C,width:C,height:C,fill:"#fff",stroke:"#e2d6c8","stroke-width":1}));
    pics.push(el("image",{href:IMG[c<A?"truffel":"herz"],x:X0+c*C+4,y:Y0+r*C+4,width:C-8,height:C-8}));
  }
}
const txt=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":o.anchor||"middle","dominant-baseline":"central","font-size":o.size||24,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:0});e.textContent=t;return e;};
const show=(e,ms=400)=>tween(ms,k=>e.setAttribute("opacity",k));
const frame=(x,y,w,h,col)=>el("rect",{x,y,width:w,height:h,rx:6,fill:"none",stroke:col,"stroke-width":5,opacity:0});
async function count(cells,col,my){
  for(const [x,y] of cells){if(my!==run)return;el("circle",{cx:x,cy:y,r:9,fill:col,opacity:.85});await wait(170);}
}
function setBtn(id){["bT","bL","bV"].forEach(b=>document.getElementById(b).setAttribute("aria-pressed",b===id));}
function done(k){seen[k]=true;if(seen.T&&seen.L)document.getElementById("bV").disabled=false;}

async function tom(){
  const my=++run;setBtn("bT");box();calc.innerHTML="";
  const say=t=>{if(my===run)cap.textContent=t;};
  say("Tom zählt zuerst, wie viele Pralinen in eine Reihe passen.");
  await wait(1200);if(my!==run)return;
  await count([...Array(A)].map((_,c)=>[X0+c*C+C/2,Y0-26]),"var(--c1)",my);
  const t1=txt(X0+A*C/2,Y0-58,"4");await show(t1);if(my!==run)return;
  await count([...Array(B)].map((_,c)=>[X0+(A+c)*C+C/2,Y0-26]),"var(--c2)",my);
  const t2=txt(X0+(A+B/2)*C,Y0-58,"5");await show(t2);
  await show(txt(X0+A*C,Y0-58,"+"));if(my!==run)return;
  calc.innerHTML="Länge: 4 + 5 = <b>9</b>";await wait(1600);if(my!==run)return;

  say("Dann zählt er, wie viele Reihen es sind.");
  await count([...Array(ROWS)].map((_,r)=>[X0-26,Y0+r*C+C/2]),"var(--acc)",my);
  await show(txt(X0-60,Y0+ROWS*C/2,"3"));if(my!==run)return;
  calc.innerHTML+="<br>Breite: <b>3</b>";await wait(1600);if(my!==run)return;

  say("Zum Schluss rechnet er Länge mal Breite.");
  await show(frame(X0-2,Y0-2,COLS*C+4,ROWS*C+4,"var(--acc)"),600);if(my!==run)return;
  calc.innerHTML+="<br>3 · (4 + 5) = 3 · 9 = <b>27</b>";
  await wait(1200);say("Tom rechnet also zuerst plus, dann mal.");
  done("T");
}

const BLOCKS=[
  {x:0,w:A,col:"var(--c1)",cls:"s1",t:"3 · 4 = 12",name:"Nougat: 3 Reihen mit je 4 Pralinen."},
  {x:A,w:B,col:"var(--c2)",cls:"s2",t:"3 · 5 = 15",name:"Herzen: 3 Reihen mit je 5 Pralinen."}];
async function lena(){
  const my=++run;setBtn("bL");box();calc.innerHTML="";
  const say=t=>{if(my===run)cap.textContent=t;};
  say("Lena rechnet zuerst aus, wie viele Pralinen es von jeder Sorte gibt.");
  await wait(1600);if(my!==run)return;
  const parts=[];
  for(const b of BLOCKS){
    say(b.name);
    await show(frame(X0+b.x*C+3,Y0+3,b.w*C-6,ROWS*C-6,b.col),500);if(my!==run)return;
    const bg=el("rect",{x:X0+b.x*C+b.w*C/2-72,y:Y0+ROWS*C/2-21,width:144,height:42,rx:8,fill:"#fff",stroke:b.col,"stroke-width":2,opacity:0});
    const t=txt(X0+b.x*C+b.w*C/2,Y0+ROWS*C/2,b.t,{size:23,fill:b.col});
    await Promise.all([show(bg),show(t)]);if(my!==run)return;
    parts.push(`<span class="${b.cls}">${b.t}</span>`);calc.innerHTML=parts.join("<br>");
    await wait(1500);if(my!==run)return;
  }
  say("Dann addiert sie die beiden Sorten.");
  calc.innerHTML=parts.join("<br>")+`<br><span class="s1">12</span> + <span class="s2">15</span> = <b>27</b>`;
  await wait(1400);say("Lena rechnet also zuerst mal, dann plus.");
  done("L");
}

// Vergleich: Die Schachtel wird zum Flächenbild
async function vergleich(){
  const my=++run;setBtn("bV");box();calc.innerHTML="";
  const say=t=>{if(my===run)cap.textContent=t;};
  say("Beide Wege ergeben 27. Jetzt wird aus der Schachtel ein Flächenbild.");
  await wait(1800);if(my!==run)return;
  const f1=el("rect",{x:X0,y:Y0,width:A*C,height:ROWS*C,fill:"var(--f1)",opacity:0});
  const f2=el("rect",{x:X0+A*C,y:Y0,width:B*C,height:ROWS*C,fill:"var(--f2)",opacity:0});
  await tween(1400,k=>{pics.forEach(p=>p.setAttribute("opacity",1-k));f1.setAttribute("opacity",k);f2.setAttribute("opacity",k);});
  if(my!==run)return;
  el("rect",{x:X0,y:Y0,width:A*C,height:ROWS*C,fill:"none",stroke:"var(--ink)","stroke-width":3});
  el("rect",{x:X0+A*C,y:Y0,width:B*C,height:ROWS*C,fill:"none",stroke:"var(--ink)","stroke-width":3});
  const lab=[txt(X0+A*C/2,Y0-34,"4"),txt(X0+A*C,Y0-34,"+"),txt(X0+(A+B/2)*C,Y0-34,"5"),txt(X0-34,Y0+ROWS*C/2,"3")];
  await Promise.all(lab.map(l=>show(l,600)));if(my!==run)return;
  say("Die Seiten sind 3 und 4 + 5 lang. Jede Sorte ist jetzt ein Feld.");
  await wait(2200);if(my!==run)return;
  const ft=[txt(X0+A*C/2,Y0+ROWS*C/2,"3 · 4 = 12",{fill:"var(--c1)"}),txt(X0+(A+B/2)*C,Y0+ROWS*C/2,"3 · 5 = 15",{fill:"var(--c2)"})];
  for(const t of ft){await show(t,600);await wait(600);if(my!==run)return;}
  calc.innerHTML=`<b>3 · (4 + 5)</b> = <span class="s1">3 · 4</span> + <span class="s2">3 · 5</span>`;
  say("Warum kommt bei beiden Wegen 27 heraus? Das erklärt ihr euch gleich gegenseitig.");
}
document.getElementById("bT").onclick=tom;
document.getElementById("bL").onclick=lena;
document.getElementById("bV").onclick=vergleich;
box();
</script>
