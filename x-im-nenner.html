<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Eine Bruchgleichung Schritt für Schritt lösen</title>
<!-- I.6 Bruchgleichungen, Kern der Stunde (2.11.2026, Wunsch Malte): erst Nenner aus Zahlen (2 und 3 → Hauptnenner 6),
     dann verwandelt sich die 2 in ein x – und man geht genauso vor (x und 3 → Hauptnenner 3x). Das x kürzt sich weg wie vorher die 2.
     Danach als Gleichung lösen, „x darf nicht 0 sein“, Probe. Am Ende ein Check „Finde einen gemeinsamen Nenner“ (jedes Vielfache zählt, x nur einmal). Langsam (SLOW, Lesezeit, Pause). -->
<style>
  :root{--hl:#c0700f;--hlbg:#fde7c8;--n1:#2e5d9f;--n2:#3f8f3a;--x:#7b4fa0;--xbg:#efe6f7;--korb:#fdf6ea;--korbL:#fbd9a8;--rot:#b03a2e;
    --ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;min-height:46px}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 520px;max-width:660px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 320px}
  .cap{min-height:120px;font-size:22px;font-weight:600;color:var(--acc);line-height:1.45;margin:4px 0 12px}
  .calc{font-size:23px;line-height:2.2}
  .calc .h{color:var(--hl);font-weight:800}.calc .x{color:var(--x);font-weight:800}
  .calc .alt{color:var(--muted)}
  .calc small{font-size:17px;color:var(--muted)}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .12em;font-size:.95em}
  .fr span:last-child{border-top:2px solid currentColor;padding:0 .15em}
  .merke{display:none;background:#e3eef9;border:1px solid #b9d0ea;border-radius:12px;padding:10px 14px;font-size:19px;line-height:1.45;margin-top:12px}
  .merke.an{display:block}
  .check{display:none;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:1068px}
  .check.an{display:block}
  .check h2{margin:.2rem 0 .4rem;font-size:21px;color:var(--acc)}
  .check .cq{font-size:21px;line-height:1.6;margin-bottom:8px}
  .check .crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:24px;font-weight:700}
  .check input{width:4.2em;height:48px;font-size:24px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:10px}
  .check input:focus{outline:none;border-color:var(--acc)}
  .check .fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:18px;line-height:1.45}
  .fb.ok{background:#e4f4e2;color:#24622a}.fb.tipp{background:#fff4e0;color:#7a4a08}.fb.bad{background:#fde8e6;color:#9b2c1f}
  /* iPad (2.11.2026): 1024×768 quer ohne Scrollen bis zum Bild, 768×1024 hoch: Bild oben, Text darunter */
  header{padding:8px 16px}
  main{padding:8px 12px 12px}
  .bar{gap:6px;margin-bottom:8px;align-items:center}
  .bar .btn{font-size:15px;padding:6px 12px;min-height:44px}
  svg{flex:0 0 auto;width:auto;max-width:58vw;height:calc(100vh - 130px);max-height:460px}
  .wrap{flex-wrap:nowrap;gap:14px}
  .side{flex:1 1 auto;min-width:0}
  .cap{min-height:0;font-size:19px;margin:0 0 8px}
  @media (orientation:portrait){
    .wrap{flex-direction:column}
    svg{max-width:100%;width:100%;height:auto;max-height:44vh}
    .side{width:100%}
  }
  .tab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin:0 0 8px;font-size:16px}
  .tab .tt{font-size:15px;color:var(--muted);margin:2px 0 4px}
  .tab .z{display:flex;gap:8px;align-items:center;padding:3px 6px;border-radius:8px;min-height:30px}
  .tab .z .nr{font-weight:800;color:var(--muted);min-width:1.4em}
  .tab .z .v{font-weight:800;color:#24622a}
  .tab .z.akt{background:var(--hlbg);outline:2px solid var(--hl)}
  .frage{background:#fff4e0;border:2px solid var(--hl);border-radius:12px;padding:8px 12px;font-size:18px;line-height:1.45;margin:0 0 8px;display:none}
  .frage.an{display:block}
  .weiter{display:none;background:var(--hl);border-color:var(--hl);color:#fff;font-size:17px;margin:0 0 8px}
  .weiter.an{display:inline-block}
  .vrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .vrow input{width:5em;height:46px;font-size:22px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:10px}
  .frage .btn{font-size:16px;min-height:44px}
  .weiterbtn{background:var(--hl);border-color:var(--hl);color:#fff}
  .vfb{margin-top:6px;padding:6px 10px;border-radius:10px;font-size:17px;line-height:1.4}
  .vfb.ok{background:#e4f4e2;color:#24622a}.vfb.tipp{background:#fff4e0;color:#7a4a08}
  .rollenmodus .calc{display:none}
  @media (orientation:portrait){.frage{order:-2}.weiter{order:-1;align-self:flex-start}.side{display:flex;flex-direction:column}}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Eine Bruchgleichung Schritt für Schritt lösen</h1></header>
<main>
  <div class="bar" id="bar"></div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 640 300" aria-label="Erst Nenner aus Zahlen, dann wird aus der 2 ein x – das Vorgehen bleibt gleich"></svg>
    <div class="side"><div class="tab" id="tab" hidden></div><div class="frage" id="frage"></div><button class="btn weiter" id="weiter" type="button">▶ Weiter</button>
      <div class="cap" id="cap"></div><div class="calc" id="calc"></div>
      <div class="merke" id="merke"><b>Merke:</b> Steht x im Nenner, gehört x <b>einmal</b> in den gemeinsamen Nenner. Dann geht alles wie mit Zahlen: alles mal den gemeinsamen Nenner, kürzen, lösen.<br><b>x darf nicht 0 sein.</b></div></div>
  </div>
  <section class="check" id="check"></section>
</main>
<footer>Fehling · Bruchgleichungen</footer>
<script>
"use strict";
let LESE_BIS=0,PAUSE=false;
const lesezeit=t=>2500+t.length*90;
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s"),cap=document.getElementById("cap"),calc=document.getElementById("calc"),merke=document.getElementById("merke");
new MutationObserver(()=>{LESE_BIS=performance.now()+lesezeit(cap.textContent||"");}).observe(cap,{childList:true,characterData:true,subtree:true});
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const SLOW=1.6;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const tween=(ms,f)=>new Promise(r=>{ms*=SLOW;let t0=null,pz=0,ps=null;const s=t=>{if(t0===null)t0=t;
  if(PAUSE){if(ps===null)ps=t;requestAnimationFrame(s);return;}if(ps!==null){pz+=t-ps;ps=null;}
  const k=Math.min(1,(t-t0-pz)/ms);f(ease(k));k<1?requestAnimationFrame(s):r();};requestAnimationFrame(s);});
const wait=ms=>new Promise(r=>{const ende=performance.now()+ms*SLOW;const t=()=>{if(!PAUSE&&performance.now()>=Math.max(ende,LESE_BIS))r();else setTimeout(t,100);};t();});
const T=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":o.size||36,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:o.op??1});e.textContent=t;return e;};
const fade=(els,to,ms=600)=>{const f=els.map(e=>+(e.getAttribute("opacity")??1));return tween(ms,k=>els.forEach((e,i)=>e.setAttribute("opacity",f[i]+(to-f[i])*k)));};
const move=(e,x1,y1,ms=1000)=>{const x0=+e.getAttribute("x"),y0=+e.getAttribute("y");return tween(ms,k=>{e.setAttribute("x",x0+(x1-x0)*k);e.setAttribute("y",y0+(y1-y0)*k);});};
const fr=(z,n,c="")=>`<span class="fr ${c}"><span>${z}</span><span>${n}</span></span>`;
let run=0;

// Bruch in der Szene: Zähler, Strich, Nenner → {cx, z, l, n}
function bruch(cx,z,n,farbe){return {cx,z:T(cx,52,z),l:el("line",{x1:cx-24,y1:80,x2:cx+24,y2:80,stroke:"var(--ink)","stroke-width":3.5}),n:T(cx,108,n,{fill:farbe})};}
const breite=e=>e.getBBox().width;
const strich=(B,x1,x2)=>{const a1=+B.l.getAttribute("x1"),a2=+B.l.getAttribute("x2");return tween(900,k=>{B.l.setAttribute("x1",a1+(x1-a1)*k);B.l.setAttribute("x2",a2+(x2-a2)*k);});};
/* Hauptnenner mal Bruch – wie in der Erinnerung: Die Zahl erscheint vor dem Bruch und wandert dann hoch in den Zähler.
   teile: [{t, fill}] z. B. 6 und ·  oder  3, x und ·  */
async function inZaehler(B,teile){
  const els=teile.map(t=>T(0,80,t.t,{size:32,fill:t.fill||"var(--ink)",op:0}));
  const ws=els.map(breite),wz=breite(B.z);
  const gp=teile.map((t,i)=>teile[i+1]&&teile[i+1].t==="x"?1:8);   // „3x“ ohne Lücke, sonst kleiner Abstand
  const summe=ws.reduce((s,w,i)=>s+w+gp[i],0);
  // vor dem Bruch aufreihen
  let x=B.cx-34-summe;
  els.forEach((e,i)=>{e.setAttribute("x",x+ws[i]/2);x+=ws[i]+gp[i];});
  await fade(els,1,700);await wait(1200);
  // in den Zähler: Teile + bisheriger Zähler mittig über dem Strich
  const ges=summe+wz;let x0=B.cx-ges/2;
  const ziele=els.map((e,i)=>{const z=x0+ws[i]/2;x0+=ws[i]+gp[i];return z;});
  await Promise.all([...els.map((e,i)=>move(e,ziele[i],52,1200)),move(B.z,x0+wz/2,52,1200),strich(B,B.cx-ges/2-8,B.cx+ges/2+8)]);
  return els;
}
const T_=(x,y,t,g)=>T(x,y,t,{size:g,fill:"#b03a2e",op:0});
/* Kürzen deutlich (Malte 2.11.2026): beide Zahlen leuchten auf, werden durchgestrichen, gekürzte Zahl oben und unten dazuschreiben */
async function kuerze(oben,unten,restO,restU,gr=22){
  const hl=[oben,unten].map(e=>{const b=e.getBBox();const r=el("rect",{x:b.x-6,y:b.y-3,width:b.width+12,height:b.height+6,rx:8,fill:"#fde7c8",stroke:"#c0700f","stroke-width":2,opacity:0});e.parentNode.insertBefore(r,e);return r;});
  for(let i=0;i<2;i++){await fade(hl,1,450);await fade(hl,0.35,450);}
  await fade(hl,1,300);await wait(1500);
  const s=[oben,unten].map(e=>{const b=e.getBBox();return el("line",{x1:b.x-4,y1:b.y+b.height-5,x2:b.x+b.width+4,y2:b.y+5,stroke:"#b03a2e","stroke-width":3.5,opacity:0});});
  await fade(s,1,700);await wait(800);
  const bo=oben.getBBox(),bu=unten.getBBox();
  const r=[T_(bo.x+bo.width/2,bo.y-gr*0.55,String(restO),gr),T_(bu.x+bu.width/2,bu.y+bu.height+gr*0.55,String(restU),gr)];
  await fade(r,1,700);await fade(hl,0,500);
  return [...hl,...s,...r];
}
async function zurueck(B,weg){await fade(weg,0,600);weg.forEach(e=>e.remove());await Promise.all([move(B.z,B.cx,52,800),strich(B,B.cx-24,B.cx+24)]);}

/* ---------- Geführte Tabelle zur Skript-Aufgabe 3/x + 1/(2x) = 7/4 (Malte 4.11.2026) ----------
   Wie die Partner-Tabelle: Zeilen ①–⑦, bei ①, ② und ⑥ zuerst eine Vermutung eingeben,
   bei „keine Idee“ oder falscher Vermutung wird der Schritt animiert gezeigt. Sonst: erst selbst rechnen, dann vergleichen. */
const XZ=[["①","x darf nicht sein:"],["②","Gemeinsamer Nenner:"],["③","Alles mal:"],["④","Kürzen:"],["⑤","Zusammenfassen:"],["⑥","x ="],["⑦","Probe:"]];
function xTabelle(){
  const t=$id("tab");t.hidden=false;
  t.innerHTML=`<div class="tt">Deine Tabelle im Skript</div>`+XZ.map((z,i)=>`<div class="z"><span class="nr">${z[0]}</span><span>${z[1]}</span><span class="v" id="v${i}"></span></div>`).join("");
}
const xzeile=(i,w)=>{document.querySelectorAll(".tab .z").forEach((z,k)=>z.classList.toggle("akt",k===i));if(w!=null)$id("v"+i).innerHTML=w;};
function xhalt(i,frage,eintragen=false){
  const f=$id("frage"),w=$id("weiter");xzeile(i);
  f.innerHTML=frage+(eintragen?"":`<br><b>Rechne selbst und schreib es in Zeile ${XZ[i][0]}. Dann tippe auf ▶ Weiter.</b>`);f.classList.add("an");
  w.textContent=eintragen?"▶ Weiter – ist eingetragen":`▶ Weiter – Zeile ${XZ[i][0]} ist ausgefüllt`;w.classList.add("an");
  setTimeout(()=>f.scrollIntoView({block:"nearest",behavior:"smooth"}),100);
  return new Promise(r=>{w.onclick=()=>{f.classList.remove("an");w.classList.remove("an");r();};});
}
// Vermutung: pruefe(v) → {ok, fast, msg}; Ergebnis {ok, zeigen}
function xvermutung(i,frage,pruefe,ph="Zahl"){
  const f=$id("frage");xzeile(i);
  f.innerHTML=`<b>Zeile ${XZ[i][0]}: Deine Vermutung</b><br>${frage}
    <div class="vrow"><input id="vin" inputmode="${ph==="Zahl"?"numeric":"text"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}"><button class="btn" id="vpr" type="button">Prüfen ✓</button></div>
    <button class="btn" id="vzeig" type="button">Ich habe keine Idee – zeig mir, wie es geht</button><div id="vfb"></div>`;
  f.classList.add("an");setTimeout(()=>f.scrollIntoView({block:"nearest",behavior:"smooth"}),100);
  return new Promise(r=>{
    const fertig=(ok,zeigen)=>{f.classList.remove("an");r({ok,zeigen});};
    $id("vzeig").onclick=()=>fertig(false,true);
    const pr=()=>{const v=$id("vin").value.trim(),fb=$id("vfb");if(!v){fb.innerHTML='<div class="vfb tipp">Tippe zuerst etwas ein.</div>';return;}
      const e=pruefe(v);
      if(e.ok){fb.innerHTML=`<div class="vfb ok">✅ ${e.msg}</div><div class="vrow"><button class="btn weiterbtn" id="vw" type="button">▶ Weiter</button><button class="btn" id="vwarum" type="button">Zeig mir trotzdem, wie es geht</button></div>`;
        $id("vw").onclick=()=>fertig(true,false);$id("vwarum").onclick=()=>fertig(true,true);}
      else if(e.fast){fb.innerHTML=`<div class="vfb tipp">🤔 ${e.msg}</div>`;}
      else{fb.innerHTML=`<div class="vfb tipp">${e.msg}</div><button class="btn weiterbtn" id="vz2" type="button">Zeig mir, wie es geht</button>`;$id("vz2").onclick=()=>fertig(false,true);}};
    $id("vpr").onclick=pr;$id("vin").addEventListener("keydown",e=>{if(e.key==="Enter")pr();});
  });
}
const $id=id=>document.getElementById(id);
const zahlAus=v=>+v.replace(",",".").replace(/^x\s*=\s*/i,"").trim();

async function playTabelle(){
  const my=++run,alive=()=>my===run,say=t=>{if(alive())cap.textContent=t;};
  svg.innerHTML="";calc.innerHTML="";merke.classList.remove("an");$id("check").classList.remove("an");
  $id("frage").classList.remove("an");$id("weiter").classList.remove("an");document.body.classList.add("rollenmodus");
  xTabelle();
  const B1=bruch(150,"3","x","var(--x)");T(228,80,"+");const B2=bruch(320,"1","2x","var(--x)");T(408,80,"=");const B3=bruch(480,"7","4","var(--n2)");
  say("Die Aufgabe aus dem Skript: 3/x + 1/(2x) = 7/4. Hier steht x im Nenner.");
  await wait(1800);if(!alive())return;

  // ① Welche Zahl darf x nicht sein?
  let v=await xvermutung(0,"Welche Zahl darf man für x <b>nicht</b> einsetzen? Tipp: Wann wird ein Nenner 0?",
    s=>{const n=zahlAus(s);if(n===0)return{ok:true,msg:"Richtig! Bei x = 0 werden die Nenner x und 2x zu 0 – durch 0 kann man nicht teilen. Also D = ℚ \\ {0}."};
      if(isNaN(n))return{ok:false,msg:"Gib eine Zahl ein."};return{ok:false,msg:`Setze ${s} ein: Nenner x = ${s}, Nenner 2x = ${2*n}. Beide sind nicht 0 – mit ${s} kann man rechnen.`};});
  if(!alive())return;
  if(v.zeigen){
    say("Setze x = 0 ein: Der Nenner x wird 0, und der Nenner 2x wird 2 · 0 = 0. Durch 0 kann man nicht teilen.");
    const x0a=T(150,108,"0",{fill:"var(--rot)",op:0}),x0b=T(320,108,"2 · 0",{fill:"var(--rot)",op:0});
    await Promise.all([fade([B1.n,B2.n],0,500),fade([x0a,x0b],1,500)]);await wait(2800);if(!alive())return;
    await Promise.all([fade([x0a,x0b],0,500),fade([B1.n,B2.n],1,500)]);x0a.remove();x0b.remove();
  }
  xzeile(0,"0 &nbsp;<small>(D = ℚ \\ {0})</small>");
  if(!v.ok){await xhalt(0,"Schreib in Zeile ①: x darf nicht <b>0</b> sein.",true);if(!alive())return;}

  // ② gemeinsamer Nenner (Malte 5.11.2026: jedes gemeinsame Vielfache zählt, x nur einmal)
  v=await xvermutung(1,"Welcher <b>gemeinsame Nenner</b> passt zu den Nennern x, 2x und 4?",
    s=>{if(/x\s*(²|\^\s*2)|x\s*·?\s*x/i.test(s))return{fast:true,msg:"Achtung: Nimm das x nur <b>einmal</b>. Mit x² entsteht eine Gleichung, die du noch nicht lösen kannst."};
      const k=leseX(s);if(k===4)return{ok:true,msg:"Richtig! In 4x passen x, 2x und 4."};
      if(k&&k%4===0)return{ok:true,msg:`${s} klappt auch! Mit <b>4x</b> werden die Zahlen kleiner – darum rechnen wir hier mit 4x weiter.`};
      return{ok:false,msg:"Noch nicht. Schau dir an, wie man einen gemeinsamen Nenner findet."};},"z. B. 3x");
  if(!alive())return;
  if(v.zeigen){
    const kasten=[el("rect",{x:90,y:160,width:460,height:110,rx:16,fill:"var(--korb)",stroke:"var(--korbL)","stroke-width":3})];
    say("Erst die Zahlen in den Nennern: 2 (aus 2x) und 4. Nimm die größere Zahl: 4. Passt die 2 hinein? 4 : 2 = 2 – ja!");
    const z1=T(320,190,"Zahlen: 2 und 4  →  4 : 2 = 2 ✓  →  4",{size:20,fill:"var(--ink)",op:0});
    await fade([...kasten,z1],1,600);await wait(3800);if(!alive())return;
    say("Jetzt das x: Es steckt in x und in 2x. Du nimmst es nur einmal dazu – sonst entsteht x · x.");
    const z2=T(320,226,"x kommt einmal dazu  →  4 · x = 4x",{size:20,fill:"var(--x)",op:0});
    await fade([z2],1,600);await wait(3200);if(!alive())return;
    const erg=T(320,256,"Gemeinsamer Nenner: 4x",{size:20,fill:"var(--hl)",op:0});await fade([erg],1,500);
    await wait(2500);if(!alive())return;
    await fade([...kasten,z1,z2,erg],0,500);[...kasten,z1,z2,erg].forEach(e=>e.remove());
  }
  xzeile(1,"4x");
  if(!v.ok){await xhalt(1,"Schreib in Zeile ②: gemeinsamer Nenner <b>4x</b>.",true);if(!alive())return;}

  // ③ alles mal 4x – in den Zähler
  await xhalt(2,"Zeile ③: Nimm <b>jeden Teil</b> der Gleichung mal 4x – auch die rechte Seite. Der gemeinsame Nenner kommt in den Zähler.");if(!alive())return;
  say("Die 4x kommt in jeden Zähler.");
  const t4=()=>[{t:"4x",fill:"var(--hl)"},{t:"·"}];
  const [P1,P2,P3]=await Promise.all([inZaehler(B1,t4()),inZaehler(B2,t4()),inZaehler(B3,t4())]);if(!alive())return;
  xzeile(2,`${fr("4x · 3","x")} + ${fr("4x · 1","2x")} = ${fr("4x · 7","4")}`);
  await wait(1800);if(!alive())return;

  // ④ kürzen
  await xhalt(3,"Zeile ④: Kürze jeden Bruch. Was bleibt übrig?");if(!alive())return;
  say("4x und x → oben bleibt 4. 4x und 2x → oben bleibt 2. 4x und 4 → oben bleibt x. Die Brüche verschwinden!");
  await kuerze(P1[0],B1.n,4,1);await kuerze(P2[0],B2.n,2,1);await kuerze(P3[0],B3.n,"x",1);if(!alive())return;
  const r4=T(320,170,"12 + 2 = 7x",{size:28,fill:"var(--hl)",op:0});await fade([r4],1,600);
  xzeile(3,"4 · 3 + 2 · 1 = x · 7 &nbsp;→&nbsp; 12 + 2 = 7x");
  await wait(2000);if(!alive())return;

  // ⑤ zusammenfassen
  await xhalt(4,"Zeile ⑤: Fasse zusammen. Durch welche Zahl musst du dann teilen?");if(!alive())return;
  say("12 + 2 = 14. Also 14 = 7x. Damit x allein steht, teilen wir durch 7.");
  const r5=T(320,210,"14 = 7x   | : 7",{size:26,fill:"var(--hl)",op:0});await fade([r5],1,600);
  xzeile(4,"14 = 7x &nbsp;| : 7");
  await wait(1800);if(!alive())return;

  // ⑥ x
  v=await xvermutung(5,"Rechne aus: x = ?",s=>{const n=zahlAus(s);if(n===2)return{ok:true,msg:"Richtig! 14 : 7 = 2."};return{ok:false,msg:"Noch nicht."};});
  if(!alive())return;
  if(v.zeigen){say("14 : 7 = 2. Also x = 2.");const r6=T(320,248,"x = 2",{size:28,fill:"var(--hl)",op:0});await fade([r6],1,600);await wait(1800);if(!alive())return;}
  xzeile(5,"2");
  if(!v.ok){await xhalt(5,"Schreib in Zeile ⑥: x = <b>2</b>.",true);if(!alive())return;}

  // ⑦ Probe
  await xhalt(6,"Zeile ⑦: Mach die Probe – setze x = 2 in die Gleichung ein.");if(!alive())return;
  say("Probe: 3/2 + 1/4 = 6/4 + 1/4 = 7/4 ✓ – und 2 ist nicht 0, also erlaubt.");
  xzeile(6,`${fr(3,2)} + ${fr(1,4)} = ${fr(6,4)} + ${fr(1,4)} = ${fr(7,4)} ✓`);
  await wait(1500);if(!alive())return;
  xzeile(-1);
  merke.classList.add("an");
  baueCheck(checkGen);
}

async function play(){
  const my=++run,alive=()=>my===run,say=t=>{if(alive())cap.textContent=t;};
  document.getElementById('tab').hidden=true;document.body.classList.remove('rollenmodus');document.getElementById('frage').classList.remove('an');document.getElementById('weiter').classList.remove('an');
  svg.innerHTML="";calc.innerHTML="";merke.classList.remove("an");document.getElementById("check").classList.remove("an");
  // ---------- Teil 1: Nenner aus Zahlen ----------
  const B1=bruch(200,"4","2","var(--n1)");T(300,80,"+");const B2=bruch(410,"1","3","var(--n2)");
  say("Erst mit Zahlen: 4/2 + 1/3. Wie werden wir die Brüche los?");
  calc.innerHTML=`${fr(4,2)} + ${fr(1,3)}`;
  await wait(2500);if(!alive())return;
  el("rect",{x:130,y:170,width:400,height:90,rx:16,fill:"var(--korb)",stroke:"var(--korbL)","stroke-width":3});
  T(330,188,"gemeinsamer Nenner",{size:16,fill:"var(--muted)",w:600});
  say("Die Nenner 2 und 3: 2 · 3 = 6. In die 6 passen beide.");
  const k1=T(200,108,"2",{fill:"var(--n1)"}),k2=T(410,108,"3",{fill:"var(--n2)"});
  await Promise.all([move(k1,250,226),move(k2,330,226)]);if(!alive())return;
  T(290,226,"·");const kerg=T(420,226,"= 6",{fill:"var(--hl)",op:0});
  await fade([kerg],1,600);if(!alive())return;
  await wait(2200);if(!alive())return;

  say("Alles mal 6 – und wie in der Erinnerung kommt die 6 in den Zähler.");
  const [P1,P2]=await Promise.all([inZaehler(B1,[{t:"6",fill:"var(--hl)"},{t:"·"}]),inZaehler(B2,[{t:"6",fill:"var(--hl)"},{t:"·"}])]);if(!alive())return;
  calc.innerHTML=`${fr('<span class="h">6</span> · 4',2)} + ${fr('<span class="h">6</span> · 1',3)}`;
  await wait(2500);if(!alive())return;
  say("Jetzt kürzen: Die 6 oben und die 2 unten passen zusammen – 6 : 2 = 3, 2 : 2 = 1. Genauso 6 und 3. Die Nenner sind weg!");
  const S1=await kuerze(P1[0],B1.n,3,1);const S2=await kuerze(P2[0],B2.n,2,1);if(!alive())return;
  calc.innerHTML+=` &nbsp;=&nbsp; 3 · 4 + 2 · 1 = 12 + 2`;
  await wait(3200);if(!alive())return;

  // ---------- Teil 2: aus der 2 wird ein x ----------
  say("Und jetzt verwandelt sich die 2 in ein x. Wir gehen genauso vor!");
  calc.innerHTML=`<span class="alt">mit Zahlen: ${fr('6 · 4',2)} = 3 · 4 = 12</span>`;
  await Promise.all([zurueck(B1,[...P1,...S1]),zurueck(B2,[...P2,...S2])]);if(!alive())return;
  const xb=T(200,108,"x",{fill:"var(--x)",op:0}),xk=T(250,226,"x",{fill:"var(--x)",op:0});
  await Promise.all([fade([B1.n,k1,kerg],0,900),fade([xb,xk],1,900)]);if(!alive())return;
  B1.n=xb;
  const xbg=el("rect",{x:176,y:84,width:48,height:48,rx:10,fill:"var(--xbg)",opacity:0});svg.insertBefore(xbg,svg.firstChild);
  await fade([xbg],1,500);
  calc.innerHTML+=`<br>${fr(4,'<span class="x">x</span>')} + ${fr(1,3)}`;
  await wait(2500);if(!alive())return;
  say("Jetzt sind es x und 3. Genauso: x · 3 = 3x. In 3x passen x und 3.");
  const kerg2=T(430,226,"= 3x",{fill:"var(--hl)",op:0});
  await fade([kerg2],1,700);if(!alive())return;
  await wait(2500);if(!alive())return;

  say("Alles mal 3x – auch das 3x kommt in den Zähler.");
  const teile=()=>[{t:"3",fill:"var(--hl)"},{t:"x",fill:"var(--x)"},{t:"·"}];
  const [P3,P4]=await Promise.all([inZaehler(B1,teile()),inZaehler(B2,teile())]);if(!alive())return;
  calc.innerHTML+=` &nbsp;→&nbsp; ${fr('<span class="h">3x</span> · 4','<span class="x">x</span>')} + ${fr('<span class="h">3x</span> · 1',3)}`;
  await wait(2500);if(!alive())return;
  say("Kürzen: Das x oben und das x unten kürzen sich weg – x : x = 1, genau wie vorher die 2! Rechts kürzt sich die 3.");
  await kuerze(P3[1],B1.n,1,1);await kuerze(P4[0],B2.n,1,1);if(!alive())return;
  calc.innerHTML+=`<br>= 3 · 4 + x · 1 = 12 + x`;
  await wait(3500);if(!alive())return;

  // ---------- Teil 3: als Gleichung lösen ----------
  say("Jetzt als Gleichung: 4/x + 1/3 = 1. Jeder Teil wird mal 3x genommen – auch die 1 rechts.");
  const gl=T(515,80,"= 1",{op:0});await fade([gl],1,600);await wait(1200);
  gl.textContent="= 3x · 1";gl.setAttribute("x",545);
  calc.innerHTML=`${fr(4,'<span class="x">x</span>')} + ${fr(1,3)} = 1 &nbsp;&nbsp;<small>| · 3x</small><br>12 + x = 3x<br>12 = 2x &nbsp;→&nbsp; <span class="h">x = 6</span>`;
  await wait(3500);if(!alive())return;
  say("Achtung: x darf nicht 0 sein – sonst stünde 4/0 da, und durch 0 kann man nicht teilen.");
  await wait(2500);if(!alive())return;
  say("Probe mit x = 6: 4/6 + 1/3 = 2/3 + 1/3 = 1 ✓");
  calc.innerHTML+=`<br><small>Probe: ${fr(4,6)} + ${fr(1,3)} = ${fr(2,3)} + ${fr(1,3)} = 1 ✓</small>`;
  await wait(2500);if(!alive())return;
  merke.classList.add("an");
  baueCheck(checkGen);
}

/* ---------- Check: gemeinsamen Nenner mit x bilden (jedes Vielfache richtig, x nur einmal) ---------- */
function baueCheck(gen){
  const box=document.getElementById("check");box.classList.add("an");
  const t=gen();let versuch=0,fertig=false;
  box.innerHTML=`<h2>✎ Check: Jetzt du!</h2><div class="cq">${t.frage}</div>
    <div class="crow">Gemeinsamer Nenner: <input id="cin" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Gemeinsamer Nenner">
    <button class="btn" id="cpr" type="button">Prüfen ✓</button><button class="btn" id="cneu" type="button">🔁 Neue Aufgabe</button></div>
    <p style="color:var(--muted);margin:.4rem 0 0">Schreibe zum Beispiel 5x.</p><div id="cfb"></div>`;
  const inp=document.getElementById("cin"),fb=document.getElementById("cfb");
  const pr=()=>{if(fertig)return;const v=inp.value.trim();if(!v){fb.innerHTML='<div class="fb tipp">Bitte trage zuerst etwas ein.</div>';return;}
    const r=t.pruefe(v);
    if(r.ok){fertig=true;fb.innerHTML=`<div class="fb ok">✅ ${r.msg}</div>`;return;}
    if(r.fast){fb.innerHTML=`<div class="fb tipp">🤔 ${r.msg}</div>`;return;}
    versuch++;
    if(versuch===1)fb.innerHTML=`<div class="fb tipp">Noch nicht. 💡 ${t.tipp}</div>`;
    else{fertig=true;fb.innerHTML=`<div class="fb bad">Leider wieder falsch. So geht es: ${t.loesung}</div>`;}};
  document.getElementById("cpr").onclick=pr;inp.addEventListener("keydown",e=>{if(e.key==="Enter")pr();});
  document.getElementById("cneu").onclick=()=>baueCheck(gen);
}
// „4x“, „4·x“, „x4“, „4 * x“ → Zahl vor dem x; sonst null
const leseX=v=>{const s=v.toLowerCase().replace(/[\s·*×]/g,"");let m=s.match(/^(\d*)x$/)||s.match(/^x(\d+)$/);return m?(m[1]===""?1:+m[1]):null;};
const XX=v=>/x\s*(²|\^\s*2)|x\s*·?\s*x/i.test(v);
function checkGen(){
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const neu=(frage,H,tipp,loesung)=>({frage,
    pruefe:v=>{if(XX(v))return{fast:true,msg:"Nimm das x nur <b>einmal</b> – sonst entsteht x², und die Gleichung kannst du noch nicht lösen."};
      const k=leseX(v);if(k===H)return{ok:true,msg:`Richtig! In ${H}x passen beide Nenner.`};
      if(k&&k%H===0)return{ok:true,msg:`Richtig, ${v} klappt! Mit ${H}x wären die Zahlen noch etwas kleiner.`};return{ok:false};},
    tipp,loesung});
  if(Math.random()<.6){   // a/x + 1/b → b·x
    const b=[2,4,5,6,7][R(0,4)],a=R(1,9);
    return neu(`${fr(a,"x")} + ${fr(1,b)} = … &nbsp; Finde einen <b>gemeinsamen Nenner</b>.`,b,
      `In den Nenner müssen x und ${b} passen. Nimm beide einmal: x · ${b}.`,
      `Nenner x und ${b} → x · ${b} = <b>${b}x</b>.`);
  }
  // a/(2x) + 1/b mit b gerade: Zahlen 2 und b → b, dazu x einmal
  const b=[4,6][R(0,1)],a=R(1,9);
  return neu(`${fr(a,"2x")} + ${fr(1,b)} = … &nbsp; Finde einen <b>gemeinsamen Nenner</b>.`,b,
    `Erst die Zahlen: 2 und ${b}. Passt die 2 in die ${b}? Dann kommt das x einmal dazu.`,
    `Zahlen 2 und ${b}: ${b} : 2 = ${b/2} ✓ → ${b}. x einmal dazu → <b>${b}x</b>.`);
}

const bar=document.getElementById("bar");
const kn=(t,fn,cls="")=>{const x=document.createElement("button");x.className="btn "+cls;x.innerHTML=t;x.onclick=fn;bar.appendChild(x);return x;};
const k1=kn(`Aufgabe aus dem Skript: &nbsp;<span class="fr"><span>3</span><span>x</span></span> + <span class="fr"><span>1</span><span>2x</span></span> = <span class="fr"><span>7</span><span>4</span></span>`,()=>{PAUSE=false;pz.textContent="⏸ Pause";playTabelle();},"wahl");
kn("Warum genauso? Aus der 2 wird ein x",()=>{PAUSE=false;pz.textContent="⏸ Pause";play();},"wahl");
const pz=kn("⏸ Pause",()=>{PAUSE=!PAUSE;pz.textContent=PAUSE?"▶ Weiter":"⏸ Pause";});
kn("✎ Zum Check",()=>{baueCheck(checkGen);document.getElementById("check").scrollIntoView({behavior:"smooth"});});
playTabelle();
</script>
