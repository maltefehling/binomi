<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fahrplan II.4a Bruchgleichungen</title>
<style>
  :root{
    --blue:#bcd3f2; --green:#c6e8c0; --green-d:#3f8f3a; --orange:#fbd9a8; --orange-bg:#fdf6ea; --pro:#eef0f3;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;touch-action:manipulation}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0 12px 0 0}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:0;border-radius:10px;padding:10px 16px;background:rgba(255,255,255,.15);color:#fff;font-weight:600;font-size:16px;min-height:44px}
  .tab[aria-selected="true"]{background:#fff;color:var(--acc)}
  main{padding:14px 16px 28px;max-width:860px;margin:0 auto}
  .hint{background:var(--orange-bg);border:1px solid var(--orange);border-radius:12px;padding:10px 14px;font-size:17px;line-height:1.4;margin-bottom:14px}
  .task{font-size:19px;line-height:1.4;margin:0 0 12px}
  .task b{color:var(--acc)}
  .nb{white-space:nowrap}
  .step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 60px;position:relative;margin-bottom:10px}
  .step::before{content:attr(data-n);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;font-size:17px;font-weight:700;display:grid;place-items:center}
  .step.pro{background:var(--pro)}
  .step.pro::before{content:"★";}
  .step.done{border-color:var(--green-d);background:#f1f9ef}
  .zeige{font-size:20px;font-weight:700;margin-bottom:8px}
  .zeige span{color:var(--acc)}
  .words{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .words b{background:var(--blue);border-radius:8px;padding:4px 10px;font-size:18px;font-weight:600;white-space:nowrap}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .joker,.ok{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-size:16px;font-weight:600;min-height:44px}
  .ok[aria-pressed="true"]{background:var(--green);border-color:var(--green-d);color:var(--green-d)}
  .satz{display:none;font-size:19px;font-style:italic;background:var(--orange-bg);border:1px dashed var(--orange);border-radius:8px;padding:6px 10px;margin-top:8px}
  .satz.show{display:block}
  .msg{min-height:30px;font-size:20px;font-weight:700;color:var(--green-d);margin:12px 0 4px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 18px;font-size:17px;font-weight:600;min-height:44px}
  .foot{color:var(--muted);font-size:14px;margin-top:18px}
  .task svg{display:block;width:100%;max-width:240px;margin:10px auto 0}
</style>
</head>
<body>
<header>
  <h1>★★ Fahrplan · Bruchgleichungen aus Klasse 8</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-p="A">Partner A · 6/x + 1 = 4</button>
    <button class="tab" role="tab" aria-selected="false" data-p="B">Partner B · 10/x + 3 = 5</button>
  </div>
</header>
<main>
  <div class="hint">Erkläre Schritt für Schritt in <b>eigenen Sätzen</b>. Zeig dabei aufs Bild. Die blauen Wörter helfen dir. Wenn du hängst, tippe auf <b>Joker</b>. Hake jeden Schritt ab, den du erklärt hast.</div>
  <div id="plan"></div>
  <div class="msg" id="msg"></div>
  <button class="btn" id="reset">Von vorn</button>
  <p class="foot">Mathematik Klasse 9 · II.4a Bruchgleichungen · Hilfe zum Erklär-Tandem</p>
</main>
<script>
(function(){
  // Pro Set: Aufgabe und vier Schritte (Zeige … / Stichwörter / Joker-Satzanfang), dazu der Profi-Schritt
  var sets={"A": {"task": "Erkläre deinem Partner an <b class=\"nb\">6/x + 1 = 4</b>, wie du die Bruchgleichung Schritt für Schritt löst.<br><svg viewBox=\"0 0 260 90\" aria-label=\"Gleichung\"><text x=\"40\" y=\"38\" font-size=\"28\" text-anchor=\"middle\">6</text><line x1=\"18\" y1=\"48\" x2=\"62\" y2=\"48\" stroke=\"#1b2a3a\" stroke-width=\"2\"/><text x=\"40\" y=\"78\" font-size=\"28\" text-anchor=\"middle\">x</text><circle cx=\"40\" cy=\"69\" r=\"17\" fill=\"none\" stroke=\"#b33c3c\" stroke-width=\"2.5\"/><text x=\"74\" y=\"58\" font-size=\"28\">+ 1 = 4</text></svg>", "steps": [["auf den Nenner", ["x ≠ 0", "durch 0 teilen geht nicht"], "Im Nenner steht …"], ["auf den Hauptnenner", ["Hauptnenner x", "jeden Teil mal x"], "Ich nehme …"], ["auf jeden Teil", ["6/x · x = 6", "1 · x = x", "4 · x = 4x"], "Nach dem Malnehmen …"], ["auf das Lösen und die Probe", ["6 = 3x", "x = 2", "Probe 6 : 2 + 1 = 4"], "Jetzt löse ich …"]]}, "B": {"task": "Erkläre deinem Partner an <b class=\"nb\">10/x + 3 = 5</b>, wie du die Bruchgleichung Schritt für Schritt löst.<br><svg viewBox=\"0 0 260 90\" aria-label=\"Gleichung\"><text x=\"40\" y=\"38\" font-size=\"28\" text-anchor=\"middle\">10</text><line x1=\"18\" y1=\"48\" x2=\"62\" y2=\"48\" stroke=\"#1b2a3a\" stroke-width=\"2\"/><text x=\"40\" y=\"78\" font-size=\"28\" text-anchor=\"middle\">x</text><circle cx=\"40\" cy=\"69\" r=\"17\" fill=\"none\" stroke=\"#b33c3c\" stroke-width=\"2.5\"/><text x=\"74\" y=\"58\" font-size=\"28\">+ 3 = 5</text></svg>", "steps": [["auf den Nenner", ["x ≠ 0", "durch 0 teilen geht nicht"], "Im Nenner steht …"], ["auf den Hauptnenner", ["Hauptnenner x", "jeden Teil mal x"], "Ich nehme …"], ["auf jeden Teil", ["10/x · x = 10", "3 · x = 3x", "5 · x = 5x"], "Nach dem Malnehmen …"], ["auf das Lösen und die Probe", ["10 = 2x", "x = 5", "Probe 10 : 5 + 3 = 5"], "Jetzt löse ich …"]]}};
  var pro=["nach, warum auch die Zahl ohne Bruch mal x genommen wird", ["jeden Teil", "Waage", "Gleichgewicht"], "Bei einer Gleichung …"];
  var cur="A", plan=document.getElementById("plan"), msg=document.getElementById("msg");

  function card(n,s,isPro){
    var d=document.createElement("div"); d.className="step"+(isPro?" pro":""); d.setAttribute("data-n",n);
    d.innerHTML='<div class="zeige">'+(isPro?'★★★ Profi · Denk ':'👉 Zeige ')+'<span>'+s[0]+'</span></div>'+
      '<div class="words">'+s[1].map(function(w){return "<b>"+w+"</b>";}).join("")+'</div>'+
      '<div class="row"><button class="ok" aria-pressed="false">✓ erklärt</button><button class="joker">Joker: Satzanfang zeigen</button></div>'+
      '<div class="satz">'+s[2]+'</div>';
    d.querySelector(".joker").onclick=function(){d.querySelector(".satz").classList.add("show");this.disabled=true;};
    var ok=d.querySelector(".ok");
    ok.onclick=function(){var on=ok.getAttribute("aria-pressed")!=="true";ok.setAttribute("aria-pressed",on);d.classList.toggle("done",on);update();};
    return d;
  }
  function render(){
    plan.innerHTML='<p class="task">'+sets[cur].task+'</p>';
    sets[cur].steps.forEach(function(s,i){plan.appendChild(card(i+1,s,false));});
    plan.appendChild(card("★",pro,true));
    update();
  }
  function update(){
    var base=plan.querySelectorAll(".step:not(.pro)"), n=0;
    base.forEach(function(s){if(s.classList.contains("done"))n++;});
    msg.textContent=n===base.length?"Stark! Alles drin.":"";
  }
  document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){
    document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x===t);});
    cur=t.getAttribute("data-p"); render();
  };});
  document.getElementById("reset").onclick=render;
  render();
})();
</script>
</body>
</html>
