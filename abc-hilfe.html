<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>abc-Kontrolle</title>
<!-- II.3a Lösungsformel: Kontrolle nach der eigenen Rechnung. Eigene Gleichung ax² + bx + c = 0 eingeben,
     Schritte nacheinander aufdecken: einsetzen → unter der Wurzel → Wurzel → zwei Fälle → Lösungsmenge.
     Negative Zahl unter der Wurzel → keine Lösung, 0 → eine Lösung (Vorgriff II.3b). Farben wie die Lego-Steine. -->
<style>
  :root{--rotD:#b33c3c;--rotH:#f6d0d0;--grD:#3f8f3a;--grH:#d6efd0;--blD:#2e5d9f;--blH:#d3e3f6;
    --ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;--hilf:#fdf6ea;--hilfL:#fbd9a8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:#5b6b7c;color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 24px;max-width:820px;margin:0 auto}
  .hinweis{background:var(--hilf);border:1px solid var(--hilfL);border-radius:12px;padding:10px 14px;font-size:17px;line-height:1.45;margin-bottom:12px}
  .eingabe{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:24px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .eingabe input{width:84px;min-height:50px;font-size:22px;text-align:center;border-radius:10px;border:2px solid var(--line)}
  #a{border-color:var(--rotD);background:var(--rotH)} #b{border-color:var(--grD);background:var(--grH)} #c{border-color:var(--blD);background:var(--blH)}
  .knoepfe{display:flex;gap:10px;margin:12px 0}
  .knoepfe button{flex:1;min-height:54px;border-radius:12px;font-size:19px;font-weight:700;border:2px solid var(--acc);background:#fff;color:var(--acc)}
  .knoepfe button.haupt{background:#3f8f3a;border-color:#3f8f3a;color:#fff}
  .knoepfe button:disabled{opacity:.4}
  .schritt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .schritt .k{font-size:15px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
  .schritt .t{font-size:22px;line-height:1.5;overflow-x:auto;white-space:nowrap}
  .schritt.ende{background:#fff3c4;border-color:#e0b400}
  .fehler{color:#b03a2e;font-size:18px;font-weight:700;min-height:24px;margin-top:6px}
  .r{color:var(--rotD);font-weight:700}.g{color:var(--grD);font-weight:700}.bl{color:var(--blD);font-weight:700}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
</style>
</head>
<body>
<header><h1>abc-Kontrolle: erst nach deiner Rechnung</h1></header>
<main>
  <div class="hinweis"><b>Erst selbst rechnen, dann hier kontrollieren.</b> Gib a, b und c deiner Gleichung ein (Komma oder Punkt). Tippe dann auf „Nächster Schritt“.</div>
  <div class="eingabe"><input id="a" inputmode="decimal" value="2" aria-label="a"><span>x² +</span><input id="b" inputmode="decimal" value="12" aria-label="b"><span>x +</span><input id="c" inputmode="decimal" value="-270" aria-label="c"><span>= 0</span></div>
  <div class="fehler" id="err"></div>
  <div class="knoepfe"><button class="haupt" id="next">Nächster Schritt</button><button id="reset">Von vorn</button></div>
  <div id="out"></div>
</main>
<footer>Fehling · Lösungsformel (abc-Formel)</footer>
<script>
"use strict";
const $=id=>document.getElementById(id);
const num=s=>{s=String(s).trim().replace(",",".").replace("−","-");return s===""||isNaN(+s)?null:+s;};
const f=v=>{const r=Math.round(v*100)/100;return (Object.is(r,-0)?0:r).toString().replace(".",",").replace("-","−");};
const k=v=>v<0?"( "+f(v)+" )":f(v);          // negative Zahlen in Klammern
let schritt=0,S=[];
function plan(){
  const a=num($("a").value),b=num($("b").value),c=num($("c").value);
  if(a===null||b===null||c===null)return "Bitte bei a, b und c eine Zahl eingeben (fehlt ein Stein: 0).";
  if(a===0)return "a darf nicht 0 sein – sonst ist es keine quadratische Gleichung.";
  const D=b*b-4*a*c;
  S=[["Einsetzen",`a = <span class="r">${f(a)}</span>,  b = <span class="g">${f(b)}</span>,  c = <span class="bl">${f(c)}</span>`],
     ["Unter der Wurzel",`b² − 4ac = ${k(b)}² − 4 · ${k(a)} · ${k(c)} = ${f(b*b)} ${4*a*c<=0?"+ "+f(-4*a*c):"− "+f(4*a*c)} = <b>${f(D)}</b>`]];
  if(D<0){S.push(["Wurzel",`√${k(D)} geht nicht – unter der Wurzel steht eine negative Zahl.`]);S.push(["Lösungsmenge","Keine Lösung:  L = { }",1]);}
  else{
    const w=Math.sqrt(D),exakt=Number.isInteger(w)||Math.abs(w*100-Math.round(w*100))<1e-9;
    const eq=v=>Math.abs(v*100-Math.round(v*100))<1e-9?"=":"≈";     // z. B. 1/3 → ≈ 0,33
    const g=v=>exakt&&eq(v)==="="?f(v):(Math.round(v*100)/100).toFixed(2).replace(".",",").replace("-","−");   // gerundet immer zwei Stellen
    S.push(["Wurzel",`√${f(D)} ${exakt?"=":"≈"} <b>${g(w)}</b>`]);
    const n=2*a,x1=(-b+w)/n,x2=(-b-w)/n;
    if(D===0){S.push(["Nur ein Fall",`x = ( ${f(-b)} ± 0 ) : ${k(n)} = <b>${f(x1)}</b>   (+ 0 und − 0 ergeben dasselbe)`]);S.push(["Lösungsmenge",`L = { ${f(x1)} }   – genau eine Lösung`,1]);}
    else{
      S.push(["Zwei Fälle",`x = ( ${f(-b)} + ${g(w)} ) : ${k(n)} ${eq(x1)} <b>${g(x1)}</b><br>x = ( ${f(-b)} − ${g(w)} ) : ${k(n)} ${eq(x2)} <b>${g(x2)}</b>`]);
      const [l,h]=[x1,x2].sort((p,q)=>p-q);S.push(["Lösungsmenge",`L = { ${g(l)} ; ${g(h)} }${eq(l)+eq(h)==="=="?"":"   (gerundet)"}`,1]);
    }
  }
  return "";
}
function zeigen(){
  $("out").innerHTML=S.slice(0,schritt).map(([kopf,t,ende])=>`<div class="schritt${ende?" ende":""}"><div class="k">${kopf}</div><div class="t">${t}</div></div>`).join("");
  $("next").disabled=schritt>0&&schritt>=S.length;
}
$("next").onclick=()=>{if(schritt===0){const e=plan();$("err").textContent=e;if(e)return;}schritt++;zeigen();};
$("reset").onclick=()=>{schritt=0;$("err").textContent="";zeigen();};
["a","b","c"].forEach(id=>$(id).addEventListener("input",()=>{schritt=0;$("err").textContent="";zeigen();}));
zeigen();
</script>
</body>
</html>
