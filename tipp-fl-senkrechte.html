<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tipp: Senkrechte mit dem Geodreieck</title>
<!-- Kapitel II Umfang und Flächeninhalt (Kl. 8): lila Tipp-Seite, gebaut mit tipp_fl_bau.py. Anderes Beispiel, nie die Lösung einer Aufgabe. -->
<style>
  :root{--tipp:#6d4a9e;--tippH:#f1eaf8;--tippL:#b79bd6;--ink:#1b2a3a;--muted:#5b6b7c;--bg:#f7f4fb;--line:#d8cce8;--a:#2e5d9f;--hl:#c0700f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--tipp);color:#fff} header h1{font-size:20px;margin:0}
  main{padding:12px 16px 24px;max-width:860px;margin:0 auto}
  .start{font-size:19px;color:var(--tipp);font-weight:700;margin:4px 0 10px}
  .knoepfe{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .knoepfe button{flex:1 1 150px;min-height:52px;border-radius:12px;font-size:18px;font-weight:700;border:2px solid var(--tipp);background:#fff;color:var(--tipp)}
  .knoepfe button.haupt{background:var(--tipp);color:#fff}
  .bild{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:10px}
  .bild svg{width:100%;height:auto;display:block}
  .cap{background:#fff;border:2px solid var(--tippL);border-radius:12px;padding:10px 14px;font-size:21px;line-height:1.45;min-height:64px;margin-bottom:10px}
  .tafel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px;min-height:40px}
  .z{font-size:27px;line-height:1.6;opacity:0;transition:opacity .6s;font-variant-numeric:tabular-nums}
  .z.da{opacity:1} .z.neu{color:var(--tipp)}
  .hl{color:var(--hl);font-weight:800}
  .du{display:none;margin-top:14px;background:var(--tippH);border:1px solid var(--tippL);border-radius:12px;padding:10px 14px;font-size:19px;line-height:1.45}
  .du.da{display:block}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
  .geo,.sichtbar{transition:transform 1.4s ease, opacity .8s}
</style>
</head>
<body>
<header><h1>Tipp: Senkrechte mit dem Geodreieck</h1></header>
<main>
  <div class="start">Beispiel mit anderer Lage: Senkrechte zu h durch den Punkt Q</div>
  <div class="knoepfe"><button class="haupt" id="play">▶ Abspielen</button><button id="pause">⏸ Pause</button></div>
  <div class="bild"><svg viewBox="0 0 620 340" aria-label="Senkrechte mit dem Geodreieck">
 <line x1="30" y1="90" x2="590" y2="210" stroke="#1b2a3a" stroke-width="3"/><text x="575" y="238" font-size="24">h</text>
 <circle cx="260" cy="300" r="5" fill="#1b2a3a"/><text x="236" y="322" font-size="24" font-weight="700">Q</text>
 <g id="geo" class="geo" style="opacity:0">
  <g transform="translate(292.9,146.3) rotate(12.09)">
   <polygon points="0,-150 0,150 150,0" fill="rgba(160,200,235,.45)" stroke="#2e5d9f" stroke-width="2.5"/>
   <line x1="0" y1="0" x2="150" y2="0" stroke="#c0700f" stroke-width="3" stroke-dasharray="8 6"/>
   <circle cx="0" cy="0" r="3.5" fill="#c0700f"/>
  </g>
 </g>
 <line id="senk" x1="260" y1="300" x2="292.9" y2="146.3" stroke="#6d4a9e" stroke-width="4" stroke-dasharray="160" stroke-dashoffset="160" style="transition:stroke-dashoffset 1.6s"/>
 <g id="winkel" class="sichtbar" style="opacity:0"><path d="M 289.55 161.96 A 16 16 0 0 0 308.54 149.65" fill="none" stroke="#6d4a9e" stroke-width="2.5"/><circle cx="297.2" cy="153.0" r="2.6" fill="#6d4a9e"/></g>
 <g id="mess" class="sichtbar" style="opacity:0"><text x="60" y="240" font-size="20" fill="#6d4a9e" font-weight="700">Abstand von Q zu h</text></g>
</svg></div>
  <div class="cap" id="cap"></div>
  <div class="tafel">
    <div class="z">&nbsp;</div>
    <div class="z">&nbsp;</div>
    <div class="z">&nbsp;</div>
    <div class="z">&nbsp;</div>
    <div class="z">&nbsp;</div>
  </div>
  <div class="du" id="du"><b>Jetzt du:</b> Zeichne deine Senkrechte genauso: Mittellinie auf die Gerade, lange Kante durch den Punkt.</div>
</main>
<footer>Fehling · Rechteck und Quadrat · Tipp</footer>
<script>

function bildZustand(k){const geo=document.getElementById("geo"),s=document.getElementById("senk");
 geo.style.opacity=(k>=1&&k<=3)?1:0;
 geo.style.transform=k<=1?"translate(88px,18.9px)":"translate(0px,0px)";
 s.style.strokeDashoffset=k>=3?0:160;
 document.getElementById("winkel").style.opacity=k>=4?1:0;document.getElementById("mess").style.opacity=k>=4?1:0;}


"use strict";
const S=[["", "Lege das Geodreieck so auf h, dass die Mittellinie (gestrichelt) genau auf h liegt.", true], ["", "Schiebe es an h entlang, bis die lange Kante durch den Punkt Q geht. Die Mittellinie bleibt dabei auf h.", true], ["", "Zeichne an der langen Kante von Q bis zur Geraden h.", true], ["", "Die neue Linie steht senkrecht auf h: Es entsteht ein rechter Winkel.", true], ["", "Der Abstand von Q zu h ist die Länge dieser Linie. Miss sie mit dem Lineal.", false]];
const cap=document.getElementById("cap"),du=document.getElementById("du"),Z=[...document.querySelectorAll(".z")],pb=document.getElementById("pause");
let n=0,timer=null,steht=false;
const lese=t=>1500+80*t.length;            // Lesezeit nach Textlänge (Regel 16.10.2026)
function zustand(k){if(typeof bildZustand==="function")bildZustand(k);}
function zeig(){
  const s=S[n-1];cap.textContent=s?s[1]:"Tippe auf ▶ Abspielen.";
  Z.forEach((z,i)=>{z.classList.toggle("da",i<n&&S[i][0]!=="");z.classList.toggle("neu",i===n-1);});
  zustand(n);du.classList.toggle("da",n>=S.length);
}
function weiter(){if(steht)return;if(n<S.length){n++;zeig();timer=setTimeout(weiter,lese(S[n-1][1])+(S[n-1][2]?1400:0));}else pb.disabled=true;}
function start(){clearTimeout(timer);steht=false;pb.disabled=false;pb.textContent="⏸ Pause";n=0;zeig();timer=setTimeout(weiter,500);}
document.getElementById("play").onclick=start;
pb.onclick=()=>{steht=!steht;pb.textContent=steht?"▶ Weiter":"⏸ Pause";clearTimeout(timer);if(!steht)weiter();};
zeig();

</script>
</body>
</html>
