<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Geht es auch kleiner?</title>
<!-- I.6 Bruchgleichungen: Hauptnenner durch Zerlegen. Jeder Nenner zerfällt in kleinste Malaufgaben, die Bausteine wandern
     in den Hauptnenner-Korb; was schon im Korb liegt, wird nicht noch einmal genommen. Gleiches Bild wie das Zerlegen in I.1b.
     MODUS=beispiele: drei feste Beispiele · MODUS=eingabe: eigene Nenner (Hilfe zur Übung). -->
<style>
  :root{--korb:#fdf6ea;--korbL:#fbd9a8;--hl:#c0700f;--hlbg:#fde7c8;--n1:#2e5d9f;--n2:#3f8f3a;--n3:#7b4fa0;
    --ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;min-height:46px}
  .btn[aria-pressed="true"],.btn.voll{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 520px;max-width:640px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 280px}
  .cap{min-height:96px;font-size:21px;font-weight:600;color:var(--acc);line-height:1.4;margin:4px 0 12px}
  .calc{font-size:24px;line-height:1.7;min-height:60px}
  .calc .h{color:var(--hl);font-weight:800}
  .calc small{font-size:18px;color:var(--muted)}
  .eing{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .nen{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .nen b{font-size:16px;min-width:74px}
  .nen input{width:64px;height:44px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:10px}
  .chip{min-width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;color:var(--ink);padding:0 10px}
  .chip[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
  .prompt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.45;margin-bottom:12px}
  .check{display:none;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;max-width:1068px}
  .check.an{display:block}
  .check h2{margin:.2rem 0 .4rem;font-size:21px;color:var(--acc)}
  .check .cq{font-size:21px;line-height:1.5;margin-bottom:8px}
  .check .crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:24px;font-weight:700}
  .check input{width:4.2em;height:48px;font-size:24px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:10px}
  .check input:focus{outline:none;border-color:var(--acc)}
  .check .fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:18px;line-height:1.45}
  .fb.ok{background:#e4f4e2;color:#24622a}.fb.tipp{background:#fff4e0;color:#7a4a08}.fb.bad{background:#fde8e6;color:#9b2c1f}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Geht es auch kleiner?</h1></header>
<main>
  <div class="bar" id="bar"></div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 600 400" aria-label="Nenner werden zerlegt, die Bausteine wandern in den Hauptnenner-Korb"></svg>
    <div class="side"><div class="cap" id="cap"></div><div class="calc" id="calc"></div></div>
  </div>
  <section class="check" id="check"></section>
</main>
<footer>Fehling · Bruchgleichungen</footer>
<script>
"use strict";
// Lesetempo (16.10.2026, Rückmeldung einer Schülerin: „Die Schrift verschwindet zu schnell“):
// Jeder neue Erklärsatz bleibt mindestens so lange stehen, wie man zum Lesen braucht; währenddessen wartet auch das Bild.
// Dazu ein Knopf „⏸ Pause / ▶ Weiter“ neben dem Abspielen-Knopf.
let LESE_BIS=0,PAUSE=false;
const lesezeit=t=>1500+t.length*80;
(()=>{const c=document.getElementById("cap");
  if(c)new MutationObserver(()=>{LESE_BIS=performance.now()+lesezeit(c.textContent||"");}).observe(c,{childList:true,characterData:true,subtree:true});
  // Pause-Knopf ans Ende der Knopfleiste (bzw. hinter den Abspielen-Knopf)
  setTimeout(()=>{   // erst nach dem Aufbau der Seite: manche Knopfleisten entstehen per Skript
  const g=document.getElementById("go")||document.querySelector("main button");if(!g)return;
  const leiste=g.closest(".bar")||g.parentElement;
  const p=document.createElement("button");p.className=g.className;p.type="button";p.textContent="⏸ Pause";p.style.marginLeft="10px";
  p.removeAttribute("aria-pressed");p.onclick=()=>{PAUSE=!PAUSE;p.textContent=PAUSE?"▶ Weiter":"⏸ Pause";};leiste.appendChild(p);},0);})();

const MODUS="beispiele";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s"),cap=document.getElementById("cap"),calc=document.getElementById("calc");
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const SLOW=1.4;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const tween=(ms,f)=>new Promise(r=>{ms*=SLOW;const t0=performance.now();const s=t=>{const k=Math.min(1,(t-t0)/ms);f(ease(k));k<1?requestAnimationFrame(s):r();};requestAnimationFrame(s);});
const wait=ms=>new Promise(r=>{const ende=performance.now()+ms*SLOW;const t=()=>{if(!PAUSE&&performance.now()>=Math.max(ende,LESE_BIS))r();else setTimeout(t,100);};t();});
let run=0;
// ---------- Bausteine: Nenner = {c: Zahl, x: Exponent} ----------
const primes=n=>{const f=[];for(let d=2;n>1;d++)while(n%d===0){f.push(String(d));n/=d;}return f;};
const zerlege=t=>{const f=primes(t.c);for(let i=0;i<t.x;i++)f.push("x");return f.length?f:["1"];};
const name=t=>(t.c===1&&t.x?"":String(t.c))+(t.x?"x"+(t.x>1?"²":""):"");
function prod(l){let n=1,x=0;l.forEach(s=>{if(s==="x")x++;else if(s!=="1")n*=+s;});return (n===1&&x?"":String(n))+(x?"x"+(x>1?"²":""):"");}
const COL=["var(--n1)","var(--n2)","var(--n3)"];
const txt=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":o.size||26,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:o.op??1});e.textContent=t;return e;};
const fade=(els,to,ms=400)=>{const f=els.map(e=>+(e.getAttribute("opacity")??1));return tween(ms,k=>els.forEach((e,i)=>e.setAttribute("opacity",f[i]+(to-f[i])*k)));};
const move=(e,x1,y1,ms=800)=>{const x0=+e.getAttribute("x"),y0=+e.getAttribute("y");return tween(ms,k=>{e.setAttribute("x",x0+(x1-x0)*k);e.setAttribute("y",y0+(y1-y0)*k);});};
const reihe=(cx,n)=>{const w=44;return [...Array(n)].map((_,i)=>cx+(i-(n-1)/2)*w);};

async function play(N){
  const my=++run;const alive=()=>my===run;const say=t=>{if(alive())cap.textContent=t;};
  svg.innerHTML="";calc.innerHTML="";
  const n=N.length,xs=N.map((_,i)=>600*(i+1)/(n+1));
  // Korb
  el("rect",{x:60,y:270,width:480,height:100,rx:18,fill:"var(--korb)",stroke:"var(--korbL)","stroke-width":3});
  txt(300,292,"Hauptnenner-Korb",{size:17,fill:"var(--muted)",w:600});
  const karten=N.map((t,i)=>{el("rect",{x:xs[i]-46,y:30,width:92,height:56,rx:10,fill:"#fff",stroke:COL[i],"stroke-width":3});return txt(xs[i],58,name(t),{fill:COL[i],size:30});});
  say(N.length===2&&!N[0].x&&!N[1].x?`Die Nenner sind ${name(N[0])} und ${name(N[1])}. ${name(N[0])} · ${name(N[1])} = ${N[0].c*N[1].c} klappt immer – aber geht es kleiner?`:`Die Nenner sind ${N.map(name).join(" und ")}. Welche Zahl reicht für alle?`);
  await wait(2200);if(!alive())return;
  // 1. zerlegen
  say("Zuerst zerlegen wir jeden Nenner in kleinste Malaufgaben – wie beim Ausklammern.");
  const F=N.map(zerlege);
  const chips=F.map((f,i)=>{const p=reihe(xs[i],f.length);return f.map((s,k)=>txt(p[k],150,s,{op:0,fill:COL[i]}));});
  const dots=F.map((f,i)=>{const p=reihe(xs[i],f.length);return p.slice(1).map((x,k)=>txt((p[k]+x)/2,150,"·",{op:0,size:22}));});
  await fade([...chips.flat(),...dots.flat()],1,600);if(!alive())return;
  calc.innerHTML=N.map((t,i)=>`${name(t)} = ${F[i].join(" · ")}`).join("<br>");
  await wait(2200);if(!alive())return;
  await fade(dots.flat(),0,300);
  // 2. sammeln
  const korb=[];const korbEls=[];
  const korbPos=()=>reihe(300,korb.length);
  const neuOrdnen=async()=>{const p=korbPos();await Promise.all(korbEls.map((e,k)=>move(e,p[k],330,400)));};
  for(let i=0;i<n;i++){
    const rest=[...korb];
    say(i===0?`Alle Bausteine von ${name(N[0])} kommen in den Korb.`:`Jetzt ${name(N[i])}: Was schon im Korb liegt, brauchen wir nicht noch einmal.`);
    for(let k=0;k<F[i].length;k++){
      const s=F[i][k],e=chips[i][k];
      const j=rest.indexOf(s);
      if(i>0&&j>=0){
        rest.splice(j,1);
        e.setAttribute("fill","var(--hl)");const bb=e.getBBox();
        const r=el("rect",{x:bb.x-6,y:bb.y-3,width:bb.width+12,height:bb.height+6,rx:8,fill:"var(--hlbg)",stroke:"var(--hl)","stroke-width":2});svg.insertBefore(r,e);
        await wait(700);if(!alive())return;
        await fade([e,r],0.15,500);
      }else{
        korb.push(s);korbEls.push(e);
        const p=korbPos();await move(e,p[p.length-1],330,700);await neuOrdnen();if(!alive())return;
      }
    }
    await wait(900);if(!alive())return;
  }
  // 3. Ergebnis
  const p=korbPos();const kd=p.slice(1).map((x,k)=>txt((p[k]+x)/2,330,"·",{op:0,size:22}));await fade(kd,1,300);
  const hn=prod(korb),alle=prod(F.flat());
  const sortiert=[...korb].sort((a,b)=>(a==="x")-(b==="x")||a-b);calc.innerHTML=`Hauptnenner: ${sortiert.join(" · ")} = <span class="h">${hn}</span>`+(alle!==hn?`<br><small>Alle Nenner mal: ${N.map(name).join(" · ")} = ${alle} – das geht auch, ist aber größer als nötig.</small>`:"");
  say("Im Korb liegt der Hauptnenner: Er passt zu allen Nennern – und ist so klein wie möglich.");
  await wait(2500);if(!alive())return;
  baueCheck(checkGen);
}
/* ---------- Kleiner Check am Ende (Malte 2.11.2026) ----------
   gen() liefert {frage, pruefe(eingabe) → {ok, fast, msg}, tipp, loesung, einheit}. 1. Fehler → Tipp, 2. Fehler → Lösung. */
function baueCheck(gen){
  const box=document.getElementById("check");box.classList.add("an");
  const t=gen();let versuch=0,fertig=false;
  box.innerHTML=`<h2>✎ Check: Jetzt du!</h2><div class="cq">${t.frage}</div>
    <div class="crow"><input id="cin" inputmode="${t.text?"text":"numeric"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Antwort">${t.einheit||""}
    <button class="btn" id="cpr" type="button">Prüfen ✓</button><button class="btn" id="cneu" type="button">🔁 Neue Aufgabe</button></div><div id="cfb"></div>`;
  const inp=document.getElementById("cin"),fb=document.getElementById("cfb");
  const pr=()=>{if(fertig)return;const v=inp.value.trim();if(!v){fb.innerHTML='<div class="fb tipp">Bitte trage zuerst etwas ein.</div>';return;}
    const r=t.pruefe(v);
    if(r.ok){fertig=true;fb.innerHTML=`<div class="fb ok">✅ ${r.msg||"Richtig!"}</div>`;return;}
    if(r.fast){fb.innerHTML=`<div class="fb tipp">🤔 ${r.msg}</div>`;return;}
    versuch++;
    if(versuch===1)fb.innerHTML=`<div class="fb tipp">Noch nicht. 💡 ${t.tipp}</div>`;
    else{fertig=true;fb.innerHTML=`<div class="fb bad">Leider wieder falsch. So geht es: ${t.loesung}</div>`;}};
  document.getElementById("cpr").onclick=pr;inp.addEventListener("keydown",e=>{if(e.key==="Enter")pr();});
  document.getElementById("cneu").onclick=()=>baueCheck(gen);
}

// Check: zwei Zahl-Nenner MIT gemeinsamem Baustein (andere als die Beispiele)
const kgV=(a,b)=>{const g=(x,y)=>y?g(y,x%y):x;return a*b/g(a,b);};
function checkGen(){
  const [a,b]=[[4,10],[6,9],[6,10],[8,12],[6,15],[10,15],[9,12],[6,8]][Math.floor(Math.random()*8)],H=kgV(a,b);
  const fa=primes(a).join(" · "),fb=primes(b).join(" · ");
  return {frage:`Die Nenner sind <b>${a}</b> und <b>${b}</b>. Bilde den <b>Hauptnenner</b> – die kleinste Zahl, mit der beide Brüche verschwinden.`,
    pruefe:v=>{const n=+v.replace(",",".");if(!Number.isInteger(n)||n<=0)return{ok:false};
      if(n===H)return{ok:true,msg:`Richtig! ${a} = ${fa}, ${b} = ${fb} – was doppelt ist, nur einmal: Hauptnenner ${H}.`};
      if(n%a===0&&n%b===0)return{fast:true,msg:`${n} klappt auch – aber geht es kleiner? Zerlege ${a} und ${b}: Welcher Baustein steckt in beiden?`};
      return{ok:false};},
    tipp:`Zerlege beide Nenner: ${a} = ${fa} und ${b} = ${fb}. Sammle alle Bausteine – was in beiden steckt, nur einmal.`,
    loesung:`${a} = ${fa}, ${b} = ${fb}. Hauptnenner: <b>${H}</b> (${H} : ${a} = ${H/a}, ${H} : ${b} = ${H/b}).`};
}
const BSP=[[{c:4,x:0},{c:6,x:0}],[{c:2,x:1},{c:3,x:0}],[{c:4,x:1},{c:6,x:1}]];
const bar=document.getElementById("bar");
BSP.forEach((b,i)=>{const x=document.createElement("button");x.className="btn";x.textContent="Beispiel "+(i+1)+":  "+b.map(name).join(" und ");
  x.onclick=()=>{bar.querySelectorAll(".btn").forEach(y=>y.setAttribute("aria-pressed",y===x));document.getElementById("check").classList.remove("an");play(b);};bar.appendChild(x);});
const zc=document.createElement("button");zc.className="btn";zc.textContent="✎ Zum Check";zc.onclick=()=>{baueCheck(checkGen);document.getElementById("check").scrollIntoView({behavior:"smooth"});};bar.appendChild(zc);
bar.firstChild.setAttribute("aria-pressed","true");play(BSP[0]);
</script>
</body>
</html>
