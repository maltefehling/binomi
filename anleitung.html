<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>So geht's: Legen</title>
<style>
  :root{
    --blue:#bcd3f2; --green:#c6e8c0; --orange:#fbd9a8;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5; --red:#d64545;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1240px;margin:0 auto}
  .note{font-size:17px;color:var(--muted);margin:0 0 10px}
  svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .cap{min-height:64px;font-size:22px;font-weight:600;color:var(--acc);margin:12px 0 6px;line-height:1.35}
  .btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:10px 18px;font-size:17px;font-weight:600;min-height:44px}
  .gap{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
</style>
</head>
<body>
<header><h1>So geht's: Legen</h1></header>
<main>
  <p class="note">Beispiel mit anderen Zahlen (3 cm und 1 cm) – nicht euer Set!</p>
  <svg id="s" viewBox="0 0 1000 560" aria-label="Animation: So legt ihr die Teile"></svg>
  <div class="cap" id="cap"></div>
  <button class="btn" id="again">Nochmal abspielen</button>
</main>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s"),cap=document.getElementById("cap");
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
const U=90;                    // 1 cm = 90 px
const FX=110,FY=100;           // Ecke, in der das große Quadrat landet
const tween=(ms,f)=>new Promise(r=>{const t0=performance.now();const s=t=>{const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;f(e);k<1?requestAnimationFrame(s):r();};requestAnimationFrame(s);});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let run=0;

function piece(x,y,w,h,fill,lw,lh,mid){
  const g=el("g",{opacity:0});
  el("rect",{x:0,y:0,width:w*U,height:h*U,fill,stroke:"#1b2a3a","stroke-width":2},g);
  if(lw&&w*U>=80)el("text",{x:w*U/2,y:h*U-10,"text-anchor":"middle","font-size":22,fill:"#1b2a3a"},g).textContent=lw;
  if(lh&&h*U>=80){const t=el("text",{x:22,y:h*U/2,"text-anchor":"middle","font-size":22,fill:"#1b2a3a",transform:`rotate(-90 22 ${h*U/2})`},g);t.textContent=lh;}
  if(mid)el("text",{x:w*U/2,y:h*U/2,"text-anchor":"middle","dominant-baseline":"central","font-size":w*U>=150?30:22,fill:"#1b2a3a"},g).textContent=mid;
  const p={g,x,y};p.move=(nx,ny)=>{p.x=nx;p.y=ny;g.setAttribute("transform",`translate(${nx} ${ny})`);};p.move(x,y);return p;
}
async function glide(p,tx,ty,ms=1100){const x0=p.x,y0=p.y;await tween(ms,k=>p.move(x0+(tx-x0)*k,y0+(ty-y0)*k));}
const fade=(p,ms=450)=>tween(ms,k=>p.g.setAttribute("opacity",k));

// Herleitung wie in Station ①: ein Stück der Seite wandert heraus und klappt sich zum Quadrat auf
async function herleiten(my,sx,len,hx,hy,col,fill,text,labelPos){
  const ln=el("line",{x1:sx,y1:FY,x2:sx+len,y2:FY,stroke:col,"stroke-width":12,"stroke-linecap":"round","stroke-opacity":0});
  await tween(600,k=>ln.setAttribute("stroke-opacity",k)); await wait(500); if(my!==run)return [];
  await tween(900,k=>{const x=sx+(hx-sx)*k,y=FY+(hy-FY)*k;ln.setAttribute("x1",x);ln.setAttribute("x2",x+len);ln.setAttribute("y1",y);ln.setAttribute("y2",y);});
  const rc=el("rect",{x:hx,y:hy,width:len,height:0,fill,stroke:"#1b2a3a","stroke-width":2});svg.appendChild(ln);
  await tween(1000,k=>rc.setAttribute("height",len*k));
  const [tx,ty,anchor]=labelPos;
  const t=el("text",{x:tx,y:ty,"text-anchor":anchor,"dominant-baseline":"central","font-size":30,fill:"#1b2a3a"});t.textContent=text;
  await wait(1200);
  return [ln,rc,t];
}

async function play(){
  const my=++run; svg.innerHTML="";
  const say=t=>{if(my===run)cap.textContent=t;};
  el("text",{x:FX,y:46,"font-size":22,fill:"#5b6b7c"}).textContent="Euer Tisch";
  el("text",{x:560,y:40,"font-size":22,fill:"#5b6b7c"}).textContent="Die Teile aus dem Umschlag";

  // Ziel: ein Quadrat mit der Seite 3 + 1
  const frame=el("rect",{x:FX,y:FY,width:4*U,height:4*U,fill:"none",stroke:"#1b2a3a","stroke-width":3,"stroke-dasharray":"10 7",opacity:0});
  const lab=(x,y,t,rot)=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":26,fill:"#1b2a3a",opacity:0});e.textContent=t;if(rot)e.setAttribute("transform",`rotate(-90 ${x} ${y})`);return e;};
  const deko=[frame,
    lab(FX+1.5*U,FY-22,"3"),lab(FX+3*U,FY-22,"+"),lab(FX+3.5*U+6,FY-22,"1"),
    lab(FX-26,FY+1.5*U,"3",true),lab(FX-26,FY+3*U,"+"),lab(FX-26,FY+3.5*U+6,"1",true),
    el("line",{x1:FX+3*U,y1:FY-6,x2:FX+3*U,y2:FY+14,stroke:"#1b2a3a","stroke-width":3,opacity:0}),
    el("line",{x1:FX-8,y1:FY+3*U,x2:FX+14,y2:FY+3*U,stroke:"#1b2a3a","stroke-width":3,opacity:0})];
  say("Ihr legt ein Quadrat. Im Beispiel hat seine Seite die Länge 3 + 1.");
  await tween(700,k=>deko.forEach(e=>e.setAttribute("opacity",k))); await wait(1500); if(my!==run)return;

  // großes Quadrat aus dem Stück 3
  say("Das Stück 3 …");
  const tmp1=await herleiten(my,FX,3*U,560,60,"#3d6fb6","#bcd3f2","3 · 3 = 3²",[560+1.5*U,60+1.5*U,"middle"]);
  if(my!==run)return;
  say("… mal sich selbst: 3 · 3 = 3². Das ist das große Quadrat.");
  await wait(1400); if(my!==run)return;
  const big=piece(560,60,3,3,"#bcd3f2","3 cm","3 cm","3²");big.g.setAttribute("opacity",1);tmp1.forEach(e=>e.remove());

  // kleines Quadrat aus dem Stück 1
  say("Das Stück 1 …");
  const tmp2=await herleiten(my,FX+3*U,U,880,60,"#c77a12","#fbd9a8","1 · 1 = 1²",[880+U/2,60+U+28,"middle"]);
  if(my!==run)return;
  say("… mal sich selbst: 1 · 1 = 1². Das ist das kleine Quadrat.");
  await wait(1400); if(my!==run)return;
  const small=piece(880,60,1,1,"#fbd9a8","","","1²");small.g.setAttribute("opacity",1);tmp2.forEach(e=>e.remove());

  // Rechtecke
  say("Dazu liegen im Umschlag zwei Rechtecke.");
  const r1=piece(560,370,3,1,"#c6e8c0","3 cm","1");
  const r2=piece(880,190,1,3,"#c6e8c0","1","3 cm");
  await fade(r1);await fade(r2);await wait(1400); if(my!==run)return;

  say("1. Legt das große Quadrat in eine Ecke.");
  await glide(big,FX,FY); await wait(800); if(my!==run)return;
  say("2. Das kleine Quadrat kommt in die gegenüberliegende Ecke.");
  await glide(small,FX+3*U,FY+3*U); await wait(800); if(my!==run)return;

  // nur Fragezeichen in den Lücken – die Form der fehlenden Teile verrät die Animation nicht
  const q1=el("text",{x:FX+3.5*U,y:FY+1.5*U+14,"text-anchor":"middle","font-size":46,"font-weight":700,fill:"#d64545",class:"gap"});q1.textContent="?";
  const q2=el("text",{x:FX+1.5*U,y:FY+3.5*U+16,"text-anchor":"middle","font-size":46,"font-weight":700,fill:"#d64545",class:"gap"});q2.textContent="?";
  svg.appendChild(big.g);svg.appendChild(small.g);
  say("Wie füllt ihr die Lücken? Legt, messt und rechnet – Aufgaben 1 bis 5 im Skript. Jetzt ihr!");
}
document.getElementById("again").onclick=play;
play();
</script>
</body>
</html>
