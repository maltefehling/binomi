<style>

  .aufg li .schritt{display:block;font-size:.9em;color:var(--muted)}

  .wegbtn{border:1px solid var(--merkL);background:var(--merk);color:var(--acc);border-radius:10px;padding:6px 14px;font-size:17px;font-weight:700;min-height:42px;margin-top:8px}

  .weg .wz i{font-style:normal;color:var(--muted);font-size:17px;margin-left:14px}
  .lwahl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px} .lwahl button{min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid #c9d6e5;background:#fff;font-size:17px;font-weight:700;color:inherit} .lwahl button[aria-pressed="true"]{border-color:#1b2a3a;background:#fff4dc}
</style>

<body>
<header><h1>Übung Kapitel I.2 · Summen multiplizieren</h1></header>
<main>
  <div class="hinweis">✎ <b>Rechne alle Aufgaben in deinem Heft.</b> Schreibe die Nummer der Aufgabe dazu. Wenn du nicht weiterkommst, hilft dir der Tipp. Die Lösungen findest du am Ende jeder Stufe.</div>
  <div id="teilwahl" hidden><div class="frage">Welche Stunde hattet ihr zuletzt?</div><div class="wahl" id="tw"></div></div>

</main>
<script>
"use strict";
// Versionsprüfung (12.10.2026): Safari zeigt sonst bis zu 10 Minuten (oft länger) eine alte, gespeicherte Fassung.
// Beim Öffnen wird die Seite ohne Zwischenspeicher abgefragt; ist sie neuer, lädt sie sich einmal neu.
const STAND="20261023094058";
fetch(location.pathname+"?nocache="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{
  const m=t.match(/const STAND="(\d+)"/);
  if(m&&m[1]!==STAND&&!sessionStorage.getItem("neu"+m[1])){sessionStorage.setItem("neu"+m[1],"1");location.replace(location.pathname+"?v="+m[1]);}
}).catch(()=>{});
// D.teile: ein Teil pro Stunde eines aufgeteilten Buchkapitels (z. B. II.2a/b/c); Stundenauswahl nur bei aufgeteilten Kapiteln (D.mehrteilig).
const D={"untertitel": ["Mit Hilfe zum Einstieg", "Ohne Hilfe, auch mit Minus", "Mehrere Werkzeuge, mehr Nachdenken"], "mehrteilig": false, "teile": [{"name": "", "stunde": "", "kurz": "", "erinnerung": ["(a + b) · (c + d) = ac + ad + bc + bd – jeder Teil der ersten Klammer mal jeder Teil der zweiten.", "Im Flächenbild sind das vier Felder, bei den Bögen vier Bögen.", "Das Minus gehört zur Zahl dahinter: (x − 2) · (y + 4) = xy + 4x − 2y − 8.", "Gleiche Glieder zusammenfassen: 5x + 2x = 7x."], "a1": {"t": "Multipliziere aus. Mach bei a) die Probe mit x = 1 und y = 1: Kommt auf beiden Seiten dasselbe heraus?", "l": ["xy + 5x + 2y + 10   (Probe: 3 · 6 = 18 und 1 + 5 + 2 + 10 = 18 ✓)", "2ab + 8a − 3b − 12"], "tipp": "Vier Felder: jeder Teil der ersten Klammer mal jeder Teil der zweiten. Bei b) gehört das Minus zur 3.", "sub": ["(x + 2) · (y + 5)", "(2a − 3) · (b + 4)"], "weg": [["(x + 2) · (y + 5) = x · y + x · 5 + 2 · y + 2 · 5", "= xy + 5x + 2y + 10", "Probe mit x = 1, y = 1: links 3 · 6 = 18", "rechts 1 + 5 + 2 + 10 = 18 ✓"], ["(2a − 3) · (b + 4) = 2a · b + 2a · 4 − 3 · b − 3 · 4", "= 2ab + 8a − 3b − 12"]]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Multipliziere aus – mit Flächenbild oder Bögen.", "l": ["ab + 2a + 3b + 6", "xy + x + 4y + 4", "10 + 2b + 5a + ab"], "tipp": "Jeder Teil der ersten Klammer mal jeder Teil der zweiten – vier Malaufgaben.", "sub": ["(a + 3) · (b + 2)", "(x + 4) · (y + 1)", "(2 + a) · (5 + b)"], "weg": [["a · b + a · 2 + 3 · b + 3 · 2", "= ab + 2a + 3b + 6"], ["x · y + x · 1 + 4 · y + 4 · 1", "= xy + x + 4y + 4"], ["2 · 5 + 2 · b + a · 5 + a · b", "= 10 + 2b + 5a + ab"]]}, {"t": "Multipliziere aus – mit Minus.", "l": ["xy + 3x − 2y − 6", "ab − a + 4b − 4"], "tipp": "Das Minus gehört zur Zahl dahinter: (−2) · y = −2y.", "sub": ["(x − 2) · (y + 3)", "(a + 4) · (b − 1)"], "weg": [["x · y + x · 3 − 2 · y − 2 · 3", "= xy + 3x − 2y − 6"], ["a · b − a · 1 + 4 · b − 4 · 1", "= ab − a + 4b − 4"]]}, {"t": "Wiederholung: Multipliziere aus bzw. klammere aus.", "l": ["3x − 12", "5 · (a + 4)"], "tipp": "a) ausmultiplizieren, b) ausklammern.", "sub": ["3 · (x − 4)", "5a + 20"], "tag": "w"}, {"t": "Stimmt das? (x + 1) · (y + 2) = xy + 2", "l": ["nein – richtig ist xy + 2x + y + 2"], "tipp": "Zeichne das Flächenbild: Wie viele Felder gibt es?", "tag": "v", "idee": "Es fehlen zwei Felder: x · 2 und 1 · y.", "weg": ["(x + 1) · (y + 2) = x · y + x · 2 + 1 · y + 1 · 2", "= xy + 2x + y + 2", "2x und y fehlen – also stimmt es nicht."]}]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Multipliziere aus.", "l": ["xy − 5x − 3y + 15", "2ab − 8a + b − 4"], "tipp": "Minus mal minus ist plus.", "sub": ["(x − 3) · (y − 5)", "(2a + 1) · (b − 4)"], "weg": [["x · y − x · 5 − 3 · y + (−3) · (−5)", "= xy − 5x − 3y + 15"], ["2a · b − 2a · 4 + 1 · b − 1 · 4", "= 2ab − 8a + b − 4"]]}, {"t": "Multipliziere aus und fasse zusammen.", "l": ["x² + 7x + 10", "x² − x − 12"], "tipp": "Zwei Felder haben x – fasse sie zusammen.", "sub": ["(x + 5) · (x + 2)", "(x − 4) · (x + 3)"], "weg": [["x · x + x · 2 + 5 · x + 5 · 2", "= x² + 2x + 5x + 10", "= x² + 7x + 10"], ["x · x + x · 3 − 4 · x − 4 · 3", "= x² + 3x − 4x − 12", "= x² − x − 12"]]}, {"t": "Rückwärts: Was fehlt? Beispiel: (x + 4) · (y + 1) = xy + x + 4y + 4 – das Glied 4y verrät die 4. Aufgabe: (x + ___) · (y + 3) = xy + 3x + 2y + 6", "l": ["2"], "tipp": "Welche Zahl mal y ergibt 2y?", "weg": ["Das Glied 2y entsteht aus ___ · y – also fehlt die 2.", "Probe: (x + 2) · (y + 3) = xy + 3x + 2y + 6 ✓"]}, {"t": "Wiederholung: Klammere so viel wie möglich aus: 12x − 8xy", "l": ["4x · (3 − 2y)"], "tipp": "In beiden Teilen stecken 4 und x.", "tag": "w", "weg": ["größter gemeinsamer Teil: 4x", "12x = 4x · 3 und 8xy = 4x · 2y", "= 4x · (3 − 2y)"]}, {"t": "Lena sagt: „Zwei Klammern mit je zwei Teilen ergeben immer vier Glieder.“ Prüfe mit (x + 5) · (x + 2).", "l": ["x² + 2x + 5x + 10", "x² + 7x + 10", "nein – es bleiben nur drei Glieder"], "tipp": "Bei b): 2x und 5x sind gleiche Glieder.", "sub": ["Multipliziere aus (vier Felder): x · x + x · 2 + 5 · x + 5 · 2 = ___", "Fasse gleiche Glieder zusammen.", "Hat Lena recht?"], "tag": "v", "idee": "Vor dem Zusammenfassen gibt es immer vier Felder. Danach können es weniger sein."}]}, "3": {"name": "Knifflig", "aufg": [{"t": "Multipliziere aus.", "l": ["8xy + 10x − 12y − 15", "xy + xz + 3x + 2y + 2z + 6"], "tipp": "Bei b) gibt es 2 · 3 = 6 Felder.", "sub": ["(2x − 3) · (4y + 5)", "(x + 2) · (y + z + 3)"], "weg": [["2x · 4y + 2x · 5 − 3 · 4y − 3 · 5", "= 8xy + 10x − 12y − 15"], ["x · y + x · z + x · 3 + 2 · y + 2 · z + 2 · 3", "= xy + xz + 3x + 2y + 2z + 6"]]}, {"t": "Vereinfache: (x + 3) · (x + 1) − x · (x + 4)", "l": ["3"], "tipp": "Beide Teile ausmultiplizieren. Das Minus gilt für den ganzen zweiten Teil.", "weg": ["(x + 3) · (x + 1) = x² + x + 3x + 3 = x² + 4x + 3", "x · (x + 4) = x² + 4x", "x² + 4x + 3 − (x² + 4x)", "= x² + 4x + 3 − x² − 4x", "= 3"]}, {"t": "Rückwärts: Was fehlt? (x + ___) · (y + ___) = xy + 5x + 2y + 10", "l": ["(x + 2) · (y + 5)"], "tipp": "x mal welche Zahl ergibt 5x? Welche Zahl mal y ergibt 2y?", "weg": ["5x entsteht aus x · 5 – in die zweite Lücke kommt 5.", "2y entsteht aus 2 · y – in die erste Lücke kommt 2.", "Probe: 2 · 5 = 10 ✓", "(x + 2) · (y + 5)"]}, {"t": "Wiederholung: −2 · (3a − 4) + 5a", "l": ["−a + 8"], "tipp": "(−2) · (−4) = +8.", "tag": "w", "weg": ["−2 · (3a − 4) + 5a", "= −6a + 8 + 5a", "= −a + 8"]}, {"t": "Ein Rechteck hat die Seiten (x + 3) und (x + 4). Jemand sagt: „Die Fläche ist x² + 12.“", "l": ["Felder: x · x, x · 4, 3 · x, 3 · 4", "x² + 4x + 3x + 12 = x² + 7x + 12", "es fehlen 4x und 3x"], "tipp": "Zeichne ein Flächenbild mit vier Feldern: oben x und 4, links x und 3.", "sub": ["Zeichne das Flächenbild und schreibe in jedes Feld die Malaufgabe.", "Addiere die vier Felder.", "Welche Felder fehlen in x² + 12?"], "tag": "v"}]}}}]};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\{([^{}\/]+)\/([^{}]+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>').replace(/\[([+−])\]/g,'<span class="rot">$1</span>');
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const tagHtml=t=>t==="v"?'<span class="tag v">💡 Verständnis</span>':t==="w"?'<span class="tag w">↩ Wiederholung</span>':"";
function aufgabe(nr,a){
  let h=`<div class="kopf">Aufgabe ${nr}${tagHtml(a.tag)}</div><div class="txt">${esc(a.tag==="w"?a.t.replace(/^Wiederholung: /,""):a.t)}</div>`;
  if(a.sub)h+="<ol>"+a.sub.map((s,i)=>`<li><b class="tb">${"abcdefgh"[i]})</b>${esc(s).replace("  →  ",'<span class="schritt">→ ')+(s.includes("  →  ")?"</span>":"")}</li>`).join("")+"</ol>";
  if(a.tipp)h+=`<details class="tipp"><summary>💡 Tipp</summary><div>${esc(a.tipp)}</div></details>`;
  return el("div","aufg",h);
}
// Rechenweg: a.weg = Zeilen (ohne Teilaufgaben) bzw. eine Zeilenliste je Teilaufgabe; „ | …“ = Umformung, grau
const wz=z=>{const [t,u]=z.split(/\s+\|\s*/);return `<div class="wz">${esc(t)}${u!==undefined?`<i>| ${esc(u)}</i>`:""}</div>`;};
const wegHtml=a=>`<button class="wegbtn" type="button" onclick="const w=this.nextElementSibling;w.hidden=!w.hidden;this.textContent=w.hidden?'Rechenweg anzeigen':'Rechenweg ausblenden';">Rechenweg anzeigen</button><div class="weg" hidden>`+
  (a.sub?a.weg.map((zs,i)=>zs?`<div class="wt">${"abcdefgh"[i]})</div>`+zs.map(wz).join(""):"").join(""):a.weg.map(wz).join(""))+`</div>`;
// Lösungen (15.10.2026, Malte): nach „Lösungen anzeigen“ erst die Aufgabe wählen – nie alle Lösungen auf einmal. Nur richtige Lösungen.
function loesung(liste){
  const box=el("div");
  const b=el("button","loesbtn");b.textContent="Lösungen anzeigen";
  const f=el("div","frag",'<p>Hast du die Aufgabe wirklich im Heft gerechnet? Zu welcher Aufgabe möchtest du die Lösung sehen?</p>');f.hidden=true;
  const kn=el("div","lwahl"),w=el("div","loes");w.hidden=true;f.appendChild(kn);
  const zeile=([nr,a])=>{const l=a.sub?a.l.map((x,i)=>`${"abcdefgh"[i]}) ${esc(x)}`).join("&nbsp;&nbsp;&nbsp; "):a.l.map(esc).join("<br>");
    return `<div class="zeile"><b>Aufgabe ${nr}:</b> ${l}${a.idee?`<span class="warum">Warum: ${esc(a.idee)}</span>`:""}${a.weg?wegHtml(a):""}</div>`;};
  liste.forEach((e,i)=>{const k=el("button","",`Aufgabe ${esc(String(e[0]))}`);k.setAttribute("aria-pressed","false");
    k.onclick=()=>{kn.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed",j===i));w.innerHTML=zeile(e);w.hidden=false;};kn.appendChild(k);});
  b.onclick=()=>{const offen=!f.hidden;f.hidden=offen;w.hidden=true;kn.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.textContent=offen?"Lösungen anzeigen":"Lösungen ausblenden";};
  box.append(b,f,w);return box;
}
// Klick-Aufgabe: mehrere Gleichungen nacheinander, Rückmeldung sofort, kein Eintippen
function klickAufgabe(nr,a){
  const box=el("div","aufg",`<div class="kopf">Aufgabe ${nr}</div><div class="txt">${esc(a.t)}</div>`);
  const knr=el("div","knr"),gl=el("div","kgl"),rm=el("div","krm"),w=el("button","kweiter");w.textContent="Nächste Gleichung ▶";w.hidden=true;
  box.append(knr,gl,rm,w);let n=0;
  const zeig=()=>{const G=a.klick[n];knr.textContent=`Gleichung ${n+1} von ${a.klick.length}`;gl.innerHTML="";rm.textContent="";rm.className="krm";w.hidden=true;
    G.forEach(([t,ok,r])=>{if(ok===null){gl.appendChild(el("span","",esc(t)));return;}
      const b=el("button","",esc(t));b.onclick=()=>{rm.textContent=r;rm.className="krm "+(ok?"ok":"nein");
        if(ok){b.className="ok";gl.querySelectorAll("button").forEach(x=>x.disabled=true);
          if(n<a.klick.length-1)w.hidden=false;else rm.textContent=r+" – Geschafft! Weiter mit Aufgabe 2.";}else b.className="nein";};gl.appendChild(b);});};
  w.onclick=()=>{n++;zeig();};zeig();return box;
}
function teil(T){
  const root=el("section","teil");
  if(D.mehrteilig)root.appendChild(el("div","teilkopf",esc(T.name)));
  root.appendChild(el("details","erin",`<summary>Erinnerung: Das brauchst du</summary><ul>${T.erinnerung.map(e=>"<li>"+esc(e)+"</li>").join("")}</ul>`));
  const v=T.a0?1:0;   // mit Klick-Aufgabe davor verschiebt sich die Nummerierung um 1
  root.appendChild(el("h2","",v?"Aufgabe 1 und 2 · für alle":"Aufgabe 1 · für alle"));
  if(v)root.appendChild(klickAufgabe(1,T.a0));
  root.append(aufgabe(1+v,T.a1),loesung([[1+v,T.a1]]));
  root.appendChild(el("h2","","Jetzt wählst du dein Niveau"));
  const wahl=el("div","wahl"),st=el("div");root.append(wahl,st);
  [["1","★"],["2","★★"],["3","★★★"]].forEach(([k,stern])=>{
    const s=T.stufen[k];
    const b=el("button","",`${stern}  ${esc(s.name)}<small>${D.untertitel[k-1]}</small>`);b.setAttribute("aria-pressed","false");
    const sec=el("section","stufe");sec.hidden=true;
    sec.appendChild(el("h2","",esc(stern+"  "+s.name)));
    s.aufg.forEach((a,i)=>sec.appendChild(aufgabe(stern+" "+(i+2+v),a)));
    sec.appendChild(loesung(s.aufg.map((a,i)=>[stern+" "+(i+2+v),a])));
    b.onclick=()=>{wahl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));st.querySelectorAll(".stufe").forEach(x=>x.hidden=x!==sec);};
    wahl.appendChild(b);st.appendChild(sec);
  });
  return root;
}
const box=document.getElementById("teile"),secs=D.teile.map(teil);
secs.forEach(s=>box.appendChild(s));
if(D.mehrteilig){
  document.getElementById("teilwahl").hidden=false;const tw=document.getElementById("tw");
  const zeig=i=>{secs.forEach((s,j)=>s.hidden=j!==i);tw.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));};
  D.teile.forEach((T,i)=>{const b=el("button","",esc(T.stunde)+`<small>${esc(T.kurz)}</small>`);b.onclick=()=>zeig(i);tw.appendChild(b);});
  zeig(D.teile.length-1);
}
</script>
