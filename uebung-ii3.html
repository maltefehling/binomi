<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Übung Kapitel II.3 · Die Lösungsformel</title>
<!-- Kapitel II Quadratische Gleichungen: Online-Übung nach dem Buchkapitel (QR-Code im Skript). Nur Aufgaben – gerechnet wird im Heft.
     Aufbau wie „I.3a Vermischte Übungen“: Aufgabe 1 für alle, dann ★ / ★★ / ★★★. Lösungen gemischt mit typischen Fehlern. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;
    --merk:#dde8f5;--merkL:#a9c1e0;--auf:#e8f4e6;--aufL:#c6e8c0;--hilf:#fdf6ea;--hilfL:#fbd9a8;--grau:#f2f2f2;--rot:#b03a2e;--gruen:#3f8f3a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{max-width:880px;margin:0 auto;padding:14px 16px 32px}
  .hinweis{background:var(--auf);border:1px solid var(--aufL);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.45;margin-bottom:12px}
  details.erin{background:var(--merk);border:1px solid var(--merkL);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:18px;line-height:1.5}
  details.erin summary{font-weight:700;color:var(--acc);cursor:pointer;min-height:30px}
  details.erin ul{margin:6px 0 0;padding-left:22px}
  h2{font-size:21px;color:var(--acc);margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--acc)}
  .aufg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .aufg .kopf{font-weight:700;color:var(--acc);font-size:18px;margin-bottom:4px}
  .aufg .txt{font-size:20px;line-height:1.45}
  .aufg ol{margin:6px 0 0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px 18px}
  .aufg li{font-size:21px;line-height:1.5;white-space:nowrap;overflow-x:auto}
  .aufg li b{color:var(--muted);font-weight:600;margin-right:6px}
  .tag{display:inline-block;font-size:14px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .tag.v{background:#fff3c4;color:#7a5b00}.tag.w{background:#e2d6f0;color:#4f2f7a}
  details.idee{margin-top:8px;font-size:18px}
  details.idee summary{color:var(--acc);cursor:pointer;font-weight:600}
  details.idee div{background:var(--grau);border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.45}
  .wahl{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .wahl button{flex:1 1 200px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;padding:12px 14px;font-size:19px;font-weight:700;min-height:56px;text-align:left}
  .wahl button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wahl small{display:block;font-weight:500;font-size:15px;opacity:.85}
  .stufe[hidden]{display:none}
  .loesbtn{border:1px solid var(--hilfL);background:var(--hilf);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:18px;font-weight:700;min-height:48px;margin-top:4px}
  .loes{background:var(--hilf);border:1px solid var(--hilfL);border-radius:12px;padding:10px 14px;margin-top:8px}
  .loes p{margin:0 0 8px;font-size:16px;color:var(--rot);font-weight:700}
  .loes .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
  .loes .grid span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;font-size:19px}
  .loes[hidden]{display:none}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
  .frage{font-size:18px;font-weight:700;color:var(--acc);margin:4px 0 2px}
  .teilkopf{font-size:22px;font-weight:800;color:var(--acc);margin:14px 0 8px}
  .teil[hidden]{display:none}
</style>
</head>
<body>
<header><h1>Übung Kapitel II.3 · Die Lösungsformel</h1></header>
<main>
  <div class="hinweis"><b>Rechne alle Aufgaben in deinem Heft.</b> Schreibe die Nummer der Aufgabe dazu. Kontrolliere erst am Ende mit den Lösungen.</div>
  <div id="teilwahl" hidden><div class="frage">Welche Stunde hattet ihr zuletzt?</div><div class="wahl" id="tw"></div></div>
  <div id="teile"></div>
  <footer>Fehling · II Quadratische Gleichungen</footer>
</main>
<script>
"use strict";
// D.teile: ein Teil pro Stunde eines aufgeteilten Buchkapitels (z. B. II.2a/b/c); Stundenauswahl nur bei aufgeteilten Kapiteln (D.mehrteilig).
const D={"untertitel": ["Mit Tipps in den Aufgaben", "Ohne Tipps, mit Runden", "Mehr Nachdenken"], "mehrteilig": true, "teile": [{"name": "Teil II.3a · Die abc-Formel", "stunde": "II.3a", "kurz": "Die abc-Formel", "erinnerung": ["Form ax² + bx + c = 0: alles auf eine Seite, rechts steht 0.", "a = Zahl vor x² (roter Stein), b = Zahl vor x (grüner Stein), c = Zahl allein (blauer Stein). Das Minus gehört zur Zahl, fehlt ein Stein, ist die Zahl 0.", "x = ( −b ± √( b² − 4ac ) ) : ( 2a ).", "Erst die Zahl unter der Wurzel ausrechnen, dann die Wurzel, dann zwei Fälle (einmal +, einmal −).", "Negative Zahlen beim Quadrieren in Klammern: ( −2 )² = 4. Gerundet wird auf zwei Stellen nach dem Komma."], "a1": {"t": "Bestimme a, b und c. Löse dann mit der abc-Formel. Runde, wenn nötig, auf zwei Stellen.", "sub": ["x² − 7x + 10 = 0", "2x² + 3x − 2 = 0", "x² + 2x − 4 = 0", "3x² − 12 = 0"], "loes": ["L = { 2 ; 5 }", "L = { −2 ; 0,5 }", "L = { −3,24 ; 1,24 }", "L = { −2 ; 2 }"], "falsch": ["L = { −5 ; −2 }", "L = { −0,5 ; 2 }", "L = { −1,24 ; 3,24 }", "L = { −4 ; 4 }"], "mix": ["L = { −3,24 ; 1,24 }", "L = { −0,5 ; 2 }", "L = { −2 ; 2 }", "L = { −2 ; 0,5 }", "L = { −1,24 ; 3,24 }", "L = { 2 ; 5 }", "L = { −4 ; 4 }", "L = { −5 ; −2 }"]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Lies a, b und c ab. Tipp: Das Minus gehört zur Zahl. Fehlt ein Stein, ist die Zahl 0.", "sub": ["4x² − 3x + 1 = 0", "x² + 5x = 0", "−2x² + 7 = 0", "6 + x² − x = 0"]}, {"t": "Löse mit der abc-Formel. Tipp: Rechne zuerst die Zahl unter der Wurzel aus und schreibe sie auf.", "sub": ["x² + 5x + 6 = 0", "x² − 4x + 3 = 0", "x² + x − 12 = 0"]}, {"t": "Stimmt das? Bei x² − 6x + 5 = 0 schreibt Tom: −b = −6.", "tag": "v", "idee": "Nein. b = −6, also ist −b = −( −6 ) = 6. Dann: 36 − 20 = 16, Wurzel 4, x = ( 6 ± 4 ) : 2, also L = { 1 ; 5 }."}, {"t": "Das Aufwärmfeld aus II.2a: x² − 4x = 0. Löse diesmal mit der abc-Formel. Tipp: c = 0."}, {"t": "Wiederholung II.2c: Löse  x² + 4x = 21  mit quadratischer Ergänzung.", "tag": "w"}], "mix": ["L = { −3 ; −2 }", "L = { 0 ; 4 }", "a = 4, b = 3, c = 1", "a = −2, b = 7, c = 0", "L = { 2 ; 3 }", "L = { −7 ; 3 }", "L = { 1 ; 3 }", "L = { 4 }", "a = 1, b = 5, c = 0", "L = { −3 ; −1 }", "L = { −3 ; 7 }", "a = 0, b = 5, c = 1", "a = −2, b = 0, c = 7", "L = { −4 ; 3 }", "a = 6, b = −1, c = 1", "a = 1, b = −1, c = 6", "L = { −3 ; 4 }", "a = 4, b = −3, c = 1"]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Löse. Runde, wenn nötig, auf zwei Stellen.", "sub": ["2x² − 5x + 2 = 0", "x² + 3x − 1 = 0", "3x² + 6x − 9 = 0", "−x² + 2x + 8 = 0"]}, {"t": "Bringe zuerst auf die Form ax² + bx + c = 0. Löse dann.", "sub": ["x² = 3x + 10", "2x² + x = 6"]}, {"t": "Lena teilt am Ende nur durch 2 statt durch 2a:  2x² + 12x − 270 = 0  →  x = ( −12 ± 48 ) : 2. Was kommt heraus? Was ist falsch?", "tag": "v", "idee": "Sie bekommt 18 und −30. Der Nenner ist aber 2a = 2 · 2 = 4. Richtig: 9 und −15."}, {"t": "Ein Rechteck ist 3 m länger als breit und 40 m² groß:  x · ( x + 3 ) = 40. Multipliziere aus und löse mit der abc-Formel. Wie lang und wie breit ist es?"}, {"t": "Wiederholung II.1: Löse  x² − 0,81 = 0.", "tag": "w"}], "mix": ["L = { −1 ; 3 }", "L = { −3,30 ; 0,30 }", "5 m × 8 m", "L = { −2 ; 1,5 }", "L = { −4 ; 2 }", "L = { −5 ; 2 }", "L = { −0,30 ; 3,30 }", "L = { 2 }", "L = { 0,5 ; 2 }", "L = { −0,9 ; 0,9 }", "L = { −1,5 ; 2 }", "L = { −2 ; 5 }", "L = { −0,09 ; 0,09 }", "L = { −2 ; 4 }", "8 m × 11 m", "L = { −3 ; 1 }"]}, "3": {"name": "Knifflig", "aufg": [{"t": "Löse.", "sub": ["0,5x² − x − 4 = 0", "4x² − 4x + 1 = 0", "x² + x + 1 = 0"]}, {"t": "Wiederholung Kapitel I: Multipliziere zuerst aus und ordne. Löse dann mit der abc-Formel (auf zwei Stellen runden).", "sub": ["( x + 2 ) · ( x − 1 ) = 10", "( 2x − 1 )² = x + 5"], "tag": "w"}, {"t": "Was passiert in der Formel, wenn die Zahl unter der Wurzel 0 ist? Warum gibt es dann nur eine Lösung?", "tag": "v", "idee": "Die Wurzel aus 0 ist 0. „+ 0“ und „− 0“ ergeben dasselbe, also gibt es nur x = −b : ( 2a )."}, {"t": "Hallenfeld ( x · 2x ) mit 3 m Freizone rundum:  ( x + 6 ) · ( 2x + 6 ) = 360. Wie breit ist das Hallenfeld?"}], "mix": ["L = { −2 ; 4 }", "18 m", "L = { −1,80 ; 0,55 }", "L = { 0,5 }", "L = { −4 ; 2 }", "L = { −1 ; 1 }", "9 m", "L = { −0,5 }", "L = { −0,55 ; 1,80 }", "L = { −4 ; 3 }", "L = { }", "L = { −3 ; 4 }"]}}}, {"name": "Teil II.3b · Anzahl der Lösungen", "stunde": "II.3b", "kurz": "Anzahl der Lösungen", "erinnerung": ["Die Zahl unter der Wurzel heißt Diskriminante:  D = b² − 4ac.", "D > 0: zwei Lösungen.   D = 0: eine Lösung.   D < 0: keine Lösung.", "Ist nur nach der Anzahl gefragt, reicht es, D auszurechnen.", "Negative Zahlen beim Quadrieren in Klammern: ( −6 )² = 36."], "a1": {"t": "Wie viele Lösungen? Rechne nur D = b² − 4ac aus.", "sub": ["x² + 4x + 3 = 0", "x² − 6x + 9 = 0", "x² + 2x + 5 = 0", "2x² − 3x − 5 = 0"], "loes": ["D = 4: zwei Lösungen", "D = 0: eine Lösung", "D = −16: keine Lösung", "D = 49: zwei Lösungen"], "falsch": ["D = 28: zwei Lösungen", "D = 72: zwei Lösungen", "D = 24: zwei Lösungen", "D = −31: keine Lösung"], "mix": ["D = −31: keine Lösung", "D = 0: eine Lösung", "D = 4: zwei Lösungen", "D = 28: zwei Lösungen", "D = 49: zwei Lösungen", "D = 72: zwei Lösungen", "D = −16: keine Lösung", "D = 24: zwei Lösungen"]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Berechne D = b² − 4ac und entscheide, wie viele Lösungen es gibt. Tipp: Lies zuerst a, b und c ab.", "sub": ["x² + 5x + 4 = 0", "x² + 2x + 1 = 0", "x² + x + 3 = 0"]}, {"t": "Löse die Gleichungen aus der Aufgabe davor, die Lösungen haben."}, {"t": "Tom: „D = −11, also gibt es zwei negative Lösungen.“ Stimmt das?", "tag": "v", "idee": "Nein. Ist die Zahl unter der Wurzel negativ, kann man die Wurzel nicht ziehen – es gibt keine Lösung."}, {"t": "Mit 24 m Band soll ein Rechteck mit 32 m² abgesteckt werden:  x² − 12x + 32 = 0. Geht das? Wie groß ist das Feld?"}, {"t": "Wiederholung II.1: Wie viele Lösungen hat  x² + 9 = 0?", "tag": "w"}], "mix": ["L = { 1 ; 4 }", "D = 13: zwei Lösungen", "L = { 1 }", "nein, geht nicht", "D = −11: keine Lösung", "D = 41: zwei Lösungen", "L = { −4 ; −1 }", "D = 9: zwei Lösungen", "L = { −1 }", "keine Lösung", "D = 0: eine Lösung", "D = 4: zwei Lösungen", "L = { −3 ; 3 }", "ja, 4 m × 8 m"]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Wie viele Lösungen? Entscheide mit D.", "sub": ["3x² − 6x + 3 = 0", "−x² + 4x − 5 = 0", "2x² + 7x + 3 = 0", "x² − 0,5x − 3 = 0"]}, {"t": "Bringe zuerst auf die Form ax² + bx + c = 0 und entscheide dann:  x² + 10 = 6x"}, {"t": "Für welche Zahl c hat  x² + 8x + c = 0  genau eine Lösung? Für welche c gibt es keine Lösung?", "tag": "v", "idee": "D = 64 − 4c. Genau eine Lösung bei D = 0, also c = 16. Keine Lösung, wenn D negativ ist, also für jedes c größer als 16."}, {"t": "Mit 40 m Band: Für welche Fläche gibt es genau eine Möglichkeit? Wie sieht das Feld dann aus?"}, {"t": "Wiederholung II.3a: Löse  2x² − 3x − 2 = 0.", "tag": "w"}], "mix": ["100 m², Quadrat 10 m × 10 m", "D = 73: zwei Lösungen", "D = 12,25: zwei Lösungen", "D = −4: keine Lösung", "c = 8; keine Lösung für c > 8", "D = 72: zwei Lösungen", "D = 36: zwei Lösungen", "c = 16; keine Lösung für c > 16", "D = −11,75: keine Lösung", "120 m²", "D = 0: eine Lösung", "L = { −2 ; 0,5 }", "D = 25: zwei Lösungen", "L = { −0,5 ; 2 }"]}, "3": {"name": "Knifflig", "aufg": [{"t": "x² + 5 = 0 hat keine Lösung, x² − 5 = 0 hat zwei. Zeige es mit D.", "tag": "v", "idee": "x² + 5 = 0: a = 1, b = 0, c = 5 → D = 0 − 20 = −20 < 0. x² − 5 = 0: c = −5 → D = 0 + 20 = 20 > 0. Wie in II.1: Das Vorzeichen entscheidet."}, {"t": "Für welche Zahlen b hat  x² + bx + 9 = 0  genau eine Lösung?"}, {"t": "Begründe: Haben a und c verschiedene Vorzeichen (z. B. 2x² + 3x − 5 = 0), gibt es immer zwei Lösungen.", "tag": "v", "idee": "Dann ist 4ac negativ, also wird bei b² − 4ac etwas dazugezählt. b² ist nie negativ – D ist also immer positiv."}, {"t": "Mit 30 m Band: Welche Fläche ist die größte, die man abstecken kann? Tipp: Für die größte Fläche gibt es genau eine Möglichkeit."}, {"t": "Wiederholung II.2c: Löse  x² − 4x = 5  mit quadratischer Ergänzung.", "tag": "w"}], "mix": ["b = −6 oder b = 6", "D = −20 bzw. D = 20", "b = −3 oder b = 3", "L = { 1 ; 5 }", "D = 20 bzw. D = −20", "56,25 m² (Quadrat 7,5 m × 7,5 m)", "L = { −1 ; 5 }", "b = 6", "60 m²"]}}}]};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const tagHtml=t=>t==="v"?'<span class="tag v">💡 Verständnis</span>':t==="w"?'<span class="tag w">↩ Wiederholung</span>':"";
function aufgabe(nr,a){
  let h=`<div class="kopf">Aufgabe ${nr}${tagHtml(a.tag)}</div><div class="txt">${esc(a.tag==="w"?a.t.replace(/^Wiederholung: /,""):a.t)}</div>`;
  if(a.sub)h+="<ol>"+a.sub.map((s,i)=>`<li><b>${"abcdefgh"[i]})</b>${esc(s)}</li>`).join("")+"</ol>";
  if(a.idee)h+=`<details class="idee"><summary>Lösungsidee anzeigen</summary><div>${esc(a.idee)}</div></details>`;
  return el("div","aufg",h);
}
function loesung(l){
  const box=el("div");
  const b=el("button","loesbtn");b.textContent="Lösungen anzeigen";
  const w=el("div","loes",'<p>Achtung: Nicht alle Ergebnisse stimmen! Findest du dein Ergebnis nicht, suche den Fehler in deiner Rechnung.</p><div class="grid">'+l.map(x=>`<span>${esc(x)}</span>`).join("")+"</div>");w.hidden=true;
  b.onclick=()=>{w.hidden=!w.hidden;b.textContent=w.hidden?"Lösungen anzeigen":"Lösungen ausblenden";};
  box.append(b,w);return box;
}
function teil(T){
  const root=el("section","teil");
  if(D.mehrteilig)root.appendChild(el("div","teilkopf",esc(T.name)));
  root.appendChild(el("details","erin",`<summary>Erinnerung: Das brauchst du</summary><ul>${T.erinnerung.map(e=>"<li>"+esc(e)+"</li>").join("")}</ul>`));
  root.appendChild(el("h2","","Aufgabe 1 · für alle"));
  root.append(aufgabe(1,T.a1),loesung(T.a1.mix));
  root.appendChild(el("h2","","Jetzt wählst du dein Niveau"));
  const wahl=el("div","wahl"),st=el("div");root.append(wahl,st);
  [["1","★"],["2","★★"],["3","★★★"]].forEach(([k,stern])=>{
    const s=T.stufen[k];
    const b=el("button","",`${stern}  ${esc(s.name)}<small>${D.untertitel[k-1]}</small>`);b.setAttribute("aria-pressed","false");
    const sec=el("section","stufe");sec.hidden=true;
    sec.appendChild(el("h2","",esc(stern+"  "+s.name)));
    s.aufg.forEach((a,i)=>sec.appendChild(aufgabe(stern+" "+(i+2),a)));
    sec.appendChild(loesung(s.mix));
    b.onclick=()=>{wahl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));st.querySelectorAll(".stufe").forEach(x=>x.hidden=x!==sec);};
    wahl.appendChild(b);st.appendChild(sec);
  });
  return root;
}
const box=document.getElementById("teile"),secs=D.teile.map(teil);
secs.forEach(s=>box.appendChild(s));
if(D.mehrteilig){
  document.getElementById("teilwahl").hidden=false;const tw=document.getElementById("tw");
  const zeig=i=>{secs.forEach((s,j)=>s.hidden=j!==i);tw.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));};
  D.teile.forEach((T,i)=>{const b=el("button","",esc(T.stunde)+`<small>${esc(T.kurz)}</small>`);b.onclick=()=>zeig(i);tw.appendChild(b);});
  zeig(D.teile.length-1);
}
</script>
</body>
</html>
