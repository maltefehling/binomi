<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Übung Kapitel II.2 · Gemischtquadratische Gleichungen</title>
<!-- Kapitel II Quadratische Gleichungen: Online-Übung nach dem Buchkapitel (QR-Code im Skript). Nur Aufgaben – gerechnet wird im Heft.
     Aufbau wie „I.3a Vermischte Übungen“: Aufgabe 1 für alle, dann ★ / ★★ / ★★★. Lösungen gemischt mit typischen Fehlern. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;
    --merk:#dde8f5;--merkL:#a9c1e0;--auf:#e8f4e6;--aufL:#c6e8c0;--hilf:#fdf6ea;--hilfL:#fbd9a8;--grau:#f2f2f2;--rot:#b03a2e;--gruen:#3f8f3a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{max-width:880px;margin:0 auto;padding:14px 16px 32px}
  .hinweis{background:var(--auf);border:1px solid var(--aufL);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.45;margin-bottom:12px}
  details.erin{background:var(--merk);border:1px solid var(--merkL);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:18px;line-height:1.5}
  details.erin summary{font-weight:700;color:var(--acc);cursor:pointer;min-height:30px}
  details.erin ul{margin:6px 0 0;padding-left:22px}
  h2{font-size:21px;color:var(--acc);margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--acc)}
  .aufg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .aufg .kopf{font-weight:700;color:var(--acc);font-size:18px;margin-bottom:4px}
  .aufg .txt{font-size:20px;line-height:1.45}
  .aufg ol{margin:6px 0 0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px 18px}
  .aufg li{font-size:21px;line-height:1.5;white-space:nowrap;overflow-x:auto}
  .aufg li b{color:var(--muted);font-weight:600;margin-right:6px}
  .tag{display:inline-block;font-size:14px;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .tag.v{background:#fff3c4;color:#7a5b00}.tag.w{background:#e2d6f0;color:#4f2f7a}
  details.idee{margin-top:8px;font-size:18px}
  details.idee summary{color:var(--acc);cursor:pointer;font-weight:600}
  details.idee div{background:var(--grau);border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.45}
  .wahl{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .wahl button{flex:1 1 200px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;padding:12px 14px;font-size:19px;font-weight:700;min-height:56px;text-align:left}
  .wahl button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wahl small{display:block;font-weight:500;font-size:15px;opacity:.85}
  .stufe[hidden]{display:none}
  .loesbtn{border:1px solid var(--hilfL);background:var(--hilf);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:18px;font-weight:700;min-height:48px;margin-top:4px}
  .loes{background:var(--hilf);border:1px solid var(--hilfL);border-radius:12px;padding:10px 14px;margin-top:8px}
  .loes p{margin:0 0 8px;font-size:16px;color:var(--rot);font-weight:700}
  .loes .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
  .loes .grid span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;font-size:19px}
  .loes[hidden]{display:none}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
  .frage{font-size:18px;font-weight:700;color:var(--acc);margin:4px 0 2px}
  .teilkopf{font-size:22px;font-weight:800;color:var(--acc);margin:14px 0 8px}
  .teil[hidden]{display:none}
</style>
</head>
<body>
<header><h1>Übung Kapitel II.2 · Gemischtquadratische Gleichungen</h1></header>
<main>
  <div class="hinweis"><b>Rechne alle Aufgaben in deinem Heft.</b> Schreibe die Nummer der Aufgabe dazu. Kontrolliere erst am Ende mit den Lösungen.</div>
  <div id="teilwahl" hidden><div class="frage">Welche Stunde hattet ihr zuletzt?</div><div class="wahl" id="tw"></div></div>
  <div id="teile"></div>
  <footer>Fehling · II Quadratische Gleichungen</footer>
</main>
<script>
"use strict";
// D.teile: ein Teil pro Stunde eines aufgeteilten Buchkapitels (z. B. II.2a/b/c); Stundenauswahl nur bei aufgeteilten Kapiteln (D.mehrteilig).
const D={"untertitel": ["Mit Tipps in den Aufgaben", "Ohne Tipps, mehrere Schritte", "Mehr Nachdenken"], "mehrteilig": true, "teile": [{"name": "Teil II.2a · Satz vom Nullprodukt", "stunde": "II.2a", "kurz": "Satz vom Nullprodukt", "erinnerung": ["Fehlt der blaue Stein (keine Zahl allein), dann: alles auf eine Seite, sodass = 0 dasteht.", "x ausklammern: x² − 4x = 0  →  x · ( x − 4 ) = 0.", "Satz vom Nullprodukt: Ein Produkt ist 0, wenn mindestens ein Faktor 0 ist: x = 0 oder x − 4 = 0.", "Nie durch x teilen – sonst geht die Lösung x = 0 verloren.", "Fehlt der grüne Stein (kein x allein), ist die Gleichung reinquadratisch: x² allein stellen, Wurzel ziehen."], "a1": {"t": "Erst entscheiden: Welcher Stein fehlt – der grüne (kein x allein) oder der blaue (keine Zahl allein)? Löse dann.", "sub": ["x² − 9x = 0", "x² − 9 = 0", "x² + 7x = 0", "2x² = 50"], "loes": ["L = { 0 ; 9 }", "L = { −3 ; 3 }", "L = { −7 ; 0 }", "L = { −5 ; 5 }"], "falsch": ["L = { 9 }", "L = { 0 ; 7 }", "L = { −7 }", "L = { −25 ; 25 }"], "mix": ["L = { −3 ; 3 }", "L = { 9 }", "L = { −5 ; 5 }", "L = { −7 }", "L = { 0 ; 9 }", "L = { 0 ; 7 }", "L = { −25 ; 25 }", "L = { −7 ; 0 }"]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Klammere x aus und löse. Tipp: x · ( x − 5 ) = 0  →  x = 0 oder x − 5 = 0.", "sub": ["x² − 5x = 0", "x² + 2x = 0", "x² − 10x = 0"]}, {"t": "Wann ist das Produkt null? Gib beide Lösungen an. Tipp: Setze jede Klammer einzeln gleich 0.", "sub": ["x · ( x − 8 ) = 0", "( x + 1 ) · x = 0", "( x − 3 ) · ( x − 6 ) = 0"]}, {"t": "Stimmt das?   x² = 6x   | : x   →   x = 6,   L = { 6 }", "tag": "v", "idee": "Nein. Beim Teilen durch x geht x = 0 verloren. Probe: 0² = 6 · 0 stimmt. Richtig: x² − 6x = 0 → x · ( x − 6 ) = 0 → L = { 0 ; 6 }."}, {"t": "Ein quadratisches Aufwärmfeld wird um 5 m verlängert und ist dann doppelt so groß. Wie lang ist eine Seite? Tipp: Der Streifen 5 · x ist so groß wie das Quadrat x · x."}, {"t": "Wiederholung: Löse  x² − 49 = 0.", "tag": "w"}], "mix": ["L = { 3 ; 6 }", "L = { 0 ; 5 }", "L = { 7 }", "L = { −2 ; 0 }", "L = { 0 ; 2 }", "L = { 5 }", "L = { −8 ; 0 }", "L = { 0 ; 8 }", "L = { −7 ; 7 }", "L = { −1 ; 0 }", "10 m", "L = { −3 ; −6 }", "5 m", "L = { 0 ; 10 }"]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Bringe zuerst alles auf eine Seite. Löse dann.", "sub": ["x² = 7x", "3x² − 12x = 0", "2x² + 8x = 0", "5x² = 15x"]}, {"t": "Löse mit dem Satz vom Nullprodukt.", "sub": ["( x − 2 ) · ( x + 9 ) = 0", "4x · ( x − 1 ) = 0"]}, {"t": "Lena sagt: „Bei einer Gleichung x² + bx = 0 ist x = 0 immer eine Lösung.“ Stimmt das? Warum?", "tag": "v", "idee": "Ja. Setzt man 0 ein, steht da 0 + 0 = 0. Beim Ausklammern steht x immer als eigener Faktor vor der Klammer."}, {"t": "Lena verlängert ein quadratisches Feld um 3 m. Das neue Feld ist dreimal so groß wie vorher. Wie lang ist eine Seite?"}, {"t": "Wiederholung: Löse  ( x + 2 )² = 36.", "tag": "w"}], "mix": ["L = { −9 ; 2 }", "L = { 4 }", "L = { 1 }", "L = { −2 ; 9 }", "L = { 7 }", "1,5 m", "L = { 0 ; 1 }", "L = { 0 ; 4 }", "3 m", "L = { −8 ; 4 }", "L = { 0 ; 12 }", "L = { 0 ; 7 }", "L = { 0 ; 3 }", "L = { −4 ; 0 }"]}, "3": {"name": "Knifflig", "aufg": [{"t": "Löse.", "sub": ["x² − 4x = 2x²", "x · ( x + 6 ) = 4x", "0,5x² = 3x"]}, {"t": "Wiederholung: Löse die Klammer mit der binomischen Formel auf. Löse dann:  ( x − 3 )² = x² + 9", "tag": "w"}, {"t": "Tom rechnet:  ( x − 2 ) · ( x − 5 ) = 10   →   x − 2 = 10  oder  x − 5 = 10. Stimmt das?", "tag": "v", "idee": "Nein. Der Satz vom Nullprodukt gilt nur, wenn rechts 0 steht. Probe mit x = 12: 10 · 7 = 70, nicht 10."}, {"t": "Rückwärts: Finde eine Gleichung der Form x² + bx = 0 mit den Lösungen 0 und −6.", "tag": "v", "idee": "Die Lösung −6 gehört zur Klammer ( x + 6 ). Also x · ( x + 6 ) = 0, ausmultipliziert x² + 6x = 0."}], "mix": ["L = { 0 ; 1,5 }", "L = { −6 ; 0 }", "L = { 0 ; 4 }", "L = { 2 }", "L = { 0 }", "L = { 0 ; 6 }", "x² − 6x = 0", "L = { −4 ; 0 }", "L = { −2 ; 0 }", "x² + 6x = 0"]}}}, {"name": "Teil II.2b · Binomische Formel rückwärts", "stunde": "II.2b", "kurz": "Binomische Formel rückwärts", "erinnerung": ["( a + b )² = a² + 2ab + b²   und   ( a − b )² = a² − 2ab + b².", "Prüfen, ob es eine binomische Formel ist: Die Zahl am Ende ist b², das Mittelstück ist 2 · b · x.", "Dann als Quadrat schreiben: x² + 6x + 9 = 121  →  ( x + 3 )² = 121.", "Wurzel ziehen, zwei Fälle: x + 3 = 11 oder x + 3 = −11.", "( x + 3 )² = 0 hat nur eine Lösung: x = −3."], "a1": {"t": "Ist die linke Seite eine binomische Formel? Wenn ja, löse. Wenn nein, schreibe „keine binomische Formel“.", "sub": ["x² + 10x + 25 = 49", "x² − 4x + 4 = 81", "x² + 6x + 8 = 0", "x² − 14x + 49 = 0"], "loes": ["L = { −12 ; 2 }", "L = { −7 ; 11 }", "keine binomische Formel", "L = { 7 }"], "falsch": ["L = { 2 }", "L = { −11 ; 7 }", "L = { −7 ; 7 }", "L = { −7 }"], "mix": ["keine binomische Formel", "L = { −7 ; 7 }", "L = { −12 ; 2 }", "L = { −7 }", "L = { 2 }", "L = { −11 ; 7 }", "L = { −7 ; 11 }", "L = { 7 }"]}, "stufen": {"1": {"name": "Mit Hilfe", "aufg": [{"t": "Schreibe als Quadrat einer Klammer. Tipp: ( x + b )² = x² + 2bx + b². Welche Zahl b passt zur Zahl am Ende?", "sub": ["x² + 2x + 1", "x² + 12x + 36", "x² − 10x + 25"]}, {"t": "Löse. Tipp: Erst als Klammer im Quadrat schreiben, dann die Wurzel ziehen – zwei Fälle!", "sub": ["x² + 4x + 4 = 25", "x² + 8x + 16 = 36", "x² − 2x + 1 = 16"]}, {"t": "Stimmt das?   x² + 6x + 9 = 49  →  x + 3 = 7  →  L = { 4 }", "tag": "v", "idee": "Es fehlt der zweite Fall: x + 3 = −7, also x = −10. Richtig: L = { −10 ; 4 }."}, {"t": "An zwei Seiten einer quadratischen Feldhälfte kommt 1 m Rand. Mit Rand ist die Fläche 81 m²:  x² + 2x + 1 = 81. Wie lang ist eine Seite der Feldhälfte?"}, {"t": "Wiederholung II.2a: Löse  x² − 7x = 0.", "tag": "w"}], "mix": ["L = { −3 ; 5 }", "L = { −10 ; 2 }", "( x + 1 )²", "9 m", "L = { 7 }", "L = { 3 }", "L = { 0 ; 7 }", "L = { −2 ; 10 }", "( x + 2 )²", "( x − 5 )²", "( x + 5 )²", "8 m", "( x + 36 )²", "L = { −7 ; 3 }", "( x + 6 )²"]}, "2": {"name": "Sicher rechnen", "aufg": [{"t": "Löse.", "sub": ["x² + 14x + 49 = 100", "x² − 16x + 64 = 4", "x² + 20x + 100 = 0", "x² − 6x + 9 = −4"]}, {"t": "Bringe zuerst die Zahl ohne x auf die rechte Seite. Löse dann.", "sub": ["x² + 6x + 9 − 64 = 0", "x² − 10x + 25 − 36 = 0"]}, {"t": "Welche Zahl muss in die Lücke, damit eine binomische Formel entsteht?", "sub": ["x² + 18x + ___", "x² − ___ x + 49"], "tag": "v", "idee": "a) Das Mittelstück 18x ist 2 · 9 · x, also b = 9 und die Zahl am Ende 9² = 81.  b) 49 = 7², also ist das Mittelstück 2 · 7 · x = 14x."}, {"t": "Eine Feldhälfte mit Rand an zwei Seiten wird mit  x² + 8x + 16 = 144  beschrieben. Wie breit ist der Rand? Wie lang ist die Feldhälfte?"}, {"t": "Wiederholung II.1: Löse  3x² − 27 = 0.", "tag": "w"}], "mix": ["Rand 8 m, Feldhälfte 4 m", "L = { 1 ; 5 }", "L = { −10 ; −6 }", "L = { 10 }", "36 und 7", "L = { −3 ; 3 }", "L = { −17 ; 3 }", "L = { −10 }", "Rand 4 m, Feldhälfte 8 m", "L = { }", "L = { −1 ; 11 }", "L = { 6 ; 10 }", "L = { −11 ; 5 }", "L = { −5 ; 11 }", "L = { 3 }", "81 und 14", "L = { −9 ; 9 }"]}, "3": {"name": "Knifflig", "aufg": [{"t": "Löse. Tipp: Auch 4x² und 9 sind Quadrate: 4x² = ( 2x )².", "sub": ["4x² + 12x + 9 = 25", "x² + x + 0,25 = 4", "9x² − 6x + 1 = 0"]}, {"t": "Tom: „x² + 6x + 5 = 0 ist fast ( x + 3 )². Ich schreibe einfach ( x + 3 )² = 0.“ Was ist falsch? Kannst du es reparieren?", "tag": "v", "idee": "( x + 3 )² ist x² + 6x + 9, also 4 mehr als x² + 6x + 5. Rechne auf beiden Seiten + 4: x² + 6x + 9 = 4, also ( x + 3 )² = 4. Dann x + 3 = 2 oder x + 3 = −2, also x = −1 oder x = −5."}, {"t": "Wiederholung Kapitel I: Multipliziere ( x − 4 )² aus. Ist das dasselbe wie x² − 16?", "tag": "w"}, {"t": "Rückwärts: Finde eine Gleichung  x² + bx + c = Zahl  mit binomischer Formel links, die die Lösungen 2 und −8 hat.", "tag": "v", "idee": "Genau in der Mitte zwischen 2 und −8 liegt −3, also steht ( x + 3 )² links. Von −3 bis 2 sind es 5, also ( x + 3 )² = 25. Ausmultipliziert: x² + 6x + 9 = 25."}], "mix": ["L = { −1,5 ; 2,5 }", "x² + 6x + 9 = 25", "L = { −3 ; 3 }", "L = { 1/3 }", "L = { −5 ; −1 }", "L = { 3 }", "x² − 6x + 9 = 25", "x² − 16, gleich", "L = { 1 }", "L = { −2,5 ; 1,5 }", "x² − 8x + 16, nicht gleich", "L = { −4 ; 1 }"]}}}]};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const tagHtml=t=>t==="v"?'<span class="tag v">💡 Verständnis</span>':t==="w"?'<span class="tag w">↩ Wiederholung</span>':"";
function aufgabe(nr,a){
  let h=`<div class="kopf">Aufgabe ${nr}${tagHtml(a.tag)}</div><div class="txt">${esc(a.tag==="w"?a.t.replace(/^Wiederholung: /,""):a.t)}</div>`;
  if(a.sub)h+="<ol>"+a.sub.map((s,i)=>`<li><b>${"abcdefgh"[i]})</b>${esc(s)}</li>`).join("")+"</ol>";
  if(a.idee)h+=`<details class="idee"><summary>Lösungsidee anzeigen</summary><div>${esc(a.idee)}</div></details>`;
  return el("div","aufg",h);
}
function loesung(l){
  const box=el("div");
  const b=el("button","loesbtn");b.textContent="Lösungen anzeigen";
  const w=el("div","loes",'<p>Achtung: Nicht alle Ergebnisse stimmen! Findest du dein Ergebnis nicht, suche den Fehler in deiner Rechnung.</p><div class="grid">'+l.map(x=>`<span>${esc(x)}</span>`).join("")+"</div>");w.hidden=true;
  b.onclick=()=>{w.hidden=!w.hidden;b.textContent=w.hidden?"Lösungen anzeigen":"Lösungen ausblenden";};
  box.append(b,w);return box;
}
function teil(T){
  const root=el("section","teil");
  if(D.mehrteilig)root.appendChild(el("div","teilkopf",esc(T.name)));
  root.appendChild(el("details","erin",`<summary>Erinnerung: Das brauchst du</summary><ul>${T.erinnerung.map(e=>"<li>"+esc(e)+"</li>").join("")}</ul>`));
  root.appendChild(el("h2","","Aufgabe 1 · für alle"));
  root.append(aufgabe(1,T.a1),loesung(T.a1.mix));
  root.appendChild(el("h2","","Jetzt wählst du dein Niveau"));
  const wahl=el("div","wahl"),st=el("div");root.append(wahl,st);
  [["1","★"],["2","★★"],["3","★★★"]].forEach(([k,stern])=>{
    const s=T.stufen[k];
    const b=el("button","",`${stern}  ${esc(s.name)}<small>${D.untertitel[k-1]}</small>`);b.setAttribute("aria-pressed","false");
    const sec=el("section","stufe");sec.hidden=true;
    sec.appendChild(el("h2","",esc(stern+"  "+s.name)));
    s.aufg.forEach((a,i)=>sec.appendChild(aufgabe(stern+" "+(i+2),a)));
    sec.appendChild(loesung(s.mix));
    b.onclick=()=>{wahl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));st.querySelectorAll(".stufe").forEach(x=>x.hidden=x!==sec);};
    wahl.appendChild(b);st.appendChild(sec);
  });
  return root;
}
const box=document.getElementById("teile"),secs=D.teile.map(teil);
secs.forEach(s=>box.appendChild(s));
if(D.mehrteilig){
  document.getElementById("teilwahl").hidden=false;const tw=document.getElementById("tw");
  const zeig=i=>{secs.forEach((s,j)=>s.hidden=j!==i);tw.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));};
  D.teile.forEach((T,i)=>{const b=el("button","",esc(T.stunde)+`<small>${esc(T.kurz)}</small>`);b.onclick=()=>zeig(i);tw.appendChild(b);});
  zeig(D.teile.length-1);
}
</script>
</body>
</html>
