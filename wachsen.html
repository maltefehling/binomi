<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Die Schachtel wächst</title>
<!-- I.2 Summen multiplizieren, Kontrolle zum Einstieg: Die Schachtel aus I.1, 3 · (4 + 6), bekommt unten 5 Reihen
     mit zwei neuen Sorten. Dann wird sie zum Flächenbild mit vier Feldern: (3 + 5) · (4 + 6) = 12 + 18 + 20 + 30 = 80. -->
<style>
  :root{
    --f1:#bcd3f2; --f2:#c6e8c0; --f3:#e2d6f0; --f4:#fbd9a8; --c1:#2e5d9f; --c2:#3f8f3a; --c3:#7b4fa0; --c4:#c0700f;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:10px 18px;font-size:17px;font-weight:700;min-height:46px;margin-bottom:12px}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 520px;max-width:640px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 280px}
  .cap{min-height:96px;font-size:21px;font-weight:600;color:var(--acc);line-height:1.4;margin:4px 0 12px}
  .calc{font-size:23px;line-height:1.7;min-height:80px}
  .s1{color:var(--c1);font-weight:700}.s2{color:var(--c2);font-weight:700}.s3{color:var(--c3);font-weight:700}.s4{color:var(--c4);font-weight:700}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Die Schachtel wächst</h1></header>
<main>
  <button class="btn" id="go">Abspielen</button>
  <div class="wrap">
    <svg id="s" viewBox="0 0 560 450" aria-label="Pralinenschachtel, die nach unten wächst und zum Flächenbild wird"></svg>
    <div class="side">
      <div class="cap" id="cap">Tippe auf „Abspielen“.</div>
      <div class="calc" id="calc"></div>
    </div>
  </div>
</main>
<footer>Fehling · Summen multiplizieren</footer>

const SLOW=1.4;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const tween=(ms,f)=>new Promise(r=>{ms*=SLOW;const t0=performance.now();const s=t=>{const k=Math.min(1,(t-t0)/ms);f(ease(k));k<1?requestAnimationFrame(s):r();};requestAnimationFrame(s);});
const wait=ms=>new Promise(r=>setTimeout(r,ms*SLOW));
let run=0;
const C=40,X0=110,Y0=70,A=4,B=6,R1=3,R2=5;
const txt=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":o.size||22,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:o.op??1});e.textContent=t;return e;};
const fade=(els,to,ms=500)=>{const f=els.map(e=>+(e.getAttribute("opacity")??1));return tween(ms,k=>els.forEach((e,i)=>e.setAttribute("opacity",f[i]+(to-f[i])*k)));};
function praline(g,r,c,sorte){
  el("rect",{x:X0+c*C,y:Y0+r*C,width:C,height:C,fill:"#fff",stroke:"#e2d6c8","stroke-width":1},g);
  el("image",{href:IMG[sorte],x:X0+c*C+4,y:Y0+r*C+4,width:C-8,height:C-8},g);
}
async function play(){
  const my=++run;const alive=()=>my===run;const say=t=>{if(alive())cap.textContent=t;};
  svg.innerHTML="";calc.innerHTML="";
  // 1. die Schachtel aus I.1
  const rahmen=el("rect",{x:X0-6,y:Y0-6,width:(A+B)*C+12,height:R1*C+12,rx:8,fill:"#f6efe6",stroke:"#8a6a4a","stroke-width":3});
  const oben=el("g",{});for(let r=0;r<R1;r++)for(let c=0;c<A+B;c++)praline(oben,r,c,c<A?"truffel":"herz");
  const lab=[txt(X0+A*C/2,Y0-30,"4"),txt(X0+A*C,Y0-30,"+",{size:18}),txt(X0+(A+B/2)*C,Y0-30,"6"),txt(X0-30,Y0+R1*C/2,"3")];
  say("Das ist Toms und Lenas Schachtel aus der letzten Stunde: 3 · (4 + 6) = 30.");
  calc.innerHTML=`3 · (4 + 6) = <span class="s1">3 · 4</span> + <span class="s2">3 · 6</span>`;
  await wait(3000);if(!alive())return;
  // 2. fünf Reihen kommen dazu
  say("Jetzt wächst die Schachtel: Unten kommen 5 Reihen mit zwei neuen Sorten dazu.");
  const unten=el("g",{opacity:0});for(let r=R1;r<R1+R2;r++)for(let c=0;c<A+B;c++)praline(unten,r,c,c<A?"kugel":"wuerfel");
  const h0=R1*C+12,h1=(R1+R2)*C+12;
  await tween(1200,k=>{rahmen.setAttribute("height",h0+(h1-h0)*k);unten.setAttribute("opacity",k);unten.setAttribute("transform",`translate(0,${(1-k)*60})`);});if(!alive())return;
  const lab2=[txt(X0-30,Y0+R1*C,"+",{size:18,op:0}),txt(X0-30,Y0+(R1+R2/2)*C,"5",{op:0})];
  await fade(lab2,1);await wait(1800);if(!alive())return;
  // 3. Flächenbild
  say("Aus der Schachtel wird ein Flächenbild. Wie viele Felder hat es jetzt?");
  const F=[[0,0,A,R1,"f1","c1","3 · 4 = 12"],[A,0,B,R1,"f2","c2","3 · 6 = 18"],[0,R1,A,R2,"f3","c3","5 · 4 = 20"],[A,R1,B,R2,"f4","c4","5 · 6 = 30"]];
  const felder=F.map(([x,y,w,h,f])=>el("rect",{x:X0+x*C,y:Y0+y*C,width:w*C,height:h*C,fill:`var(--${f})`,stroke:"var(--ink)","stroke-width":3,opacity:0}));
  await Promise.all([fade([oben,unten,rahmen],0,1200),fade(felder,1,1200)]);if(!alive())return;
  say("Vier Felder: Jede Zahl links wird mit jeder Zahl oben multipliziert.");
  const parts=[];
  for(const [x,y,w,h,,c,t] of F){
    const e=txt(X0+(x+w/2)*C,Y0+(y+h/2)*C,t,{fill:`var(--${c})`,op:0,size:21});await fade([e],1,450);
    parts.push(`<span class="s${c.slice(1)}">${t.split("=")[1].trim()}</span>`);
    calc.innerHTML="Lena: "+parts.join(" + ");await wait(900);if(!alive())return;
  }
  calc.innerHTML=`Lena: ${parts.join(" + ")} = <b>80</b><br>Tom: (3 + 5) · (4 + 6) = 8 · 10 = <b>80</b>`;
  await wait(2200);if(!alive())return;
  calc.innerHTML+=`<br><span style="font-size:19px">(3 + 5) · (4 + 6) = <span class="s1">3 · 4</span> + <span class="s2">3 · 6</span> + <span class="s3">5 · 4</span> + <span class="s4">5 · 6</span></span>`;
  say("Vergleiche mit deinem Flächenbild im Skript. Hast du alle vier Felder?");
}
document.getElementById("go").onclick=()=>{document.getElementById("go").textContent="Nochmal abspielen";play();};
</script>
