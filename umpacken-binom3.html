<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pralinen umpacken</title>
<!-- I.3c Dritte binomische Formel: Schachtel 10 · 10, eine quadratische Ecke (3 · 3 bzw. 2 · 2) wird gegessen.
     Der rechte Streifen dreht sich und legt sich unten an: Aus der L-Form wird ein Rechteck (10 + b) · (10 − b) = 100 − b². -->
<style>
  :root{
    --c2:#3f8f3a; --c3:#c0700f; --eat:#d64545; --mv:#2e5d9f;
    --ink:#1b2a3a; --muted:#5b6b7c; --acc:#1f4e79; --bg:#f4f7fb; --card:#ffffff; --line:#c9d6e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .btn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:10px 16px;font-size:17px;font-weight:700;min-height:46px}
  .btn[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 460px;max-width:560px;width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 280px}
  .cap{min-height:100px;font-size:21px;font-weight:600;color:var(--acc);line-height:1.4;margin:4px 0 12px}
  .calc{font-size:24px;line-height:1.7;min-height:80px}
  .calc .e{color:var(--eat);font-weight:700}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Pralinen umpacken</h1></header>
<main>
  <div class="bar">
    <button class="btn" id="b3" aria-pressed="false">Tom: Ecke 3 · 3</button>
    <button class="btn" id="b2" aria-pressed="false">Lena: Ecke 2 · 2</button>
  </div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 480 560" aria-label="Pralinenschachtel 10 mal 10, eine Ecke wird gegessen und der Rest zu einem Rechteck umgepackt"></svg>
    <div class="side">
      <div class="cap" id="cap">Wähle oben eine Ecke.</div>
      <div class="calc" id="calc"></div>
    </div>
  </div>
</main>
<footer>Fehling · Dritte binomische Formel</footer>

let run=0;
const N=10,C=34,X0=90,Y0=60;
const txt=(x,y,t,o={})=>{const e=el("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":o.size||20,"font-weight":o.w||700,fill:o.fill||"var(--ink)",opacity:o.op??1});e.textContent=t;return e;};
const fade=(els,to,ms=500)=>{const f=els.map(e=>+(e.getAttribute("opacity")??1));return tween(ms,k=>els.forEach((e,i)=>e.setAttribute("opacity",f[i]+(to-f[i])*k)));};
function praline(g,x,y){
  el("rect",{x,y,width:C,height:C,fill:"#fff",stroke:"#e2d6c8","stroke-width":1},g);
  el("image",{href:IMG.truffel,x:x+3,y:y+3,width:C-6,height:C-6},g);
}
async function play(k){
  const my=++run;const alive=()=>my===run;const say=t=>{if(alive())cap.textContent=t;};
  ["b3","b2"].forEach(b=>document.getElementById(b).setAttribute("aria-pressed",b==="b"+k));
  svg.innerHTML="";calc.innerHTML="";
  const r=N-k;
  // drei Teile: linker Block (10 hoch, 10 − k breit), Streifen rechts oben (10 − k hoch, k breit), Ecke (k · k)
  const links=el("g",{}),streifen=el("g",{}),ecke=el("g",{});
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    if(j<r)praline(links,X0+j*C,Y0+i*C);
    else if(i<r)praline(streifen,(j-r)*C,i*C);
    else praline(ecke,X0+j*C,Y0+i*C);
  }
  streifen.setAttribute("transform",`translate(${X0+r*C},${Y0})`);
  const rahmen=el("rect",{x:X0-4,y:Y0-4,width:N*C+8,height:N*C+8,rx:6,fill:"none",stroke:"#8a6a4a","stroke-width":3});
  const l1=[txt(X0+N*C/2,Y0-26,"10"),txt(X0-26,Y0+N*C/2,"10")];
  say("Eine quadratische Schachtel mit 10 · 10 = 100 Pralinen.");
  calc.innerHTML="100 Pralinen";
  await wait(1800);if(!alive())return;
  // 1. Ecke essen
  say(`${k===3?"Tom":"Lena"} isst unten rechts eine Ecke mit ${k} · ${k} = ${k*k} Pralinen.`);
  const mark=el("rect",{x:X0+r*C,y:Y0+r*C,width:k*C,height:k*C,fill:"var(--eat)",opacity:0});
  await fade([mark],.45,500);await wait(900);if(!alive())return;
  await fade([ecke,mark],0,800);if(!alive())return;
  calc.innerHTML=`100 <span class="e">− ${k*k}</span> = <b>${100-k*k}</b>`;
  await fade([rahmen,...l1],0,400);
  await wait(1200);if(!alive())return;
  // 2. Streifen markieren und umlegen
  say("Passt der Rest in eine rechteckige Schachtel? Wir nehmen den Streifen rechts oben …");
  const sr=el("rect",{x:0,y:0,width:k*C,height:r*C,fill:"none",stroke:"var(--mv)","stroke-width":5},streifen);
  await wait(1800);if(!alive())return;
  say("… drehen ihn und legen ihn unten an.");
  const tx0=X0+r*C,ty0=Y0,tx1=X0+r*C,ty1=Y0+N*C;
  await tween(1800,e=>streifen.setAttribute("transform",`translate(${tx0+(tx1-tx0)*e},${ty0+(ty1-ty0)*e}) rotate(${90*e})`));if(!alive())return;
  // 3. neues Rechteck
  const H=(N+k)*C,Wd=r*C;
  el("rect",{x:X0-4,y:Y0-4,width:Wd+8,height:H+8,rx:6,fill:"none",stroke:"var(--acc)","stroke-width":4});
  const lb=[txt(X0+Wd/2,Y0-26,`10 − ${k} = ${r}`,{op:0}),txt(X0+Wd+60,Y0+N*C/2,"10",{op:0,size:18}),txt(X0+Wd+60,Y0+N*C+k*C/2,`+ ${k}`,{op:0,size:18,fill:"var(--mv)"}),
    txt(X0+Wd+60,Y0+H+24,`= ${N+k}`,{op:0,size:18})];
  el("line",{x1:X0+Wd+20,y1:Y0,x2:X0+Wd+20,y2:Y0+H,stroke:"var(--muted)","stroke-width":2,"stroke-dasharray":"4 4"});
  await fade(lb,1,600);if(!alive())return;
  say(`Ein Rechteck! Es ist ${N+k} lang und ${r} breit.`);
  calc.innerHTML+=`<br>Rechteck: ${N+k} · ${r} = <b>${(N+k)*r}</b>`;
  await wait(2200);if(!alive())return;
  calc.innerHTML=`(10 + ${k}) · (10 − ${k})<br>= 10² <span class="e">− ${k}²</span><br>= 100 − ${k*k} = <b>${100-k*k}</b>`;
  say("Eine Seite ist um "+k+" länger, die andere um "+k+" kürzer – und es fehlt genau die Ecke.");
}
document.getElementById("b3").onclick=()=>play(3);
document.getElementById("b2").onclick=()=>play(2);
</script>
</body>
</html>
