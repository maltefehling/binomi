<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animation: Trapez verdoppeln</title>
<!-- II.4a Trapez (Kl. 8, Garten: Terrasse an der Hauswand). Am Beamer oder auf den Schüler-Tablets per QR.
     „Verdoppeln“: Eine Kopie dreht sich um 180° um die Mitte der rechten Seite → Parallelogramm mit Grundseite a + c = 10 m, h = 3 m → 30 m², Trapez = Hälfte = 15 m².
     Regler „obere Seite verschieben“: c wandert parallel – bei 0 ist es ein RECHTWINKLIGES Trapez (Malte 22.11.2026: auch das ist ein ganz normales Trapez), Fläche bleibt 15 m².
     Rechter Winkel als Bogen mit Punkt. -->
<style>
  :root{--acc:#1f4e79;--ink:#1b2a3a;--muted:#5b6b7c;--bg:#f4f7fb;--g:#2e5d9f;--c:#3f8f3a;--h:#c0700f}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 18px;background:var(--acc);color:#fff} header h1{font-size:24px;margin:0}
  main{max-width:1100px;margin:0 auto;padding:14px 18px 24px}
  .auftrag{background:#fff;border:2px solid var(--acc);border-radius:12px;padding:10px 14px;font-size:20px;line-height:1.45;margin-bottom:12px}
  .bild{background:#fff;border:1px solid #c9d6e5;border-radius:14px;padding:8px}
  svg{width:100%;height:auto;display:block}
  .knoepfe{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
  .knopf{min-height:56px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:#fff;font-size:20px;font-weight:700;padding:0 20px}
  .knopf.hell{background:#fff;color:var(--acc)}
  .regler{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:20px;margin:6px 0}
  .regler input{flex:1 1 300px;height:44px;accent-color:var(--acc)}
  .wert{background:#fff;border:1px solid #c9d6e5;border-radius:14px;padding:10px 14px;font-size:24px;line-height:1.55;margin-top:10px}
  .zeile{padding:2px 0} .hinweis{margin-top:8px;padding:8px 12px;border-radius:10px;background:#e8f4e6;border:1px solid #9fcf9a}
  .cg{color:var(--g);font-weight:800}.cc{color:var(--c);font-weight:800}.ch{color:var(--h);font-weight:800}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 4px}
  .fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
</style>
</head>
<body>
<header><h1>Trapez verdoppeln</h1></header>
<main>
  <div class="auftrag">Tippe auf <b>Verdoppeln</b>: Was entsteht aus zwei gleichen Trapezen? Danach: Verschiebe die <b>obere Seite c</b> – auch ganz nach links. Was passiert mit der Fläche?</div>
  <div class="bild"><svg id="svg" viewBox="0 0 640 250"></svg></div>
  <div class="knoepfe"><button class="knopf" id="dopp">⟲ Verdoppeln</button><button class="knopf hell" id="zur">Zurück</button></div>
  <div class="regler"><span>Obere Seite c verschieben</span><input type="range" id="r" min="0" max="4" step="1" value="1"></div>
  <div class="wert" id="wert"></div>
</main>
<script>
"use strict";
const svg=document.getElementById("svg"),NS="http://www.w3.org/2000/svg",K=40,X0=60,Y0=190,A_=7,C_=3,H=3;
const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
for(let i=0;i<=15;i++)mk("line",{x1:X0-40+i*K,y1:10,x2:X0-40+i*K,y2:240,stroke:"#cdd6e0"});
for(let j=0;j<=5;j++)mk("line",{x1:X0-40,y1:Y0+40-j*K,x2:X0-40+15*K,y2:Y0+40-j*K,stroke:"#cdd6e0"});
const P=(x,y)=>[X0+x*K,Y0-y*K];
const kopie=mk("polygon",{fill:"#f3c9a0",stroke:"#6b5a45","stroke-width":3,"stroke-dasharray":"8 5",opacity:0});
const trap=mk("polygon",{fill:"#d9c7a5",stroke:"#6b5a45","stroke-width":3});
const al=mk("line",{stroke:"#2e5d9f","stroke-width":6}),cl=mk("line",{stroke:"#3f8f3a","stroke-width":6});
const cu=mk("line",{stroke:"#3f8f3a","stroke-width":6,"stroke-dasharray":"10 6",opacity:0});
const hl=mk("line",{stroke:"#c0700f","stroke-width":4,"stroke-dasharray":"8 6"});
const bogen=mk("path",{fill:"none",stroke:"#c0700f","stroke-width":2.5}),punkt=mk("circle",{r:3.2,fill:"#c0700f"});
const ta=mk("text",{fill:"#2e5d9f","font-size":22,"font-weight":800,"text-anchor":"middle"}),tc=mk("text",{fill:"#3f8f3a","font-size":22,"font-weight":800,"text-anchor":"middle"});
const tc2=mk("text",{fill:"#3f8f3a","font-size":22,"font-weight":800,"text-anchor":"middle",opacity:0}),th=mk("text",{fill:"#c0700f","font-size":22,"font-weight":800});
const r=document.getElementById("r");let winkel=0,ziel=0,anim=null;
const fr=(z,n)=>`<span class="fr"><span>${z}</span><span>${n}</span></span>`;
function zeichne(){
  const s=+r.value,A=P(0,0),B=P(A_,0),Cc=P(s+C_,H),Dd=P(s,H);
  const pts=[A,B,Cc,Dd].map(p=>p.join(",")).join(" ");
  trap.setAttribute("points",pts);kopie.setAttribute("points",pts);
  const M=[(B[0]+Cc[0])/2,(B[1]+Cc[1])/2];   // Drehpunkt: Mitte der rechten Seite
  kopie.setAttribute("transform",`rotate(${winkel} ${M[0]} ${M[1]})`);kopie.setAttribute("opacity",winkel>0?1:0);
  al.setAttribute("x1",A[0]);al.setAttribute("y1",A[1]);al.setAttribute("x2",B[0]);al.setAttribute("y2",B[1]);
  cl.setAttribute("x1",Dd[0]);cl.setAttribute("y1",Dd[1]);cl.setAttribute("x2",Cc[0]);cl.setAttribute("y2",Cc[1]);
  const fertig=winkel>=179.5;   // nach dem Drehen liegt c der Kopie unten neben a
  cu.setAttribute("opacity",fertig?1:0);const E=P(A_+C_,0);cu.setAttribute("x1",B[0]);cu.setAttribute("y1",B[1]);cu.setAttribute("x2",E[0]);cu.setAttribute("y2",E[1]);
  tc2.setAttribute("opacity",fertig?1:0);tc2.setAttribute("x",(B[0]+E[0])/2);tc2.setAttribute("y",Y0+30);tc2.textContent="c";
  const F=P(s,0);hl.setAttribute("x1",Dd[0]);hl.setAttribute("y1",Dd[1]);hl.setAttribute("x2",F[0]);hl.setAttribute("y2",F[1]);
  const rr=18;bogen.setAttribute("d",`M ${F[0]+rr} ${Y0} A ${rr} ${rr} 0 0 0 ${F[0]} ${Y0-rr}`);
  punkt.setAttribute("cx",F[0]+rr*0.42);punkt.setAttribute("cy",Y0-rr*0.42);
  ta.setAttribute("x",(A[0]+B[0])/2);ta.setAttribute("y",Y0+30);ta.textContent=fertig?"a":"a = 7 m";
  tc.setAttribute("x",(Dd[0]+Cc[0])/2);tc.setAttribute("y",Y0-H*K-12);tc.textContent="c = 3 m";
  th.setAttribute("x",Dd[0]+8);th.setAttribute("y",Y0-H*K/2+8);th.textContent="h = 3 m";
  // 22.11.2026 (Malte): nie mehrere Gleichungen/Längen in einer Zeile – ein Schritt pro Zeile
  const recht=s===0?`<div class="hinweis"><b>Jetzt ist es ein rechtwinkliges Trapez – auch das ist ein Trapez.</b></div>`:"";
  const z=t=>`<div class="zeile">${t}</div>`;
  document.getElementById("wert").innerHTML=fertig?
    z(`Zwei gleiche Trapeze ergeben ein <b>Parallelogramm</b>.`)+
    z(`Grundseite = <span class="cg">a</span> + <span class="cc">c</span>`)+
    z(`Grundseite = <span class="cg">7 m</span> + <span class="cc">3 m</span> = 10 m`)+
    z(`Höhe <span class="ch">h = 3 m</span>`)+
    z(`Parallelogramm: 10 m · 3 m = 30 m²`)+
    z(`Ein Trapez ist die <b>Hälfte</b>:`)+
    z(`A = ${fr("(7 m + 3 m) · 3 m","2")}`)+
    z(`A = ${fr("30 m²","2")}`)+
    z(`A = <b>15 m²</b>`)+recht:
    z(`Trapez: <span class="cg">a = 7 m</span>`)+z(`<span class="cc">c = 3 m</span>`)+z(`<span class="ch">h = 3 m</span>`)+z(`Fläche = <b>15 m²</b>`)+
    (s!==1?z(`c verschoben – a, c und h sind gleich geblieben.`):"")+recht;
}
function drehe(){cancelAnimationFrame(anim);const t0=performance.now(),w0=winkel;
  const schritt=t=>{const f=Math.min(1,(t-t0)/1800);winkel=w0+(ziel-w0)*(1-Math.cos(Math.PI*f))/2;zeichne();if(f<1)anim=requestAnimationFrame(schritt);};anim=requestAnimationFrame(schritt);}
document.getElementById("dopp").onclick=()=>{ziel=180;drehe();};
document.getElementById("zur").onclick=()=>{ziel=0;drehe();};
r.oninput=()=>{zeichne();};
zeichne();
</script>
</body>
</html>
